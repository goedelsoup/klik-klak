# Repository configuration for `yidam`.
#
# `yidam due` reports one line per clock and closes with how many "have no interval
# declared and can never come due". That sentence cannot tell a decision from an
# omission, so every clock is answered here — declared, or declined with its reason on
# the commented key. `.yidam/decisions/inert-reports.yml` carries the argument.
#
# **The clocks are not in the same unit and nothing says so until you declare one.**
# `questions_after` counts commits; `phases_after` counts days; `catalog.ttl_days` says
# its unit in its name. An undeclared clock reports only that it is undeclared, so the
# unit is learnable in exactly one way: set a value and read what `due` prints back.

[due]

# How long an open question may stand, **in commits** — but not in commits since the
# question was asked.
#
# The `inquiry` kuten's proposed value, kept as a **tripwire rather than a gauge**. The
# number `due` counts is not the age of a question: it reported five of nine at one age,
# and those nine marker lines were written at eight distinct moments with the largest
# group sharing one being three.
#
# **The oldest question here stood since genesis and no longer stands.**
# `.yidam/decisions/control-transfer.yml` answered it with a fifth specimen, which is the
# first time a corpus question has ever been closed here and the one movement in the
# figures below that is a numerator falling. The oldest surviving marker is
# `world-flag/latched-flag.yml`'s, and the anchor this clock's gauge was written against
# is gone — an event that does not decay, until it happens.
#
# So the gauge is `crates/design-gate/tests/clock.rs`, which ages a question by the commit
# that last wrote its marker line — a lower bound, since a reword resets it — and which
# holds every figure below against what it computes. Three figures stood here before that
# check existed: one that could not be derived, one wrong in the commit that wrote it, and
# one correct then and stale since. `.yidam/decisions/unread-clock.yml`.
#
# What it covers is a fifth. `yidam open-questions` walks `.yidam/corpus/` and nothing
# else, so this clock watches 4 markers while 52 sit in `.yidam/decisions/`; the larger
# share is listed in `.yidam/decisions/README.md` and is invisible to every yidam
# command. A green `due` here is a statement about 7% of what is owed, on this
# denominator and on the wider one `crates/design-gate/tests/pages.rs` uses. It fell 17,
# 16, 15, 14, 13, 12 without a corpus question ever being closed, rose once when
# `.yidam/decisions/verb-names.yml` answered one of `authored-text`'s two, and fell back.
#
# It went to 13 for a reason none of those movements had: the **numerator** grew.
# `.yidam/decisions/input-side.yml` put a question in the corpus rather than in a record —
# whether SCI1's icon bar was a game script or an engine feature — and it was the first
# rise this figure had ever had from a question being asked about adventure games.
#
# **It went to 12 for the opposite reason, and that is the reason this figure had never
# had.** `control-transfer` closed one: `actor/player-character`'s question about switching
# between characters, open since the root commit, answered by writing the game that asks
# it. Every earlier movement was the denominator growing. That one was the numerator
# falling.
#
# **And then it happened again in the next phase**, which had never happened once before.
# `adjacency` closed `walkbox/scaled-polygon`'s. Two consecutive closures, and both were
# questions `.yidam/decisions/resolver-kind.yml` had sorted by what would close them — one
# wanting a specimen and one wanting a measurement, and both resolvers were things somebody
# could go and do. Sorting the list turned it into a queue.
#
# **And it has gone back up by a route nothing here had seen: a question reopening.**
# `.yidam/decisions/unread-specimen.yml` found that twenty-five test files held a hardcoded
# list of four specimens while the directory held five, so every census they took was
# reading four fifths of the material. One of those censuses had closed
# `puzzle/state-gate` — *"36 predicates and exactly one joins more than one atom"* — and
# the game it could not see writes seven more, one of them joining five atoms. The
# question is open again and the record that answered it has lost the premise it led with.
#
# That is a fourth kind of movement and the only one that means something is wrong. A
# denominator growing is work being written down; a numerator falling is work being
# finished; a numerator rising because somebody asked is curiosity. A numerator rising
# because an answer was wrong is a repair, and no clock can tell it from the third.
#
# **And it came back down the same phase, by the one movement this figure was built to
# hope for.** `.yidam/decisions/reads-like-writing.yml` measured the last question in the
# corpus whose resolver was a count. What is left is three waiting on testimony no artifact
# supplies, two declined with a condition, and one waiting on a judgement — so the number
# will not move again by anybody counting anything, and a green `due` from here is a
# statement about six questions none of which counting can close.
#
# **Five, and the reopening closed the way it came.**
# `.yidam/decisions/restated-guard.yml` re-decided `puzzle/state-gate` against the corpus
# that now exists and reached the same answer on entirely different grounds. So the
# numerator fell by a repair completing rather than by work finishing, which is a fifth
# kind of movement and reads identically to the second. What is left is three questions
# waiting on testimony no artifact supplies and two declined with a condition: **nothing
# in this corpus can be closed by anybody doing anything.** A green `due` from here is a
# statement about five questions, none of which the clock's ticking bears on at all.
#
# **Four, and the sentence just above was wrong about a condition.** `hotspot/static-region`
# was declined until this vocabulary had geometry. `.yidam/decisions/drawn-boundary.yml`
# made that permanent, and the scene file moved the question to the drawing layer, where
# `engine/play/tests/screen.rs` finds nothing asking for it. No new evidence arrived. Two
# later decisions had already answered it, and the marker was never re-read against them.
# A condition can be overtaken, and nothing except re-reading it notices.
#
# **Seven, and for the first time because the other side shrank.** Re-reading the records
# the same way closed three: `save-boundary`'s, answered by the graphical client, and
# `playable`'s and `engine-directory`'s, answered by phases that never went back to them.
# The corpus kept its four, so the share rose because the invisible half got smaller.
# **It has fired, and what it reports is one of four things.** `due` called nothing past this
# interval for this repository's whole life and now calls five of nine — and three of those five
# are waiting on testimony no artifact supplies, which is a condition nobody can clear. A clock
# measures duration; what would *close* a question is a property of its marker, and the four kinds
# are classified in `crates/design-gate/tests/resolvers.rs` with the argument in
# `.yidam/decisions/resolver-kind.yml`.
#
# The interval is not raised and the clock is not silenced. Raising it would hide a report that is
# correct about the thing it can see, and `inert-reports` settled that every clock here is answered
# rather than muffled. A reader who follows `due`'s arrow should land on the table, which is why it
# is named from here.
questions_after = 100

# index_after — DECLINED.
#
# No released binary can build the index this clock measures. `yidam index-build` in the
# pinned build answers "needs the `index` feature", and the build's features are
# reports, export-graph, tonpa, serve-http, vault-s3, catalog-fetch. The prelude's
# `inquiry` kuten records the same across the population: "Nobody holds one; one corpus
# declined it in writing, because no released binary can build the index the clock
# measures." This is the second decline, and that file pre-registers what a second
# means, so declining in writing is a datum rather than an absence.

# phases_after — DECLINED, on the unit.
#
# It counts inquiry refs in flight **in days**, and a phase here lives minutes: a branch
# opens, settles onto main and is deleted inside one working session. Declared at the
# kuten's 60 it reports "none past 60 day(s)" forever, which is a green light for a
# condition that cannot arise. A design whose phases spanned days would want this clock
# and would find the unit right; this one would have to count commits to learn anything,
# and the clock does not.
