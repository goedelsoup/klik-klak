class: verb
label: Verb
foundational_type:
  ontology: ufo
  type: kind
description: |
  An action the player may direct at a target — a member of the authoring vocabulary
  itself, distinct from any particular use of it. Irreducible because the vocabulary is
  what this corpus is measuring: a verb is a primitive that either earns its place or
  collapses into another.

  **That framing is this corpus's and it is not universal, and the one system whose authored
  source can be read does not share it.** Delores declares fifty-seven verbs in a list whose
  header explains how to add a fifty-eighth, uses forty-nine of them, and uses twenty-three of
  those exactly once. Nothing there earns its place; verbs are added per puzzle, and a load-time check
  that a binding names a declared verb stands in for the argument. The claim, its counts and its
  tag are carried by [prior-art/thimbleweed-park](prior-art/thimbleweed-park.yml), because a tag
  asserted in class prose is counted nowhere; this paragraph is the pointer and not the
  assertion.

  What that system bounds instead is the **schema**. Six lists declare, per verb, its position in
  the menu, its display text with noun slots, whether it takes a second object, whether the actor
  walks to the target, whether the actor reaches for it, and whether proximity is required. Three
  of those six have no property below, and one of them — whether the verb walks the actor to the
  target — is what decided `verb/walk-to`. Whether this class should hold the schema rather than
  the membership is the question that finding leaves, and nothing here answers it: adding
  properties no instance authors is the overreach
  [data-format/room-manifest](data-format/room-manifest.yml) names.
properties:
  - name: arity
    type: string
    required: true
    description: How many objects the verb takes — unary (one target) or binary (target plus second object).
  - name: surface
    type: string
    description: How the player selects it — verb bar, cursor mode, context menu, or single-click default.
  - name: default_response
    type: text
    prose: true
    description: What the verb says when directed at a target no interaction was authored for.
  - name: earns_its_place
    type: text
    prose: true
    description: >-
      What was weighed for and against this verb being irreducible, and where the weighing
      landed. Absent means the verb has not been assessed, which is a real state and not a gap.
edges:
  - relationship: originated-in
    target: prior-art
    direction: out
    description: The engine or game whose vocabulary this verb is drawn from.
  - relationship: subsumed-by
    target: verb
    direction: out
    description: >-
      A verb this one collapses into — the corpus judged it expressible by the other and kept it
      as a record of the argument rather than deleting it.
