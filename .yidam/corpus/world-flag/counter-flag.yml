class: world-flag
label: Counter Flag
description: |
  World state holding a small integer rather than a bit — how many times something has
  happened, or how far through a sequence the world is. It is seeded to test whether the
  vocabulary needs it, and the honest answer is that it may not: a counter with a known
  bound is a set of booleans, and a counter without one is rarely what an author meant.

  [inference] The case that keeps it is the ordered sequence — a puzzle requiring three
  things in order — where booleans express the state but not the ordering constraint, so
  the author writes the ordering into preconditions by hand and it is only correct by
  inspection. Whether that is enough to earn a second `domain` value in the vocabulary was the
  question here, and it is a good worked example of what the central question actually feels like
  to answer.

  **That open question has the middle as a hidden variable, and this node posed it as though it
  did not.** A counter is worth having only if something can read it, and nothing in this
  vocabulary can: preconditions are prose in the interaction table and there is no comparison
  operator anywhere in the authoring surface. Without a predicate layer, an author holding a
  counter is back to booleans and hand-written ordering, and the second `domain` value earns
  nothing. With one, `counter >= 2` states the ordering constraint *and* makes it checkable.
  [inference] So the answer is conditional — yes given the middle, no without it — and which way
  it falls is decided somewhere other than in this class. See
  [design/bounded-expression-language.md](../../../design/bounded-expression-language.md).

  **It is enough, and the case is stronger than this node made it.** The predicate layer arrived
  and `lighthouse.game` writes exactly the puzzle described above — wick, then oil, then the match,
  three things in order over a `counter lamp-prep 0..3`. Measured, it is read at **nine sites,
  every one on the lamp**, and the ordering lives entirely in the agreement between the value each
  binding writes and the value the next one requires. [verified] —
  `crates/reachability/tests/conditions.rs`.

  **This node said the ordering would be "only correct by inspection", and it was right until this
  phase.** Writing the wrong next value passes every check the corpus had: the game still resolves,
  the ending is still reachable, and *every stranding disappears*. The report improves. That is now
  refused at resolve time, because the steps turn out to be derivable — a counter can hold its
  declared floor and whatever any `set` writes, and a comparison outside that set is a branch
  nothing can reach (`crates/game-format/src/resolve.rs`). [verified]

  So the second `domain` value earns its place three times over: `counter >= 2` **states** the
  ordering, the predicate layer makes it **evaluable**, and the write/read pairs make it
  **checkable without being declared**. The third was not foreseen here and is the one that
  distinguishes a counter from the booleans this node worried it collapses into: three latched
  booleans have no successor relation to derive. [inference]
  `.yidam/decisions/named-condition.yml`.

  **This node now trips `verified-unsourced`, and the warning is correct and is about the tags
  rather than about the claims.** Both `[verified]`s above rest on committed assertions in
  `crates/` — a test that can be run and a check that refuses — and neither rests on a document,
  so a node that cites no catalog source is what the linter sees. This is the gap
  `.yidam/decisions/found-in.yml` names, arriving with a cost attached instead of a preference:
  the strongest evidence this corpus can produce about its own language is the kind its own tag
  vocabulary cannot express. [inference] Nothing is changed here; the vocabulary lives in the
  read-only prelude.
properties:
  domain: integer
  scope: global
  reversible: no
  save_semantics: |
    As for a boolean, with one addition worth naming: a counter is the state most likely to
    be incremented by a cutscene that the player skipped. [inference] Skip handling and
    counter state interact, and neither class currently says so.
links:
