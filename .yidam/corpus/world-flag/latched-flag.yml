class: world-flag
label: Latched Flag
description: |
  A boolean that can be set and never cleared. It is the shape
  [state-gate](../puzzle/state-gate.yml) asked for by name — *"a gate over a counter that only
  increments is irreversible; a gate over booleans that some other binding clears is not, and
  nothing in the vocabulary makes the difference declarable"* — and the `reversible` property on
  this class is that difference, made declarable.

  Its grounding is one feature of one system, and it is a good one. AGS documents
  `option-off-forever` as permanent: "the option is permanently disabled - no other command can
  ever turn it back on again" ([ags-manual](../../catalog/ags-manual.md)). [verified] That is a
  latch shipped as a primitive, in the one place a system built a bounded vocabulary and had to
  choose what went into it. AGS's instance is local to a conversation; this node models the
  general case as global.

  **`scope: conversation` is exercised now, by a second system, and it is not a curiosity.**
  Delores's dialogue language declares conversation-local variables with `YACK(x)`, and its
  guards read them **47 times** — more than every other kind of reference in those guards
  combined ([delores-source](../../catalog/delores-source.md)). [verified] What they record is
  what the player has been told: `knows_about_invicted`, `heard_about_job`. So the scope earns
  its place for the reason `conversation.ont.yml` says the class does — the exchange carries
  state that belongs to it — and every one of those 47 is a latch in the sense this node means.
  Still no instance in this corpus *declares* that scope; see
  [object-state](../world-flag/object-state.yml), which added a fourth value the same way.

  **The reason to declare a latch is the checker, not the author — and the reason this node gave
  for that is wrong.** It said a flag that moves one way makes the reachable space "a lattice
  rather than a graph… a walk over a partial order instead of a search over every combination",
  and marked the performance half open pending a game large enough to show it. That game was
  generated and it shows the opposite.

  **A lattice over *n* independent monotone variables has 2^n elements. It *is* every
  combination.** A generated hub — *n* tokens in one room, no order between them, all wanted at
  the gate — has no clearable state anywhere in it, and its reachable set is 2^n: **100.000% of
  the declared space at every size measured**, from two tokens to sixteen. [verified] — by a
  committed assertion rather than a document: `crates/reachability/tests/scaling.rs` generates
  the family and holds `states == 1 << n` and `observed_space == 1 << n` against it, and a
  reader who doubts this can run it. Monotonicity bounds the *path* — no configuration is
  revisited — and says nothing about how many configurations there are.

  What actually produces the collapse is **dependency**: an order between the flags, not merely
  within each one. A generated corridor whose every door needs the key behind the last one has
  3n+1 reachable states against an exponential space, and runs 128 rooms in sixteen
  milliseconds. Same language, same checker, and the difference is entirely whether the author
  ordered the puzzles. [verified] — `scaling.rs` again, holding `states == 3 * n + 1`.

  So this class keeps `reversible` for the two reasons this node gave *second* — the declaration
  is checkable, and a save that loses it makes reachable a state the author had proved
  unreachable — and not for the first. The cheap computation is not available merely because the
  flags latch.

  **The declaration is checked rather than asserted.** `crates/reachability` reports a
  violation when a flag declared latched is cleared anywhere in the reachable graph, and
  reports per counter whether it ever falls. [inference] That is what makes `reversible` worth
  having at all: a property nothing reads is a comment, and this class exists partly to give
  the property a site.

  **That question is closed, and the answer is no.** It asked for something large enough to show
  that walking a partial order beats searching. Two generated families answered it: the corridor
  is linear and the hub is exponential, and *both are made entirely of monotone variables*. The
  question was malformed — it treated monotonicity as the property that makes the search cheap,
  and monotonicity is common to both cases.

  What replaced it was narrower and answerable: **how ordered are a real game's puzzles?** That
  has since been asked of the person who invented the notation for answering it.

  Ron Gilbert's Puzzle Dependency Chart is the arrangement of a game's puzzles drawn as a graph,
  and he states its shape as a rule: "Solving one puzzle should open up 2 or 3 new ones, and then
  those collapses down… to a single solution that then opens up more non-linear puzzles", and "I
  tend to design adventures games in 'acts', where each act ends with a bottle neck to the next
  act" ([grumpy-gamer-pdc](../../catalog/grumpy-gamer-pdc.md)). [verified] Both extremes are named
  as failures in the same sentence — "too linear, or too unwieldy with choice (also bad)" — so the
  width is bounded from both sides by the aesthetics of the form.

  **A bounded width with bottlenecks is exactly the condition under which this search is cheap**,
  and the cost is measured rather than argued. Holding forty-eight puzzles fixed and varying only
  the width of each act: 97 reachable states at width 2, **129 at the prescribed 3**, 1,537 at 8,
  and 196,609 at 16. Same puzzle count, a factor of two thousand, decided by width alone. At width
  3 the count scales linearly — six hundred puzzles is 1,601 states and 73 milliseconds, a game
  larger than any published adventure and cheaper to check than the lighthouse. [verified] —
  `crates/reachability/tests/scaling.rs`.

  **Those games are generated, and what that costs is now known to be more than realism.** They are
  written by three Rust `for` loops because a corridor of sixty-four rooms cannot be written by hand
  in the language being measured. [verified] Every figure above is a correct measurement of an
  honest instance of the shape it claims to be, and none of them is evidence that an author would
  ever produce that shape, because no author could produce it here at all. See
  `.yidam/decisions/duplication.yml`. What this node rests on is the *shape* of a real game's
  puzzle dependencies, and that comes from Gilbert rather than from the generator; what the
  generator supplies is the cost of the shape once you have it.

  So the reachable set is **linear in the number of puzzles and exponential in the width of the
  dependency chart**, and design practice bounds the width at 2–5. That restores this corpus's
  tractability claim on a footing it did not have before: not as a property of the language, and
  not as a property of latching, but as a property of games designed the way the form's inventor
  designs them. [inference]

  **A measured number exists now, and it was never a retrieval.** A dependency chart is a graph of
  what must happen before what, which is a read-after-write relation over game state, and
  [delores-source](../../catalog/delores-source.md) is a shipped game by the same author whose
  source this corpus has held for four phases. Drawn: 354 units, 115 edges, and where a step
  unblocks anything it opens **2.45 on average, median 2**. [verified] Gilbert's "2 or 3", measured.

  **The distribution is where it comes apart, and the distribution is what the rule is about.**
  **43% of unblocking steps open exactly one thing**; only 36% open two or three; the mean is
  dragged up by a short tail, one step opening nine. [verified] The modal step in that game is a
  link in a chain, not a branch.

  **And the bottlenecks this node's argument depends on are almost absent.** Two gated exits in
  twenty, no layer that narrows, a longest chain of five and a whole-game antichain of 54: there is
  no act structure in it. [verified] So the condition stated above — a bounded width *with
  bottlenecks* — is not exhibited by the one shipped game available to check it against. That is not
  a refutation: a whole-game antichain is not "how many are open at once", and a demonstrator game
  is not the full-length adventure the rule was written about. What it is not any more is
  unevidenced in either direction. `.yidam/decisions/measured-width.yml` sets out the three readings
  and declines to choose. `[open]`

  **How many flags in a real game latch has its first evidence, and it points at *most*.** A
  shipped adventure game's save file is quoted in Thimbleweed Park's development diary, with real
  variable names in it ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified] The
  author-written booleans visible across that post are `talked_to_sheriff`, `ate_hotdog`,
  `ordered_hotdog`, `picked_up_tape`, `sawRaysBadge`, `sawReyesBadge`, `detective` and
  `receiverOff`. Six of the eight are records that something happened and cannot un-happen; one
  is a constant; **one is genuinely reversible**, and it is a telephone receiver being on or off
  the hook. [inference] — eight names from a blog post is not a measurement, and it is the first
  evidence this question has had that is not this corpus's own specimen.

  **The names are what separate them, and that is cheaper than a declaration.** Every latch there
  is named for an event in the past tense — *talked to*, *ate*, *picked up*, *saw* — and the one
  reversible flag is named for a state. [inference] A convention that falls out of what authors
  are actually recording, rather than one anybody imposed. It is not a substitute for the
  `reversible` property, because a checker cannot read English tense and because the convention
  will break the first time someone writes `door_open`, but it suggests the property will
  usually be predictable from the name and therefore that getting it wrong will be quiet.

  **That question is closed by counting, and it is most.** Eight names off a screenshot were never
  going to invert a schema; 41 are. A shipped game's source holds **41 boolean state slots written
  in play, of which 32 move one way — 78.0%** ([delores-source](../../catalog/delores-source.md)).
  [verified] The most common of them is `looked_at`, on ten different objects, always `YES`.

  **The convention this node proposed survives as a one-way test.** Sorting all forty by name:
  a past-tense name predicts a latch at **25 of 26**, and a condition name predicts nothing at all
  — 8 of its 15 come back. [verified] So the guess made from eight names was right about the
  latches and wrong to read the single reversible one as the other half of a rule. Its lone
  event-named exception is not one either: `valve.delores_tightened` is written by a `loosen` and a
  `tighten` and records *which of two routes* left the valve normal, so a `lookat` can say *"Guess
  Sandy or Dave figured it out"* only when the player was not the one who did.

  **And the reason is machinery, not authoring taste, which is what makes this a fact about
  vocabularies rather than about one game.** Of the nine slots that come back, two are a player
  toggle — a `VERB(loosen)` against a `VERB(tighten)` — and the other seven need somewhere to come
  back *from*: a value recomputed in `adjustLights()`, a `stateChange` callback, a span raised and
  dropped inside one `takePhoto`, an actor's own `startthread`. [verified] This design refused
  every one of those, separately and for other reasons. [inference] So in a vocabulary whose only
  writer is a player-triggered binding, latching is not the common case but very nearly the only
  one — and the four specimens bear it out, with `clear` among the eight admitted effects and used
  **zero times in 662 authored lines**. [verified] —
  `crates/reachability/tests/latch.rs`.

  What follows for the schema is `.yidam/decisions/latch-default.yml`. The short version is that
  the default is backwards in two places at once — here, where `reversible: no` is written out as
  though it were the exception, and in the format, where `latched` is the word an author types to
  get the behaviour that is already true seven times in nine.
properties:
  domain: boolean
  scope: global
  reversible: no
  save_semantics: |
    As for a boolean, with the latch itself as the thing a save must not lose. [inference] A save
    that restores a latched flag as clearable has corrupted no value — every flag reads exactly
    as it should — and has quietly made reachable a state the author had proved unreachable. That
    is a worse failure than a wrong value, because nothing about it looks wrong.

    **That failure cannot occur in this design, and finding out why closed a question in a decision
    record.** It describes a save carrying the flag's *schema* as well as its value. Here `latched`
    is a declaration in the `.game` file and not a component of the state vector, so a save holds
    values, the game file holds kinds, and the latch comes back from the source on load. [inference]
    The paragraph above is about engines whose saves carry the schema, which is the shape
    [data-format/save-state](../data-format/save-state.yml) found in the one engine it could read.
    `.yidam/decisions/save-boundary.yml`.
