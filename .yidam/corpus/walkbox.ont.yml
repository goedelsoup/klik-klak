class: walkbox
label: Walkbox
tier: authoring
foundational_type:
  ontology: ufo
  type: kind
description: |
  A region of a room's floor an actor may stand on, carrying the scale the actor draws at
  within it. Irreducible because it separates where an actor may *be* from what the room
  looks like: the pathable surface is authored independently of the background it sits under.

  **No relationship joins two walkboxes, and that is decided rather than absent.** The class page
  once refused one for want of instances — *"with one instance seeded there is nothing yet for such
  an edge to join"* — and 84 real polygons have since answered it: adjacency is exact from the
  geometry, no tolerance is needed, and it is not constant, because a door is a region that is shown
  and hidden. So a declared edge would be a copy of something that varies during play.
  [scaled-polygon](walkbox/scaled-polygon.yml) carries the measurement and
  `.yidam/decisions/adjacency.yml` the argument. **The property that answers it is `passability`,
  which this page has declared since the root commit.**

  **This is the only class in the authoring tier the `.game` surface cannot name at all**, and the
  reason is that it has no typed half: every word above is a thing an author draws. Two other
  classes are absent from the format and both have accounts — `cutscene` is collapsed into
  `interaction`, `puzzle` is derived from a flag and a binding. This one is excluded, which is a
  third thing and is recorded in `.yidam/decisions/drawn-boundary.yml`. The class is kept because
  it is this corpus's record of what the excluded half contains.
properties:
  - name: geometry
    type: string
    description: How the region is described — convex polygon, grid, or navigation mesh.
  - name: scaling
    type: text
    prose: true
    description: How an actor's drawn size varies across the region, and what that stands in for.
  - name: passability
    type: string
    description: Whether the region is always walkable or conditional on world state.
edge_policy: exhaustive
edges:
  - relationship: bounded-by
    target: room
    direction: in
    description: The room whose floor this region describes.
  - relationship: traverses
    target: actor
    direction: in
    description: An actor that moves within this region.
  - relationship: realizes
    target: subsystem
    direction: in
    description: The engine component that solves paths across this region.
  - relationship: lies-in
    target: room
    direction: out
    description: The room whose floor this surface describes.
