class: conversation
label: Topic List
description: |
  An exchange presented as a list of topics that persists across visits: topics are added by
  world events, removed when an author turns them off, and there is no path through the list.

  **It was seeded as the counter-case to [branching-tree](../conversation/branching-tree.yml)
  and it is the base case.** That inversion is this node's finding. AGS's dialog script
  distinguishes `return` — "Stops the script and returns to the choices list" — from `stop`,
  which "Ends the conversation entirely" ([ags-manual](../../catalog/ags-manual.md)). [verified]
  Running an option and coming back to the list is what a dialog does when nothing tells it
  otherwise; a tree is what you get by adding `goto-dialog` on top. The manual describes one
  feature, "Dialogs or 'dialog topics'", and never distinguishes the two shapes as different
  kinds of asset. [inference]

  **A second system, built independently, agrees.** Delores's conversations are hubs: of 91 jumps,
  33 return to a label named `main`, 30 leave, 8 reach a terminal, and the remainder go to local
  hubs of the same shape ([delores-source](../../catalog/delores-source.md)). [verified] Options
  carry `once` and `showonce` — 47 and 13 uses — which is exhaustion declared per choice, on the
  choice, and it is the only removal mechanism in the language. Nothing there descends a tree.

  Two systems is not a survey, and it is two more than this node had when it was seeded as the
  counter-case. [inference]

  This corpus had it the other way round for two phases, treating the tree as canonical and this
  as a degenerate form that probably belonged in `interaction`. The reduction argument below is
  what that reading produced, and it survives as an argument about *bindings* while failing as an
  argument about this class.

  **The argument this node was seeded on, kept because it is still half right.** A topic is a
  unary binding against an actor whose precondition is a flag and whose response is a line — so at
  the level of a *single choice*, the reduction to `interaction` holds and nothing here disputes
  it.

  What does not reduce is the container. A topic list is entered and left, suspends the ordinary
  interaction surface while it runs, and carries which of its options are visible. A set of
  bindings has none of that: no binding knows it is one of a group, and nothing in the interaction
  table records a mode the player is currently in. That is what
  [conversation.ont.yml](../conversation.ont.yml) now rests on, and it is the property this node
  shares with the tree rather than the one that separated them.

  **No relationship in this corpus writes that availability — and none needs to.**
  [conversation.ont.yml](../conversation.ont.yml) declares `held-with` and `sets` and nothing that
  changes which choices are visible, while resting its whole account of the class on a
  conversation carrying exactly that. AGS spends three of its eight dialog commands on it
  ([ags-manual](../../catalog/ags-manual.md)) [verified], and `state_scope` below records it.

  **The weighing found the answer already declared.** `world-flag.scope` has read "global,
  room-local, or **local to a conversation**" since genesis, and `conversation -sets-> world-flag`
  with it. An option's availability, and whether it has been chosen, are conversation-scoped
  boolean flags — which is what `state_scope` below has been describing all along without
  noticing it was describing a declared thing. [inference] No new class for an option, and no new
  relationship.

  **The class prose has caught up, and this node was right for longer than it was read.**
  [conversation.ont.yml](../conversation.ont.yml) went on founding the class on *carried*
  availability for four phases after this paragraph established it is a scoped flag read at display
  time. Running the reduction settles it: the exchange rewritten as a room, with `chosen` as a
  latched flag, analyses identically. [verified] —
  `crates/reachability/tests/conversation.rs`. What the class turns on is the return, not the
  availability, and `.yidam/decisions/conversation-reduction.yml` is the record.

  One third of it did not reduce and was fixed rather than argued away. `option-off-forever` is
  documented as permanent — "no other command can ever turn it back on again" [verified] — and a
  flag that can be cleared cannot express one that cannot. That is
  [world-flag/latched-flag](../world-flag/latched-flag.yml), and a **property** rather than an
  edge: a latching flag is a different kind of flag, not a different kind of relationship.

  **An option's identity is local to its exchange, and the manual says so in passing.**
  `option-off X` "Turns option X **for the current topic** off"
  ([ags-manual](../../catalog/ags-manual.md)) [verified] — so an option is numbered within a
  topic rather than within a game, and two topics may each have an option 3. [inference] That
  is a scoping rule, stated as an aside about a command, and it is the only place either
  system this corpus has read says anything about how names are spaced. It matters because
  the same question arrives for hotspots — every room has a door — and the ontology answers it
  the same way for both: whatever contains a thing owns its name. See
  [design/bounded-expression-language.md](../../../design/bounded-expression-language.md) and
  `.yidam/decisions/name-scoping.yml`.

  **And leaving is `returns-control-to`.** `interaction -opens-> conversation` declared the
  entering; `cutscene` had declared the leaving since it was seeded, and the same relationship
  fits this class without alteration. Both instances now carry it, including this one.
properties:
  structure: topic-list
  exhaustion: |
    A topic taken returns to the list unless an author disables it with `option-off`, and topics
    are added by world flags set elsewhere. [verified] for the return, [inference] for the rest.
    The corpus's earlier claim that a taken topic is "removed" was wrong in the same direction as
    everything else here: removal is authored, persistence is free.
  state_scope: |
    Mostly local. Which options are currently visible is state belonging to the exchange, held by
    `option-on` and `option-off` and readable by nothing outside it [verified]; a choice may also
    write a world flag, and that is the narrow channel to the rest of the game.

