class: conversation
label: Topic List
description: |
  An exchange presented as a list of topics that persists across visits: topics are added by
  world events, removed when an author turns them off, and there is no path through the list.

  **It was seeded as the counter-case to [branching-tree](../conversation/branching-tree.yml)
  and it is the base case.** That inversion is this node's finding. AGS's dialog script
  distinguishes `return` — "Stops the script and returns to the choices list" — from `stop`,
  which "Ends the conversation entirely" ([ags-manual](../../catalog/ags-manual.md)). [verified]
  Running an option and coming back to the list is what a dialog does when nothing tells it
  otherwise; a tree is what you get by adding `goto-dialog` on top. The manual describes one
  feature, "Dialogs or 'dialog topics'", and never distinguishes the two shapes as different
  kinds of asset. [inference]

  This corpus had it the other way round for two phases, treating the tree as canonical and this
  as a degenerate form that probably belonged in `interaction`. The reduction argument below is
  what that reading produced, and it survives as an argument about *bindings* while failing as an
  argument about this class.

  **The argument this node was seeded on, kept because it is still half right.** A topic is a
  unary binding against an actor whose precondition is a flag and whose response is a line — so at
  the level of a *single choice*, the reduction to `interaction` holds and nothing here disputes
  it.

  What does not reduce is the container. A topic list is entered and left, suspends the ordinary
  interaction surface while it runs, and carries which of its options are visible. A set of
  bindings has none of that: no binding knows it is one of a group, and nothing in the interaction
  table records a mode the player is currently in. That is what
  [conversation.ont.yml](../conversation.ont.yml) now rests on, and it is the property this node
  shares with the tree rather than the one that separated them.

  **[open] And no relationship in this corpus writes that availability.**
  [conversation.ont.yml](../conversation.ont.yml) declares `held-with` and `sets` and nothing
  that changes which choices are visible, while resting its whole account of the class on a
  conversation carrying exactly that. AGS spends three of its eight dialog commands on it
  ([ags-manual](../../catalog/ags-manual.md)) [verified], `state_scope` below records it, and
  [failure-mode/orphaned-dialogue-branch](../failure-mode/orphaned-dialogue-branch.yml) is
  entirely about what those three commands do. Documented in three places, modelled in none.

  It is left open rather than closed by adding an edge, because the missing edge has no target:
  this corpus has no node type for a single conversation option, and inventing one to hang a
  relationship on would be adding a class speculatively. Found by deriving an effect vocabulary
  from the ontology in
  [design/bounded-expression-language.md](../../../design/bounded-expression-language.md).
properties:
  structure: topic-list
  exhaustion: |
    A topic taken returns to the list unless an author disables it with `option-off`, and topics
    are added by world flags set elsewhere. [verified] for the return, [inference] for the rest.
    The corpus's earlier claim that a taken topic is "removed" was wrong in the same direction as
    everything else here: removal is authored, persistence is free.
  state_scope: |
    Mostly local. Which options are currently visible is state belonging to the exchange, held by
    `option-on` and `option-off` and readable by nothing outside it [verified]; a choice may also
    write a world flag, and that is the narrow channel to the rest of the game.

links:
  - target: ../actor/non-player-character.yml
    relationship: held-with
  - target: ../world-flag/counter-flag.yml
    relationship: sets
  - target: ../conversation.ont.yml
    relationship: instance-of
