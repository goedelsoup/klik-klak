class: subsystem
label: Interaction Resolver
description: |
  The component that takes a verb, a target and an optional second object, finds the binding
  that matches, evaluates its precondition, and produces either the response or the refusal.
  It is the engine tier's counterpart to `interaction`, and its shape is dictated by the
  vocabulary rather than the other way around.

  The design consequence worth recording is about the fallthrough. [inference] Because most
  of what a player triggers has no authored binding, this component spends most of its
  working life producing a default — so the lookup that matters for perceived quality is the
  *miss* path, not the hit path. An engine that treats the default as an error case has
  optimized the rare branch.

  It is also what makes a topic-list conversation work, which is not obvious and is worth
  stating rather than leaving to the edge. [inference] A topic list has no interior state
  and no path through it — `conversation/topic-list.yml` argues that each of its topics
  reduces to a unary binding against an actor — so the component that resolves bindings is
  already the component that runs one. The edge is therefore evidence for that reduction
  rather than an independent claim: if the reduction is wrong, this edge is wrong with it.
properties:
  responsibility: |
    Given a composed binding, produce exactly one outcome: an authored response, an authored
    refusal, or a default. Never nothing. [inference] "Never nothing" is the whole
    specification — a silent miss is the failure players read as brokenness, and it is
    entirely preventable at this boundary.
  state: |
    None across frames. Resolution is a pure function of the binding and the world state it
    reads, which is what makes it testable without a running game.
  authoring_visibility: |
    Indirect. An author never configures this component; they configure the table it reads.
    The one thing it exposes is default scoping, and this node recorded it as open in the
    vocabulary — *"would become a real configuration surface if it were settled"*.

    **It is settled, and the configuration surface it would have become does not exist.** Defaults
    scope by **entity kind × verb** and by nothing else — `unhandled_event(int what, int type)`
    ([ags-manual](../../catalog/ags-manual.md)) — and the branch of the question that mattered
    turned out to be conditional on an interface this design has never specified: an engine that
    builds its verb menu from the target offers no unauthored pair at all, so there is nothing for
    a default to stand in for ([delores-source](../../catalog/delores-source.md)). [verified] See
    [default-binding](../interaction/default-binding.yml) and
    `.yidam/decisions/default-binding.yml`. This component's exposure is therefore
    whatever the interface decides, which is not a knob on the resolver.
