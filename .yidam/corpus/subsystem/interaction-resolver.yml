class: subsystem
label: Interaction Resolver
description: |
  The component that takes a verb, a target and an optional second object, finds the binding
  that matches, evaluates its precondition, and produces either the response or the refusal.
  It is the engine tier's counterpart to `interaction`, and its shape is dictated by the
  vocabulary rather than the other way around.

  The design consequence worth recording is about the fallthrough. [inference] Because most
  of what a player triggers has no authored binding, this component spends most of its
  working life producing a default — so the lookup that matters for perceived quality is the
  *miss* path, not the hit path. An engine that treats the default as an error case has
  optimized the rare branch.

  **That is exactly backwards for this design, and the reason is a component this corpus had not
  named.** There is no miss path here: what a player can trigger is what
  [verb-menu](verb-menu.yml) showed them, and it shows authored bindings only. So this component is
  asked about an unauthored pair never, the *hit* path is the only path, and the rare branch it
  might have optimized does not exist. [inference] The same is true of the engine whose source this
  corpus holds, which reaches the same place by the same route: `openVerbsFor` filters and
  `_checkVerbValid` hides ([delores-source](../../catalog/delores-source.md)). [verified]

  The paragraph above is kept rather than corrected in place because it is true of the other branch
  — a fixed verb bar makes every cell reachable and the miss path *is* most of the work — and
  `.yidam/decisions/default-binding.yml` is the record that the two branches give different answers
  to one question. What was missing was a name for the thing that makes the difference.

  **It realizes the arrival trigger as well, and that is a claim this node had to be read against
  a shipped engine to make.** An `on-enter` binding has no verb, no target and no second object,
  so nothing above describes it, and for six phases no component in this corpus ran one —
  `.yidam/decisions/prose-edges.yml` found the hole by counting edges rather than by reading.
  The obvious repair is a fourth component, and the obvious repair is wrong. What an engine
  actually runs on arrival is a **reconciler**: of 169 statements in Delores's 17 non-empty room
  `enter` bodies, 51 move objects, actors, cameras, walkboxes and lights, 25 set `objectState` and
  `objectTouchable`, 81 drive ambient loops, 4 enable trigger regions, and **8 are game events**
  ([delores-source](../../catalog/delores-source.md)). [verified] The 132 presentation statements
  are outside this state model by `.yidam/decisions/effect-list-semantics.yml`, and the 25
  affordance statements are what [verb-menu](verb-menu.yml) computes instead of storing.
  `objectTouchable(this, Bank.open ? YES : NO)` is a shipped engine hand-writing `Ix::in_menu`.
  So the component that would have realized arrival in that engine has no work here, and what is
  left is the 8 — which is a binding with effects, which is this component. [inference]

  **The cost is that this node's specification is false for the new trigger, and the fix is a
  scope rather than a weakening.** *Never nothing* is stated below as the whole of it. Arrival
  has no default to fall through to, no refusal — [entry-binding](../interaction/entry-binding.yml)
  argues one cannot exist because *"nobody tried anything, they walked into a room"* — and it
  produces nothing in thirteen of the fourteen rooms across the four specimens. [verified] —
  `crates/reachability/tests/arrival.rs`. The guarantee exists because *a silent miss is the
  failure players read as brokenness*, and a player who has not clicked cannot read one. It was
  always a promise about the composed trigger; nothing else was ever in its scope, and nothing in
  this corpus had said so. `.yidam/decisions/arrival-realizer.yml`.

  It is also what makes a topic-list conversation work, which is not obvious and is worth
  stating rather than leaving to the edge. [inference] A topic list has no interior state
  and no path through it — `conversation/topic-list.yml` argues that each of its topics
  reduces to a unary binding against an actor — so the component that resolves bindings is
  already the component that runs one. The edge is therefore evidence for that reduction
  rather than an independent claim: if the reduction is wrong, this edge is wrong with it.
properties:
  responsibility: |
    Given a composed binding, produce exactly one outcome: an authored response, an authored
    refusal, or a default. Never nothing. [inference] "Never nothing" is the whole
    specification — a silent miss is the failure players read as brokenness, and it is
    entirely preventable at this boundary.
  state: |
    None across frames. Resolution is a pure function of the binding and the world state it
    reads, which is what makes it testable without a running game.
  authoring_visibility: |
    Indirect. An author never configures this component; they configure the table it reads.
    The one thing it exposes is default scoping, and this node recorded it as open in the
    vocabulary — *"would become a real configuration surface if it were settled"*.

    **It is settled, and the configuration surface it would have become does not exist.** Defaults
    scope by **entity kind × verb** and by nothing else — `unhandled_event(int what, int type)`
    ([ags-manual](../../catalog/ags-manual.md)) — and the branch of the question that mattered
    turned out to be conditional on an interface this design has never specified: an engine that
    builds its verb menu from the target offers no unauthored pair at all, so there is nothing for
    a default to stand in for ([delores-source](../../catalog/delores-source.md)). [verified] See
    [default-binding](../interaction/default-binding.yml) and
    `.yidam/decisions/default-binding.yml`. This component's exposure is therefore
    whatever the interface decides, which is not a knob on the resolver.
