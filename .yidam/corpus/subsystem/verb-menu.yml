class: subsystem
label: Verb Menu
description: |
  The component that, given a target and the world state, produces the set of verbs a player may
  choose from. It runs *before* there is a binding to resolve, which is why it is not
  [interaction-resolver](interaction-resolver.yml): that component takes a composed verb, target
  and second object; this one is what lets the player compose it.

  **It is named here because this design turned out to have one and had never said so.**
  `.yidam/decisions/tier-split.yml` recorded that four questions resolved at a third answer site the
  ontology has no tier for — *"a design decision about what the player is shown"* — and declined to
  invent interface classes for it. That refusal stands. This is not an interface class; it is an
  engine component in the tier that already exists, and the design decision it implements was
  already made, three times, by records that were not about a player:

  - the menu holds authored bindings and nothing stands in for an unauthored pair —
    `.yidam/decisions/default-binding.yml`
  - a binary verb's entry is keyed by its second object, so it appears while that object is carried
    — `.yidam/decisions/arity-cost.yml`
  - a `when` with no `else` withholds; a `when` with an `else` shows the entry and declines —
    `.yidam/decisions/availability.yml`

  Read together those are a complete specification, and writing them as code recovers figures that
  were counted independently by reading text: the same 17 gated hotspot bindings all carrying a
  line, and the same 3 withholdings, all outside a hotspot verb. [verified] —
  `crates/reachability/tests/menu.rs`. `.yidam/decisions/verb-menu.yml`.

  **It is built.** `engine/verb-menu` is this component: `in_menu` is the three decisions above,
  `at` is the menu at one target, and an entry now carries what the target is *called* — which it
  could not before `.yidam/decisions/authored-text.yml` stopped the parse tree discarding labels.
  [verified] — `crates/design-gate/tests/components.rs`.

  **What this component replaces in an engine that does not have one.** Affordance stored per
  object has to be put back in agreement with the world whenever the world moves, and the cheap
  moment to do it is arrival: 25 of the 169 statements in Delores's room `enter` bodies are
  `objectState` and `objectTouchable`, and `MainStreet.bankDoor` is the whole pattern in a line —
  `function enter() { objectTouchable(this, Bank.open ? YES : NO) }`
  ([delores-source](../../catalog/delores-source.md)). [verified] That is this component's
  responsibility, hand-written sixteen times at the one moment somebody remembered to write it.
  The cost of computing instead is paid every state change rather than every arrival, and the
  benefit is that nothing can be forgotten. [inference] It is also why this design has no arrival
  realizer to write: `.yidam/decisions/arrival-realizer.yml`.

  **What it is for, in one number.** Across the specimens this component holds 117 distinct
  target-and-verb entries and 1,169 slots over 203 reachable states, of which 31 entries are
  showing before the player has done anything. The reachability search reasons about 60 of the 120
  bindings, and the 60 it does not are almost exactly the 56 effect-free `look-at`s. [verified] —
  `crates/reachability/tests/menu.rs`. So roughly half of what a player is shown contributes
  nothing to any figure the instrument reports, which is the boundary of what a reachability search
  is for rather than a defect in one. **The half stayed a half across a fifth game** — 45 of 91 was
  49%, 60 of 120 is 50% — which is what makes it a fact about the vocabulary rather than about four
  files.
properties:
  responsibility: |
    Given a target and a state, produce the verbs to display and no others. The negative half is
    the load-bearing half: a verb this component withholds is one the resolver is never asked
    about, which is why [interaction-resolver](interaction-resolver.yml) can promise *never
    nothing* without a default to fall through to. [inference]

    A shipped engine names the same responsibility and puts it in one function. `openVerbsFor`
    walks the master verb list keeping `verb_id in object._known_verbs && _checkVerbValid(object,
    verb_id)`, where `_known_verbs` is reflection over the object's own `verb_` fields and
    `_checkVerbValid` consults a per-verb `okverb_` ([delores-source](../../catalog/delores-source.md)).
    [verified]
  state: |
    None. The menu is a pure function of the target and the state, recomputed whenever either
    moves — which is what makes it checkable by the same search that checks everything else, and
    what lets a binding be shown in one state and withheld in the next without anything recording
    that it changed.

    That engine agrees and says so in the one place it could not avoid saying it: `yackChoices()`
    returns *"the number of choices at the moment it is called… not the total choices to be
    shown"*, because the list is being built as the question is asked. [verified]
  authoring_visibility: |
    None directly, and one bit indirectly, which is an unusual shape worth stating. An author never
    configures this component; what they write is bindings, and the menu falls out. The single
    exception is the `else`, which decides whether a gated binding is withheld or shown-and-declined
    — the only place in this vocabulary where an author addresses the interface at all.

    **It costs nothing in the graph, which is why nobody noticed it was a choice.** The same game
    written with and without that line has the same states, transitions, strandings and
    winnability, and differs only in how many menu slots the entry occupies. [verified] —
    `crates/reachability/tests/menu.rs`.

    **And the two systems lean opposite ways.** The corpus writes the refusing form thirty times on
    a hotspot verb and the withholding form twice (`crates/reachability/tests/defaults.rs`); Delores writes 32 genuine `VERB_OK`
    withholdings against 3 `VERB_PRE` refusals ([delores-source](../../catalog/delores-source.md)).
    [verified] Eight to one toward hiding there, fifteen to one toward showing here, in systems
    that both offer the choice. [inference] Nothing here explains the difference, and the obvious
    guess — that a handful of small specimens is not a house style — is the honest one. The count
    read *seventeen to nothing* until a fifth specimen withheld twice, at the one site where a
    refusal has nobody to be said to: `talk-to` on the character the player is driving.
