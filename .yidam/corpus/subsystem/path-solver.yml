class: subsystem
label: Path Solver
description: |
  The component that finds a route across a room's walkbox set from where an actor is to
  where it was told to go, and reports arrival.

  **This node said the interaction resolver depends on it, and it does not.** The reason given was
  that *"most bindings wait on arrival before resolving — the one hard coupling between the two
  halves of this engine, and it comes from the vocabulary rather than from any implementation
  choice."* It comes from a vocabulary, and not from this one: `.yidam/decisions/drawn-boundary.yml`
  keeps only the half an author types, so a `walk-to` writes `move <room>`, **arrival is the room**,
  and nothing waits. In a design with geometry the coupling is real and it is the hard one; the
  claim is kept here as a conditional and the edge is cut. [inference] —
  `.yidam/decisions/declared-edge.yml`.

  **Two different things are called arrival here and only one of them is this component's.**
  Reaching a point inside a room is what a binding waits on, and that is the coupling above.
  Reaching a *room* is a trigger in its own right, and it fires whether or not anybody was walking
  — a `move` effect arrives somewhere without a path being solved at all. The first is reported by
  this component; the second is realized by
  [interaction-resolver](interaction-resolver.yml), which was for six phases realized by nothing.
  `.yidam/decisions/arrival-realizer.yml`. [inference]

  **It is built.** `engine/path-solver` is this component: `solve` takes a walkbox set, a start
  point and a goal, and answers with a route or with which of two failures it met.

  **The failure named here is the rarer of the two, and the other one had no name.** This node said
  the failure it owns is the unreachable destination — a click inside a walkbox that no path from
  the current one connects to. With a shipped game's cell door shut that is **47 parts per thousand
  of the floor** in one room and 67 in the other, while **33% and 34% of the floor's own bounding
  box is not floor at all**. [verified] — `engine/path-solver/tests/delores.rs`. A bounding box is
  the kindest framing available, since these floors are strips 33 and 45 pixels tall against room
  images the catalog records at 180 and 240 ([delores-source](../../catalog/delores-source.md)), so
  the real share is several times that. [inference] A wall is a boring failure and a shut door is
  not, but a component that reports only the interesting one returns nothing for most of what a
  player clicks. `Route` has three variants for that reason.

  **And the choice this node left to an author is not one an author can make.** It asked which of
  two answers to an unreachable click was meant — *doing nothing reads as a broken click; walking
  as far as possible reads as intent the player did not have* — and called the absence of a way to
  say so a gap in the vocabulary. It is not. An author never writes a region
  (`.yidam/decisions/drawn-boundary.yml`), so there is nowhere to put the answer and no reason to
  want one per region: it is a single constant, chosen once, by whatever runs the component. Both
  failure variants carry the far end of the second arm and neither takes it.

  **Measured, the two arms are as far apart as two arms get, and the dangerous one is the one that
  looks like success.** An actor told to walk into the shut cell walks **up to 412 pixels and stops
  10 short**; the other arm moves it none. Ten pixels is invisible in a floor strip 33 pixels tall,
  and it is ten because the hidden door is a quad **7 pixels thick** — in both rooms, independently
  — so *as far as possible* parks the actor flat against the door, exactly where a player expects
  to end up and exactly where they would end up if it were open. [verified] The same answer comes
  back for `natalie_desk`, a region a shipped game hides on entry and never shows again: stop 13
  pixels short after walking up to 288. **A door and a defect are the same behaviour** and nothing
  in the geometry separates them, which is `.yidam/decisions/adjacency.yml`'s finding arriving from
  behaviour instead of from gaps.

  **It was the only component whose evidence is borrowed; calling that permanent was too strong.**
  The other three run against `design/specimen/`, five games written in the vocabulary this corpus is about. No
  `.game` file states a polygon. The initial evidence came from two of *Delores*'s fifteen rooms,
  transcribed by the instrument and **read** by the engine's test rather than copied into it.
  The graphical client now supplies separate scene data, without changing that format boundary.
  Its own `authoring_visibility` had the reason all along without drawing it — *"an author draws walkboxes and never touches this"* — and drawn, rather
  than typed, is exactly where the line falls. [inference]

  **For six phases this node said something stronger and wrong**: that it was *"the only subsystem
  with no `[verified]` claim, and the only one that never will have one"*, because *"there is
  nothing for a check to read"*. The premise is `.yidam/decisions/drawn-boundary.yml`'s and is
  about the `.game` **format**, where it holds. The conclusion is about **every possible check**,
  and the phase directly after that one measured a coordinate space — 290 within-room pairs, 66
  sharing an exact edge, over 84 polygons. [verified] A conclusion outliving the argument that held
  it up is `.yidam/decisions/restated-guard.yml`'s shape, and here it kept a specified component
  unbuilt. `.yidam/decisions/unbuilt-solver.yml`.

  **The missing client is built.** The `screen` binary in `engine/play` uses separate room geometry
  to walk to a target before resolving its binding. `engine/play/tests/screen.rs` checks that the
  world cannot act during that walk. [verified] `.yidam/decisions/runtime-boundaries.yml` records
  the change. The terminal remains a separate client with no within-room movement.

  **Connectivity alone was not a valid route.** Joining portal midpoints could leave a concave
  polygon between valid waypoints. The solver now checks complete visibility segments and finds
  turns at polygon vertices; invalid rings are reported separately. Its unit tests reproduce the
  concave failure and verify the returned segments. [verified]
properties:
  responsibility: |
    Given a start point, a goal point and a walkbox set, return a path or report that none
    exists. Reporting *that none exists* is half the job and the half most often left out.
  state: |
    None across frames, given the walkbox set. Where walkboxes are state-dependent the
    solver must be re-run rather than cached, which is a cost `walkbox.passability` implies
    and does not name.
  authoring_visibility: |
    None. An author draws walkboxes and never touches this. That is the cleanest boundary in
    the engine tier and it is worth holding — a solver with authoring knobs is a solver whose
    behaviour varies per room for reasons nobody records.
links:
