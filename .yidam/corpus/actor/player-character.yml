class: actor
label: Player Character
description: |
  The actor that takes player input: clicks resolve into movement toward a point, and
  interactions are performed by this actor at the target. It is the anchor the whole
  vocabulary is written from — "the player" in every interaction's precondition means this
  actor's position, inventory and state.

  The reason *player* is a role this actor plays rather than a class of its own is that
  control transfers. [inference] A game in which the player switches between characters has
  two actors that each take input at different times, and modeling the controlled one as a
  distinct kind means the transfer is a change of kind — which is exactly the thing UFO
  says a kind cannot undergo. Whether that transfer needs vocabulary beyond a world flag
  naming the controlled actor is `[open]`.

  **This node has no `[verified]` claim and no source, and that is a standing rather than a
  backlog.** Almost everything it states is on the far side of a boundary this design has always
  had and only now records: pathfinding to a clicked point, a walk cycle scaled by the region the
  actor stands in, arrival at a target. A `.game` file can say `<actor> in <room>` and nothing
  finer, so no check here can reach a claim about any of it, and none ever will without giving the
  format coordinates. [inference] `.yidam/decisions/drawn-boundary.yml`.

  The class page one directory away carried this node's open question a second time, in a spelling
  no tool reads, from the root commit until [action-pages](../../decisions/action-pages.yml)
  emptied it. One question to a node is a rule with a check; the same question on the class's other
  file was outside both.
properties:
  control: player-input
  locomotion: |
    Pathfinds to a clicked point within the current walkbox set, drawing a walk cycle
    scaled by the walkbox it stands in. Arrival is what most interactions wait on: the
    binding resolves when the actor reaches the target, not when the click lands.
  speech: overhead-text
links:
  - target: ../room/single-screen.yml
    relationship: occupies
  - target: ../walkbox/scaled-polygon.yml
    relationship: traverses
  - target: ../actor.ont.yml
    relationship: instance-of
