class: cutscene
label: Cutscene
tier: authoring
foundational_type:
  ontology: ufo
  type: kind
description: |
  A sequence that runs without player input, moving actors and changing state on its own
  schedule. Whether it is irreducible was seeded as a live question — it may prove to be an
  interaction whose response is long and whose input is locked — and the class exists so that the
  collapse could be argued rather than assumed.

  **It was argued and it collapsed, completely.** Every property reduces, every trigger it claimed
  is housed somewhere else or has no occasion at all, and no relationship in this ontology points
  at this class. [scripted-sequence](cutscene/scripted-sequence.yml) carries the argument and its
  evidence; `.yidam/decisions/threshold-trigger.yml` closes the last of it.

  The class is kept rather than withdrawn, for the reason [give-to](verb/give-to.yml) was kept: a
  deleted node leaves the next author free to propose this from scratch, and what is valuable here
  is the refusal and not the entry. **What it is not any more is an open question.**

  `returns-control-to` below is the sharpest thing this class taught, and it taught it by failing.
  [conversation](conversation.ont.yml) declares the same relationship and survives its own reduction
  on exactly that ground — a mode sits beside the room and carries the return — while this class
  cannot, because a response here is instantaneous. The identical edge is load-bearing one class
  over and inert here. The claim is carried and tagged by
  [scripted-sequence](cutscene/scripted-sequence.yml); this paragraph is the pointer and not the
  assertion.

  Retyped from `event` to `kind` on 2026-09-09, for the reason `conversation` was: every instance
  of this class is an authored sequence — something that persists and is edited — rather than an
  occurrence, which unfolds and is over. The *playing* of a cutscene is an event and this corpus
  holds no node for it, because a corpus about an authoring vocabulary has no reason to.
properties:
  - name: trigger
    type: text
    prose: true
    description: What causes the sequence to begin.
  - name: skippable
    type: string
    description: Whether the player may cut the sequence short, and what state results if they do.
  - name: control_return
    type: text
    prose: true
    description: Where control is returned to when the sequence ends.
edge_policy: exhaustive
edges:
  - relationship: plays-in
    target: room
    direction: out
    description: The room the sequence takes place in.
  - relationship: sets
    target: world-flag
    direction: out
    description: World state the sequence writes.
  - relationship: returns-control-to
    target: actor
    direction: out
    description: The actor control is handed back to when the sequence ends.
