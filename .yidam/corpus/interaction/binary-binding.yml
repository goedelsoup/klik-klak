class: interaction
label: Binary Binding
description: |
  A verb applied to a target together with a carried object — "use crowbar with crate" —
  resolving to a response and, usually, a write to world state. This is the node the whole
  relator argument is about: the response belongs to the *binding*, not to the crowbar and
  not to the crate, and an engine that stores it on either one has to answer where the other
  half lives.

  The combinatorics are the finding. [inference] A binary verb over n hotspots and m carried
  items has n×m authorable cells, so this shape is where a vocabulary's cost stops being
  linear. This node then said every engine examined here fills the overwhelming majority of those
  cells with a single shared refusal, and that *the default is doing more authoring work than the
  authored content is.*

  **The count is right and the corpus had never done it.** Two of this design's six verbs take a
  second object, so the four specimens are **396 cells and not 252** — the figure
  `.yidam/decisions/default-binding.yml` computed as 42 sites × 6 verbs — and the authored density
  is 22.0% rather than 34.5%. [verified] — `crates/reachability/tests/arity.rs`. The same error is
  in that record's other side and larger: 164 objects against 57 verbs is 9,348 only if none of the
  57 is binary, and eighteen are. Counted properly it is **50,676 cells with 203 authored — 0.40%**
  ([delores-source](../../catalog/delores-source.md)). [verified]

  **And the second sentence is refuted by the one engine whose source this corpus holds.** There is
  no shared refusal in those cells. `_checkVerbValid` returns `NO` for every binary verb, so none is
  ever offered in a menu; a binary interaction is a drag, and `UIHelpers` walks the binary verb list
  looking for one the target accepts. If none accepts, `drag_verb` stays null and the drop runs
  `if (drag_verb && drag_noun2)` — **nothing happens at all.** [verified] Not a line, not a shrug.
  The 50,473 unauthored cells contain silence.

  So the explosion is real and it is free, because a system that never visits an unauthored cell
  does not have to have an answer for one. [inference] The combinatorics are a cost only where
  something must stand in, and `default-binding` established that neither this design nor that
  engine is such a system. `.yidam/decisions/arity-cost.yml`.
properties:
  shape: binary
  response: |
    An action performed on the target using the carried item, and a write to world state
    recording that it happened. The write is what makes the binding matter beyond the
    moment: without it the same binding resolves identically forever.

    Folding the two into one property may not survive, this said. A bounded effect vocabulary is
    a closed list and authored prose is not one, so a specimen written in the proposed language
    splits every binding into a `say` and a `do`
    ([design/specimen](../../../design/specimen/README.md)). [inference] If effects are ever
    to be checked rather than read, this property is two properties, and `interaction.ont.yml`
    describes a world in which it is one.

    **The condition is met and the conclusion does not follow, which is the interesting half.**
    Effects are checked now, three ways: an exhaustive match holds every variant to a declared
    relationship, `dead_writes` refuses two writes to one slot in a list, and `unreachable_values`
    refuses a guard no holdable value satisfies (`crates/game-format`). [verified] And the model
    went further than a split — `Binding` carries `effects` and **no text at all**, so this
    corpus's instrument does not merely separate saying from doing, it discards the saying.

    **But `interaction.ont.yml` is not wrong to describe one property, because the world it
    describes has one.** `.yidam/decisions/effect-half.yml` established that in every engine read
    here the effect list and the presentation list are *the same list*: in Dinky a response body
    puts `sayLine`, `playAnimation`, `breaktime` and `pickupObject` side by side, indistinguishable,
    and 1,328 call sites were classified before the state writes could be separated out at 7.3%
    ([delores-source](../../catalog/delores-source.md)).
    A class describing what a binding does when it resolves is describing that.

    So the split is **this design's decision and not a correction to the ontology** — and it is the
    unusual choice rather than the natural one, which is worth having written down where somebody
    might otherwise read the ontology as an oversight. [inference] What the property should say is
    that the two are one in practice and separable in principle, and where they were separated,
    what it bought.
  precondition: |
    The item is carried, the target is present, and any gating flag holds. [inference] The
    first two are structural and enforceable by the format; only the third is authored, which
    suggests a format that expresses the first two implicitly and asks only for the third.

    **That sentence turned out to be the answer to a question two nodes away, and nobody had read
    it as one.** `verb/use-with` asked whether a binary verb could be reduced to unary verbs over
    richer state, and it can — exactly, with every figure on every specimen unchanged
    (`crates/reachability/tests/arity.rs`). [verified] What the reduction does is move *the item is
    carried* out of the first group and into the third. The verb survives on this property rather
    than on any claim about what the puzzles need. [inference]
    `.yidam/decisions/binary-dimension.yml`.
  refusal: |
    Authored per binding where the precondition is authored. [inference] A refusal that names
    which of the two objects was wrong leaks information about which half was right, and that
    leak is sometimes the intended hint and sometimes an unintended one. Nothing in the
    vocabulary lets an author say which.

    **That last sentence is the availability question, written eleven months before it was asked**,
    and the vocabulary does let an author say which: a `when` with no `else` under it withholds the
    binding and leaks nothing, and a `when` with an `else` offers it and says the line.
    `.yidam/decisions/availability.yml`. What the specimens show is that the author never chose —
    all seventeen gated bindings on a hotspot verb carry a line. [verified]

    **And a binary binding has a third state the unary one does not, which is why two of this
    corpus's refusals were unreachable.** `ferry`'s gate said *"You can feel the bar but not the
    catch"* under `use-with lantern` with no guard at all, and `lighthouse`'s hinge said *"It
    squeals"* the same way. Neither can run: without the lantern the binding is not offered, and
    with it there is nothing to fail. The second key had already refused. [verified] —
    `crates/game-format/tests/refusals.rs`, and both lines are deleted.

    **The same naming turns out to matter to the checker and not only to the player**, which this
    property did not consider. `lighthouse.game`'s committed defect is reported as *consumption of
    `oil-can` at `base.hinge`*; with the second object moved into a guard the same states are still
    stranded by the same binding for the same cause, and nothing can say what was spent. [verified]
    So a design that drops arity loses a diagnostic as well as a hint, and the two are the same
    fact read by different readers. [inference]

    Both `[verified]` claims added to this node rest on a committed test rather than a document, and
    for four phases this node linked no catalog entry, so `yidam lint` reported it as
    `verified-unsourced`. It no longer does, and for the same unearned reason
    [portable-object](../inventory-item/portable-object.yml) stopped: the description above now
    cites a source for a different claim, and one citation silences the rule for a whole node. The
    two claims here are as unsourced as they were. `.yidam/decisions/found-in.yml` names the gap and
    [consuming-binding](../interaction/consuming-binding.yml) is the node still carrying the
    warning — which this sentence got wrong for four phases by naming `counter-flag`, a node
    silenced the same way this one was. Both pointers are checked now rather than maintained
    (`.yidam/decisions/evidence-kinds.yml`).
