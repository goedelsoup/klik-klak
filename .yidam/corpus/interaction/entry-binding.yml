class: interaction
label: Entry Binding
description: |
  A binding with no verb and no target: it fires because the player arrived in a room. It is
  the only trigger in this vocabulary that is not a player action directed at a thing, and it
  is the one shape [the interaction table](../data-format/interaction-table.yml) — "keyed by
  verb and target, with the second object as an optional third key" — cannot index.

  **It exists because two unrelated classes asked for it and neither could have it.**
  [verb/walk-to](../verb/walk-to.yml) found it by reading engine documentation and concluded
  movement is not a verb; [cutscene/scripted-sequence](../cutscene/scripted-sequence.yml)
  found it by being assessed against a specimen and reducing on every ground except this one.
  Two methods, one missing site. [inference]

  Both engines this corpus can read document it. AGS 2.72's interaction event list carries
  "Player enters room (before fadein)", "Player enters room (after fadein)", "First time enters
  room" and "Player leaves room" ([ags-272-manual](../../catalog/ags-272-manual.md))
  [inference]; the current manual carries the same set with the same names
  ([ags-manual](../../catalog/ags-manual.md)) [verified]. The trigger has been first-class in
  that system for its whole history, on both sides of the rewrite that deleted everything else
  about the interaction editor.

  **It has a realizer now, and finding one meant discovering that the obvious candidate does not
  exist.** For six phases nothing in this corpus ran an `on-enter`: the interaction resolver takes
  a verb, a target and an optional second object, and this binding has none of the three. A
  shipped engine's arrival hook says why the gap looked bigger than it was — of 169 statements in
  Delores's 17 non-empty room `enter` bodies, **161 put stored presentation and stored affordance
  back into agreement with world state and 8 are game events**
  ([delores-source](../../catalog/delores-source.md)). [verified] A design with no stored
  presentation and a computed verb menu has nothing to reconcile, so the component that arrival
  needs *there* is one this design already does without, and what remains is a binding with
  effects. [subsystem/interaction-resolver](../subsystem/interaction-resolver.yml) realizes it,
  and pays one bit: its *"never nothing"* promise is scoped to a trigger a player composed.
  `.yidam/decisions/arrival-realizer.yml`.

  **The corpus had the reconciler reading two phases before it had the measurement, in testimony
  rather than in code.** The paragraph below already quotes Thimbleweed Park's `enter` being the
  save system — *"When a game loads, I just re-enter the room"* — which is precisely the claim:
  arriving is the moment an engine can put a room back the way the world says it should be. An
  artifact census and a designer's own sentence reached the same place from opposite directions,
  and the sentence was here first. [inference]

  **What makes it a different kind of thing rather than a verb nobody types is that it is
  forced.** The player is not offered it. A state in which one is available is therefore
  transient — nobody rests there — and that is a property no other binding in this vocabulary
  has. [inference] `.yidam/decisions/arrival-trigger.yml` records what it cost to have.

  **A third engine carries this trigger and gives it a second job, which this one does not need
  and the reason is worth recording.** Thimbleweed Park rooms have `enter`, `exit` and
  `initRoom`, and `enter` is also the **save system**: "When a game loads, I just re-enter the
  room" ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified] It is what puts the
  characters back where they belong, restarts the ambient sounds and re-launches the threads,
  because a running thread cannot be serialized and is therefore not saved at all. So that
  engine's entry hook must be **idempotent and a pure function of global state**, and its
  effects have to live somewhere else.

  This vocabulary's entry binding is the opposite — it spends an item and moves the player — and
  that is safe here for one reason: effects are instantaneous, so nothing is running that a save
  could miss, and the state *is* the save. There is no room to reconstruct. [inference]

  Those are the two halves of one trade, and the diary shows both. An engine that admits duration
  needs a reconstruction hook and must keep effects out of it; a vocabulary that refuses duration
  needs no reconstruction and may put effects in. This is the first place the atomicity decision
  in `.yidam/decisions/effect-list-semantics.yml` has paid off somewhere other than where it was
  argued.

  **And a second job that is not a save-system artifact: a room's entry code is where the scene
  is set.** Measured across Delores, the calls that never appear in a binding appear here —
  **camera zero times in a binding and three in entry code, walkbox zero and six**, object offset
  and lighting 44 of 52 (`.yidam/decisions/presentation-layer.yml`). [verified] Twinkling stars
  behind a bank window, a walkbox turned off because a chair now blocks it, a camera following an
  actor.

  That is a real division of labour and this corpus arrived at the site before it knew the
  reason. A binding says a line, plays a sound, and changes the world; a room decides what the
  room looks like when you walk into it. [inference] The arrival trigger was built to carry a
  watchman intercepting the player, and it turns out to be the site the vocabulary was missing
  for something much more ordinary.

  It also carries **`exit`**, which this vocabulary does not have and which no assessment here
  has asked for. [verified] What that engine uses it for in the one example shown is stopping
  sounds — presentation, on the far side of the line `effect-list-semantics` draws — so it is not
  evidence of a missing primitive. It is a reminder that the arrival trigger has an obvious twin
  and nothing here has argued about it.

  **That question closes by counting the twin, and the one example was representative.** Every one
  of the 20 rooms declares both halves, because the room template ships both.
  **`enter` carries 237 non-blank lines across 17 non-empty bodies — 169 statements; `exit`
  carries 15 lines across 6, and 14 of the 20 are empty** ([delores-source](../../catalog/delores-source.md)). [verified] Sixteen to
  one, in a game where the author had no reason to prefer one over the other.

  **Eleven of those 15 lines are presentation teardown** — `stopRoomMusic`, `stopSound`,
  `deleteImage`, `deleteExitButton`, the last two from the three close-up rooms that draw a page of
  text and take it away again. [verified] One is a flag being released (`toilet.inUse = NO`). The
  remaining six are one room's: SheriffsOffice checks where two non-player actors are as the player
  leaves and either resets a puzzle or puts the sheriff back on his spot.

  So the room-level twin is real, symmetric, offered, and **almost unused**.

  **One level down it is the other way round, and this node said the opposite.** A trigger region —
  an area within a room — may carry `triggerEnter` or `triggerLeave`, and `enableTrigger` takes
  `TRIGGER_ENTER|TRIGGER_LEAVE`. The game has **11 `triggerEnter` bodies and 13 `triggerLeave`
  bodies**, across six rooms ([delores-source](../../catalog/delores-source.md)). [verified] At the
  region level departure is written *more often* than arrival.

  This node recorded that as "no `triggerLeave` body at all", from a search for `triggerExit` — a
  name that engine does not use — and [walk-to](../verb/walk-to.yml) had already carried the
  correct 11 and 13 for two phases. The corpus knew and was not consulted.

  **The correction is what makes the finding, because the two levels differ for a reason.** You
  leave a *room* by arriving somewhere else, so the destination's `enter` can do any work that
  needs doing and the departure hook is mostly redundant — which is why 14 of 20 are empty and 11
  of the 15 statements in the rest turn sounds and images off. You leave a *region* while staying
  exactly where you are, and nothing else fires: SheriffsOffice's four pairs are `in_trigger = YES`
  on entering and `in_trigger = NO` on leaving, which is a boolean that cannot be maintained any
  other way. [inference]

  So departure is not uniformly vestigial. It is vestigial where something else already runs, and
  load-bearing where nothing does — and the shape that needs it is the one this vocabulary does not
  have, which is a region inside a room rather than the room itself.

  **What that means for `exit` here is unchanged.** At the granularity this class works in, leaving
  a room is the last moment an author can repair the world before it stops being observable, and
  that is what SheriffsOffice's room-level `exit` is used for. It is a *convenience about when code
  runs*, not a relationship an interaction can author — the test `effect-half` established.
  [inference] This vocabulary should not add a room-level `exit`, and the evidence is that the
  people who had one reached for it six times in a whole game, mostly to turn sounds off. The
  region-level case is a different question and belongs to whatever weighs the trigger.
properties:
  shape: none
  response: |
    Whatever the sequence does. In `nightwatch.game` a watchman takes an item and moves the
    player to another room, which is a whole cutscene and is four lines.
  precondition: |
    Ordinary. The same predicate layer every other binding has, and it is what keeps the
    trigger from being a room-changed event that fires unconditionally: `when alarm` is why
    the hall is passable before the theft and a trap after it.
  refusal: |
    None, and it cannot have one. A refusal is what the game says when the player tries
    something the precondition forbids, and nobody tried anything — they walked into a room.
    [inference] That is the sharpest way to see this is not a verb: the refusal has no
    occasion, where every other binding in this vocabulary has one.

    **That definition turned out to be a check, and it found two defects in the committed corpus.**
    If a refusal needs an occasion, a binding with a refusal and no `when` and no guarded clause has
    none — there is no state in which it is offered and declines — so the line is text no player can
    reach. Two were, both binary. [verified] — `crates/game-format/tests/refusals.rs`. This is the
    format's third check for authored text nothing can produce, and the first found rather than
    constructed.

    **And this class holds the canonical instance of the other half.** A `when` with no refusal
    under it is the only form an entry binding can take, and `nightwatch.game` writes one. Two of
    the other four in 904 authored lines are conversation options, where an unavailable choice is
    not shown.

    **The remaining two are the first hotspot verbs any author here withheld**, and they arrived
    with the fifth specimen: `lock.game`'s `talk-to` on the boatman and on the mate, each guarded on
    which character the player is currently driving. The specimen states its own reason beside them
    — *"You are not shown the choice of talking to yourself."* So the spelling that means *not
    offered* still appears exactly where a refusal is impossible, and the twenty-six bindings that
    could have chosen it and had somebody to refuse all chose a line instead. [verified] —
    `crates/reachability/tests/menu.rs`, `crates/reachability/tests/defaults.rs`.
    `.yidam/decisions/availability.yml`. The census read *seventeen to nothing* until
    `.yidam/decisions/unread-specimen.yml`; the rule it was evidence for is unchanged and the
    instance it lacked now exists.
