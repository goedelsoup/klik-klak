class: interaction
label: Acquisition Binding
description: |
  The binding that takes an object out of a room and into the inventory. It is the only binding
  in this vocabulary whose response changes what *class* its target belongs to: the object stops
  being reachable as a [hotspot](../hotspot/static-region.yml) and starts being offerable as an
  [inventory item](../inventory-item/portable-object.yml). Every other binding leaves the world's
  shape alone and only changes its state.

  That is why it is seeded separately rather than treated as a `unary-binding` with a longer
  response. [inference] Its response is two writes — remove the hotspot, add the item — and
  `inventory-item/portable-object` already records that an engine which cannot make them atomic
  has a window in which the object is in neither place. A vocabulary that hides those two writes
  inside one authored response gives an author no way to say what should happen if the second
  fails.

  It is also the binding that makes `inventory-item`'s UFO **role** typing do work. The role is
  what the object plays while carried; this binding is the event that starts the playing; and
  `carried-form-of` is the edge that remembers what it was before. Three parts of the model that
  only make sense together, and the corpus held two of them until now.

  **The atomicity claim above was an inference at genesis and both engines now speak to it, from
  opposite directions.** SCUMM v5 carries a dedicated `pickupObject` opcode
  ([scumm-v5-opcode-reference](../../catalog/scumm-v5-opcode-reference.md)) alongside a general
  `setOwnerOf`, which means acquisition was worth its own operation rather than being expressible
  as a change of owner. [inference] Adventure Game Studio provides `AddInventory`, which adds the
  item and nothing else, and its manual says nothing about what becomes of the room object
  ([ags-manual](../../catalog/ags-manual.md)). [verified]

  So one engine bundled the writes and the other did not provide the bundle at all. That is the
  clearest evidence this corpus has that the operation is real: two systems reached opposite
  conclusions about whose job it is, which is not a thing that happens about a non-problem.

  What the evidence does *not* establish is that AGS authors pay for it. The manual's silence is
  consistent with the window this node predicts and does not demonstrate it, and no AGS source
  this corpus holds reports what using the thing was like — every one of them is an artifact, and
  the testimony the corpus does hold is about Gilbert's engines rather than this one.
  `.yidam/decisions/testimony.yml` is where that kind of question is named; this is the marker for
  it and [verb/pick-up](../verb/pick-up.yml) points here rather than carrying a second. `[open]`

  **The ontology's inability to express the second write turned out to be this node counting
  wrong.** A specimen marked the removal unsayable, and the weighing that followed found there is
  no second write: `inventory-item` is typed a UFO **role**, and `carried-form-of` names the
  hotspot the same object *is* when it is not being carried. So acquiring the object and the
  hotspot ceasing to stand in the room are one change described twice.

  [inference] That does not dissolve the atomicity concern, it relocates it — and to exactly
  where [portable-object](../inventory-item/portable-object.yml) already put it. The window is a
  property of an *engine* that keeps two records and has to hold them in step, not of an
  authoring vocabulary that has one fact. An engine that splits the fact owns the consequence,
  and the vocabulary is not what made it split.

  A hotspot that disappears for some reason other than being picked up is a `world-flag` gating
  its presence, and wants nothing new either. See `.yidam/decisions/effect-vocabulary.yml`.
properties:
  shape: unary
  response: |
    The object's hotspot is removed from the room and the item is added to the inventory, as one
    change or as none. [inference] The atomicity is a requirement this node states and no seeded
    subsystem yet guarantees.
  precondition: |
    The object is present, is takeable, and is not already carried. The third is the one authors
    forget, and it is the one that produces a duplicate item rather than a refusal.
  refusal: |
    Must distinguish three cases, not two: cannot be taken, already taken, and takeable but not
    yet. [inference] The third carries puzzle information, which makes this the binding whose
    refusal text is most likely to be load-bearing rather than decorative.
links:
  - target: ../verb/pick-up.yml
    relationship: applies
  - target: ../hotspot/static-region.yml
