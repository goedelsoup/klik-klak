class: interaction
label: Unary Binding
description: |
  A verb applied to one target, resolving to a response. It is the base case of the relator:
  a verb, a hotspot, and text that belongs to neither of them.

  Seeding it makes one thing checkable that prose about relators does not. [inference] The
  response here is authored per *pair*, so a room with ten hotspots and four unary verbs has
  forty authorable cells, of which an author will fill a handful and leave the rest to
  defaults. That ratio is the real economics of a verb bar, and it is the reason a
  vocabulary grows expensive faster than its size suggests — adding a fifth verb adds ten
  cells, not one.

  **And this is where the writing in an adventure game actually is.** Of the specimens' 120
  bindings, **56 are `look-at`** — the commonest by nearly double — and measured as frame against
  prose they are the thinnest frame and the densest writing in the language: 17 characters outside
  a string literal per site, 71 inside, a ratio of 4.1 where the whole corpus averages 2.0. Both
  ratios held to a tenth across a fifth game written long after the others.
  [verified] — `crates/game-format/tests/duplication.rs`. Thirty-one of the 42 carry no
  precondition at all, which is the `precondition` property below, counted.

  That settles something a shape census made look urgent. Thirty-six of those 36 have an identical
  *shape* — a verb, a target, no guard, no effect — and share not one sentence: across every
  specimen 256 of 258 string literals are different. [verified] So the commonest repetition in
  this language is not a candidate for factoring; it is what an author came to write, wearing a
  two-word frame. `.yidam/decisions/frame-width.yml`.
  **The same, and starker.** One catalog entry between them and four references to `crates/`: the
  measurements this node rests on are re-runnable and the one thing keeping `verified-unsourced`
  quiet is a citation about an absent verb. Nothing here is mis-tagged — the prelude's rule is that
  `[verified]` is about provenance, and a committed test is provenance — and nothing here is a
  defect in the lint either. The two are just answering different questions.
  `.yidam/decisions/carried-claims.yml`. [inference]

properties:
  shape: unary
  response: |
    A line of description or a short action performed by the player character at the target.
    Authored for this verb-target pair specifically; where it is absent, the verb's own
    default response stands in.
  precondition: |
    Optional. A unary binding with no precondition is the common case and is what makes this
    shape cheap to author.
  refusal: |
    Absent here, deliberately. With no precondition there is nothing to refuse, and the
    difference between an absent refusal and an empty one was recorded as a distinction the data
    format has to be able to make.

    **The format makes it, and it was the wrong layer to ask about.** Nothing, a line, and a guard
    with two lines are three different things to write. What cannot tell them apart is the
    *checker*, and it is right not to: a response that writes nothing is not a state transition, so
    a hotspot nobody can act on, one with a description and one with a guarded pair give the
    specimen the same 91 states and the same 173 transitions. [verified] —
    `crates/reachability/tests/defaults.rs`.

    Where the distinction matters is the **interface**, which this design has never specified, and
    a shipped game shows the branch on which it stops mattering at all: Delores builds its verb menu
    from the object's own verb slots and removes any verb whose precondition fails, so an unrefused
    verb is an absent one ([delores-source](../../catalog/delores-source.md)). [verified]
    `.yidam/decisions/default-binding.yml`.

    **This design has specified one and had not noticed**, and the sentence above is where the
    noticing should have happened. The three records it points at are a complete specification of a
    contextual menu between them, and written as code they recover figures the corpus had counted
    independently by reading text. [verified] — `crates/reachability/tests/menu.rs`. The component
    now has a name: [verb-menu](../subsystem/verb-menu.yml).

    **And *an unrefused verb is an absent one* is wrong about that game.** `VERB_PRE` is a verb that
    is in the popup and declines out loud, with its own macro, its own dispatch table and its own
    boot-time list, and the catalog section that claim came from was written from `_checkVerbValid`
    without looking at what runs beside it. [verified] Both engines have both forms; what differs is
    which they reach for.

    **Half of it turns out to be authorable after all, and the format already spells it.** *Never
    authored* against *authored and empty* belongs to the interface and stays there. *Withheld*
    against *refused out loud* does not: a `when` with no `else` under it withholds, a `when` with
    an `else` offers and declines, and the corpus writes the first three times and the second
    seventeen — and not one of the three is on a hotspot verb. [verified] —
    `crates/reachability/tests/defaults.rs`, `crates/reachability/tests/menu.rs`. That engine writes
    them **32 and 3** — the 62 `VERB_OK` sites counted here before include 30 that test the second
    object, which is this design's key rather than an availability gate — on one verb slot where
    both apply. Eight to one toward hiding there against seventeen to nothing toward showing here.
    [verified] `.yidam/decisions/availability.yml`, `.yidam/decisions/verb-menu.yml`.
