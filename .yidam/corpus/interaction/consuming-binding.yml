class: interaction
label: Consuming Binding
description: |
  A binary binding whose response spends its second object: the item is used and does not come
  back. It is the inverse of [acquisition-binding](acquisition-binding.yml) — that binding moves
  an object into the inventory, this one takes it out of the world — and it is seeded because
  [unwinnable-state](../failure-mode/unwinnable-state.yml) names spending as the first of its two
  causes and this corpus had nowhere that a spend happens.

  **[inference] It is the only binding in this vocabulary whose success can be the mistake.**
  Every other shape either resolves correctly or refuses, and a refusal is a message the player
  can act on. The half of that a checker can confirm is confirmed: **every one of the five
  strandings in the four specimens was a binding the player had been shown**, in the state it
  stranded them from — `Report::unshown` is empty everywhere — so none of them was reached by
  accident or by a route the interface hid. [verified] — `crates/reachability/tests/spend.rs`. This one resolves correctly on the wrong target: the oil goes into the hinge rather
  than the lamp, and the text that follows is written as a success because at that moment it is
  one. Nothing distinguishes the right use from the wrong use except what will be needed later,
  which is written somewhere else entirely.

  That is the mechanism of consumption-caused `unwinnable-state` stated as a property of a
  binding shape rather than as an authoring mistake, and it says where a check belongs: not on
  this binding, which is locally correct and will stay correct, but on what remains reachable
  after it resolves.

  **That is now where the check is, and the four specimens strand five times.** `crates/reachability`
  finds a stranding as an edge stepping out of the set of states from which an ending is still
  reachable. Six bindings spend; three of the five strandings are consumption and two are ordering.
  `lighthouse.game`'s is the can of oil poured into a hinge — four reachable states lost, from
  *"in base; carrying crowbar, brass-key, wick; lamp-prep=0"*, and the report says which rather
  than only how many. [verified] — `crates/reachability/tests/spend.rs`.

  **This node said the classification was cheap and said so wrongly.** It read: *"consumption and
  ordering are the same computation and differ only in which effect the stranding edge carried."*
  They differ by a second reachability run. The checker takes the spending away and asks whether
  that rescues the stranded state; if it does, the spending was the cause. The source comment
  predates this sentence and gives the reason in the specimen this corpus already had:
  *"a binding that both spends and moves carries both kinds of effect, and reading the cause off
  the list picks one by fiat."*

  `ferry.game` is that case and it is decisive. **Its toll spends three coins and is classified
  `Ordering`** — handing the coins back rescues nothing, because what closed is the river. It is
  the only spending binding in that game and the only stranding it has, so the reading this node
  proposed would have been wrong about one of the corpus's five. [verified] —
  `crates/reachability/tests/spend.rs`. What follows for
  [unwinnable-state](../failure-mode/unwinnable-state.yml) is the opposite of what was written
  here: detecting the two is one computation, and telling them apart takes a second, so they are
  distinguishable at detection after all and the distinction has a price.

  **And the shape declared below is not the shape the corpus spends at.** Two of the three
  consumption strandings are `nightwatch.game`'s, where the ledger is spent on an **`on-enter`** —
  the watchman taking it out of the player's hands — which has no verb, no target and no second
  object. The checker attributes the stranding to the two `walk-to` bindings that walk into the
  hall, because an entry binding is forced and the arrival is what the player chose. [verified]
  `spend` is an effect and [effect-vocabulary](../../decisions/effect-vocabulary.yml) put it in a
  list that belongs to any binding; this class was named after the shape that spends most often
  and then written as though that were the only shape that could. `shape` takes a fourth value for
  it, added and authored together, and `.yidam/decisions/binding-axes.yml` carries what the
  correction turned out to be about.

  **This node is the one `verified-unsourced` reports, and it is the first to say so while it is
  true.** All four of its `[verified]` claims rest on `crates/reachability/tests/spend.rs`, none
  rests on a document, and it draws on no source entry — which is what the linter sees and what the
  linter should see. Four nodes reached this position before it and each was silenced by a citation
  added for an unrelated claim; two of them wrote that they were still carrying the warning and
  went on saying so for four phases after they had stopped.
  `.yidam/decisions/evidence-kinds.yml` decides what to do about that, which is not to buy the
  silence: an entry registering `crates/` as a source would quiet all twenty-two such nodes at once
  and take this one honest report with them.

  [inference] The consequence for the format is that consumption has to be *declarable* rather
  than written into response prose. A checker asking which bindings spend a given item gets an
  answer from the graph; a reader asking the same question of prose gets one only if every author
  happened to phrase it the same way.
properties:
  shape: any
  response: |
    The item is used on the target and leaves the inventory. Two facts, and the second is the one
    an author is least likely to state twice: response text reading "you pour out the last of the
    oil" is not the same artifact as an edge saying the item is gone, and only the edge is
    readable by anything but a person.
  precondition: |
    The item is carried and the target accepts it. [inference] Neither is about the state this
    binding leaves behind, which is the point — a consuming binding's precondition cannot say
    *and you will still need this later*, because that is a fact about the rest of the game
    rather than about this moment. No precondition in this vocabulary can reach that far.
  refusal: |
    Ordinary, and beside the point. The failure that matters here is the acceptance rather than
    the refusal; see the description.
