class: interaction
label: Default Binding
description: |
  The binding that resolves when no authored binding matches — a verb applied to a target
  the author never wrote a response for. It is seeded as an `interaction` rather than as a
  property of `verb` because that placement is a real design question and putting it here
  makes the question visible.

  [inference] By the combinatorics above, this binding handles the great majority of what a
  player actually triggers, which makes it the single highest-leverage piece of authored
  content in a game and the one most often written once and forgotten. A vocabulary that
  gives it no first-class place is a vocabulary whose most-used response is an afterthought.
  Whether defaults should be authorable per room, per verb, per hotspot category, or only
  globally is `[open]` and this corpus has no node arguing any of the four.

  **Three of the four now have an answer, from AGS, and it is not the one this node guessed.**
  `unhandled_event(int what, int type)` scopes a default by **entity kind × verb** and by nothing
  else: `what` is 1 hotspot, 2 object, 3 character, 4 nothing, 5 inventory, and `type` is the verb
  ([ags-manual](../../catalog/ags-manual.md)). [verified] Defaults are authorable per verb, and
  per *category* — but the category is the engine's entity taxonomy rather than one an author
  defines. Per-hotspot is not offered, and on reflection could not be: a hotspot with its own
  default has simply been authored.

  **That quarter closes by dissolving.** Neither system offers a per-room default, and there is now
  a reason rather than an absence of evidence: a default is a property of the *table*, and a table
  keyed by verb and target has no room in it. [inference] Scoping one per room would make the room a
  third key, which is the two-dimensional cost [binary-binding](binary-binding.yml) counts, paid
  again for a cell nobody authored.

  **And a whole branch of this question turns out to be conditional on an interface.** Delores has
  no default binding at all, because it has no fixed verb bar: the popup is built from the object's
  own verb slots and a verb whose precondition fails is removed from it, so no unauthored pair is
  reachable and nothing needs to stand in ([delores-source](../../catalog/delores-source.md)).
  [verified] The premise above — that the default handles the great majority of what a player
  triggers — is true where every cell is reachable and is a fact about **vocabulary size**: 164
  objects against 57 verbs is 2.17% authored, and this design's four specimens are 42 sites against
  six verbs, 34.5%. [verified] A conclusion drawn at 57 verbs does not transfer to six.
  `.yidam/decisions/default-binding.yml`.

  The manual also states this node's premise in the AGS authors' own words, which matters because
  the premise was reached here by arithmetic rather than by evidence: the function is "typically
  used to display a default 'I can't do that' type response in-order to avoid having to add unique
  messages for all in-game interactions". [verified] The default exists because the table cannot
  be filled.
properties:
  shape: unary
  response: |
    The verb's own default text, unless something narrower is in scope. What "narrower"
    means is the open question above.
  precondition: |
    That no authored binding matched. This is the only precondition in the vocabulary that
    is about the *content* rather than about the world, which is itself a hint that this node
    may not belong in this class.
  refusal: |
    Not applicable — a default cannot refuse, because it is what a refusal falls through to.
links:
  - target: ../verb/look-at.yml
    relationship: applies
  - target: ../interaction.ont.yml
    relationship: instance-of
