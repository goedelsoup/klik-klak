class: prior-art
label: Thimbleweed Park
description: |
  A 2D point-and-click adventure shipped in 2017, and the engine written for it, by Ron Gilbert,
  Gary Winnick and David Fox — the authors of *Maniac Mansion*. It is the one system in this
  corpus where the people who invented the form built the form again, from nothing, with no
  compatibility to keep and thirty years to think about it. Whatever they chose, they chose
  freely.

  They chose a **general-purpose scripting language, in the second week, before anything else
  existed.** `engine.html`, 5 January 2015: "I think my engine has everything I need... Except a
  scripting language." Lua is rejected on syntax; writing one is costed at "about a month" and
  declined for time; Squirrel is taken
  ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified]

  **That is the most direct answer to this corpus's central question that exists, and it is
  no.** It is also not the whole answer, because *where* they put the language is precisely
  where this corpus argues about, and on two of the three boundaries they drew the line in the
  same place this design does.

  **The keying is this corpus's interaction table, exactly.** A room is a table; an object is a
  table inside it; a binding is a field on the object named for the verb. [verified]

      hotelRoomRadio =
      {
          name = "radio"
          initState = OFF
          verbLookAt = function() { ... }
          verbUse = function() { ... }
      }

  Verb by target, sparse, with everything unwritten falling through — the shape
  [interaction-table](../data-format/interaction-table.yml) describes and the shape
  [interaction](../interaction.ont.yml) calls a relator. Nobody arrived at it from this corpus's
  premises; they arrived at it from SCUMM, and Gilbert says that was the intent from the start:
  the plan for Squirrel was "to modify the syntax a little to mimic how SCUMM laid out code for
  rooms and objects." [verified]

  So the disagreement is not about the table. It is about what goes in a cell, and there the
  answer is an arbitrary closure.

  **What the cells actually needed, counted rather than argued.** Every object shown in the
  diary, taken as a sample of one game's bindings:

  | what the response does | example | expressible here |
  |---|---|---|
  | say a line | `hotelRoomBed.verbLookAt` | yes |
  | say one of two, on a flag | `hotelRoomRadio.verbLookAt` | yes — `when`/`else` |
  | write a flag or object state | `objectState(this, ON)` | yes — `set` |
  | go somewhere | `verbWalkTo` → `enterRoomFromDoor` | yes — `move` |
  | take an item, decrement a stock, flip state at zero | `bankFlyerHolder.verbPickup` | yes — a counter and three gates |
  | say one of four, on a count the response advances | `bankPainting.lookAt` | yes, at four bindings for one cell |
  | **call another binding** | `verbPickUp = function() { verbUse() }` | **no**, and six of seven shapes of it turned out sayable |
  | **start something that outlives the click** | `startthread(playRadio, this)` | **no** |
  | **rebuild the room from global state** | `enter` | **not as written** |
  | **build 110 rooms from one template** | `definePseudoRoom` in a `for` loop | **no** |
  | **randomise an initial state** | `objectState(bed, random(1,3))` | **no** |
  | **share a parameterised helper across rooms** | `sewerValveSetup(this)` | **no** |

  [inference] — a sample from a development blog is not the game, and the entry says so.

  **The finding is in which rows failed.** Not the puzzle rows. Every response in the sample
  that does what an adventure game does — describe a thing, refuse, gate on state, take an
  object, change a room — is inside this vocabulary, including the two that look hardest. What
  broke out was **repetition and duration**, and repetition twice, independently: Gilbert wrote
  `definePseudoRoom` because the Edmund Hotel is 110 rooms, and Jenn Sandercock wrote
  `SewerHelpers.nut` because the sewers are full of valves and "I didn't want to do more
  copy-paste". [verified]

  This corpus has been asking whether a bounded expression language is *expressive* enough. The
  one system that ran the experiment says the thing that broke the declarative form first was
  **duplication**, and `interaction-table` already records that scale is the untested axis:
  "twenty-three bindings is not a test of scale." [inference] The same pressure appeared one
  scale down in `.yidam/decisions/arrival-trigger.yml`, where four bindings carried one intent
  and one copy drifted.

  **It has since appeared three more times, and the last of them is in this repository.** Twenty-one
  of Delores's 53 presentation names are composites its authors wrote for themselves; eleven of
  twenty of its delegation sites are one object drawn as several regions; and
  `crates/reachability/tests/scaling.rs` writes the games carrying this corpus's tractability
  argument with three Rust `for` loops, 6,315 generated lines against 664 authored, because a
  corridor of sixty-four rooms cannot be written by hand in the language being measured. [verified]

  So the two rows above that this node called repetition are five instances across two games, and
  the word covers two different pressures: **generation**, which is all of these but one, and
  **identity**, which is the delegation sites. What this row got right is that they broke the
  declarative form first. What it did not have is that the same authors shipped a declarative
  answer to the generation half — `door_verbs = YES` — so the escape hatch was reached for at every
  shape nobody had written an archetype for, and not because generation needs a language.
  [inference] `.yidam/decisions/duplication.yml`.

  **Duration is the other, and it is why Squirrel was not enough either.** Squirrel had to be
  extended before the first room existed. `scripting_test.html`, 20 January 2015: "one of the
  things I always liked about SCUMM was how it handled multi-tasking... I just want to start a
  function and have it run until told otherwise... Squirrel didn't have the ability 'out of the
  box'." [verified] A general-purpose language was chosen and immediately found short on exactly
  the axis `.yidam/decisions/effect-list-semantics.yml` refused to cross.

  **And the price is stated, in the one place a designer cannot avoid stating it.** A running
  thread cannot be saved: "I looked at the Squirrel source code and I don't see an easy way to
  serialize and recreate a running thread." Global threads are therefore not saved at all, local
  threads are killed on leaving a room and restarted by the room's `enter` code, and a save
  during a cut-scene silently restores the state from just before it. [verified] Three separate
  workarounds, all for the same fact: **a response with duration is not a state.** This corpus
  reached the same conclusion by refusing the duration; that engine reached it by paying for it.

  **Where they held the line this corpus draws.** The room file has no behaviour in it — see
  [room-manifest](../data-format/room-manifest.yml), whose claim that every engine eventually
  puts a script hook in the room file this system falsifies. Two of its fields, `usepos` and
  `usedir`, are the residue [walk-to](../verb/walk-to.yml) left open, declared as data on the
  target rather than authored as a binding. [verified]

  **And where the shape of the language leaked into the table.** In February 2015 the slots were
  `lookAt` and `walkTo`; by January 2016 they are `verbLookAt` and `verbWalkTo`. [verified] The
  prefix is there because a binding and the object's own state share one namespace — `name`,
  `initState`, `flags`, `look_count`, `flyers_left` and `verbUse` are fields of the same table —
  and nothing but a naming convention keeps a verb slot from colliding with a variable. A format
  that keys bindings separately from declarations never needs the prefix. [inference]

  **Dead ends were prevented by a rule and not by anything in the vocabulary.** "Thimbleweed Park
  will not have the death and dead ends of Maniac Mansion. Those were born from ignorance more
  than a focused design decision. It will follow my rules of adventure game design."
  [verified] That is the strongest available witness saying
  [unwinnable-state](../failure-mode/unwinnable-state.yml) is a defect rather than a genre
  feature — and saying it as *discipline*, because a general-purpose language cannot be asked
  the question. It is the same shape as the finding in `puzzle/state-gate`: a rule adopted for
  how the game plays is the rule that makes it checkable, and the checking is not available to
  the system that adopted it.

  ---

  **That question is closed. The scripts were read, and this node now covers one system across
  two games.** *Delores: A Thimbleweed Park Mini-Adventure* shipped in 2020 on this engine,
  programmed by Gilbert and David Fox, and its complete source is public
  ([delores-source](../../catalog/delores-source.md)). There is one node rather than two because
  there is one system: the language is Squirrel with a preprocessor, renamed **Dinky**, and
  everything the diary described is recognisably here three years on. What changed is the
  vocabulary around it, and the direction it changed in is the finding.

  **The table above survives and the sample was honest.** Counted over the whole game — 203 live
  bindings across 21 rooms — 121 (59.6%) are a single statement, **91 (44.8%) are a single
  `sayLine`**, 62 (30.5%) hold a conditional, and **155 of 203 (76.4%) contain no loop, no
  thread, no blocking call and no delegation**. [verified] The escapes are the ones the blog's
  sample named: 34 bindings (16.7%) block or take time, 18 (8.9%) call another verb slot on the
  same object, 12 start a thread, 7 loop.

  Two shapes dominate everything. **107 of the 203 bindings — 52.7% — are `lookat`**, and of the
  160 live object declarations in the game, **45 carry no verb slot at all** and 82 carry exactly
  one.
  [verified] Beside them sit 290 bare props with neither a name nor a behaviour. A real
  interaction table is far emptier than this corpus has been imagining.

  **The direction of travel is toward declaration, on every axis this corpus argues about.**

  - The binding slot became a **declared form**: `verbLookAt = function()` in 2016 is
    `VERB(lookat) { … }` in 2020, a macro expanding to `verb_lookat <- function(noun2=null)`.
    The prefix this node recorded as a namespace collision hazard is now generated. [verified]
  - The exit became **data**. Twenty exits, every one `to_door = @Room.doorObject` with
    `door_verbs = YES` and no code, from which the engine synthesises a precondition and a
    response. See [walk-to](../verb/walk-to.yml). [verified]
  - Conversations left the general-purpose language entirely, into **Yack** — see
    [dialogue-script](../data-format/dialogue-script.yml), which is this phase's largest finding.
  - Repetition — the pressure this node identified as what broke the declarative form first — is
    answered by **named archetypes selected with a boolean**. `door_verbs = YES` and
    `on_off_verbs = YES` expand into a full set of preconditions and responses: a switch declares
    `okverb_turn_on` as `state == "off"`, `verb_turn_on` as `objectState(this,"on")`, and a
    `stateChange` that flips which verb the object offers by default. [verified] Not a macro and
    not a helper function — a property. That is *a name for a shape*, which is what this node
    said the escape hatch was actually being used for, moved into the vocabulary.

  **And the preconditions are declarable, and the humans declare sixty-two of them.** `VERB_OK(x)`
  defines `okverb_x`, a predicate the engine consults before offering a verb at all. This node said
  every use in the entire game was engine-supplied inside the two archetypes, and that every
  precondition the authors wrote by hand was an `if` inside a response. There are **62 live
  hand-written sites** across eleven room files, the inventory and the actor definitions, with a
  63rd commented out ([delores-source](../../catalog/delores-source.md)). [verified] The search was
  for `okverb_`, which is what the macro expands to; the authors write the macro, and the expanded
  name occurs in four engine files and no game file.

  The rule built on it — *a precondition separate from its response is what you need when the
  vocabulary generates bindings, and not when a person writes one* — is withdrawn. A person writing
  by hand reached for it sixty-two times.

  **What replaces it is a distinction this corpus did not have, and it is about the interface.**
  `VERB_OK` returns a boolean and so cannot carry a line; a failing one **removes the verb from the
  menu and says nothing**, which is the mechanism [default-binding](../interaction/default-binding.yml)
  turned on. Measured, the 62 sites average 34 characters of frame and under one of writing — the
  largest prose-free repetition in the game. [verified] This design's `when` is a different thing:
  it guards a response and its failure is an `else` with a refusal in it. Availability and refusal
  are two primitives in that engine and one here, and which is right is a question about the verb
  menu rather than about the authoring vocabulary. [inference]

  **The verb vocabulary is a list, and it is meant to be edited.** `master_verb_list` holds **57**
  verbs; the file's opening comment is "When adding a new verb, it must be added to the following
  three lists, and the forth if it is a use-with verb." 46 are used on objects, 49 counting actors,
  and **23 of those are used exactly once** — `dissolve`, `jab_with`, `scrape`, `lick`, `tighten`
  ([delores-source](../../catalog/delores-source.md)). [verified] This is not a bounded vocabulary
  that authors live within; it is a table authors extend per puzzle, with a load-time check —
  `registerVerbs` warns when a binding names a verb the list does not hold — standing in for the
  discipline.

  This paragraph carried 63 and 26. Both are wrong, and the corpus disagreed with itself about the
  first in two other places — [ags](ags.yml) and `.yidam/decisions/tier-split.yml` both say 57,
  which is what the file says. The figures were `[verified]` against a source entry that had never
  recorded them; it records them now.

  What *is* bounded is the **schema**: six lists declare, per verb, its menu position, its display
  text with `$NOUN1$`/`$NOUN2$` slots, whether it is binary, whether the actor walks to the
  target, whether the actor reaches, and whether proximity is required. [verified] The primitive
  is not the verb. The primitive is the verb schema, and the verbs are its instances.
properties:
  era: "2015-2020"
  vocabulary_shape: |
    An on-screen verb grid below the scene, with the inventory beside it — the *Maniac Mansion*
    surface rather than the verb coin, kept deliberately. The sentence line was removed in
    August 2016 after playtests, and the verbs were not: "no one comments on it... It just felt
    right." [verified]

    The set is not enumerated anywhere in the diary. Six members are named in passing while
    arguing about keyboard shortcuts — Open, Close, Use, Push, Pull, Pickup — and `verbLookAt`,
    `verbUse`, `verbPickUp` and `verbWalkTo` appear as binding slots in quoted code. [verified]

    Two more are read off a **capability flag** and are therefore weaker: actor tables carry
    `flags = GIVEABLE|TALKABLE`. [verified] That is a per-target declaration of what may be done
    to a thing, `TALKABLE` plainly corresponds to a talk verb, and `GIVEABLE` to a give one —
    which is a reading, not a quotation. [inference]

    **Three years later the set is not six or nine but fifty-seven, and it is a file.** See the
    description: `master_verb_list` is authored data with instructions at the top for extending
    it, and the surface is a per-object pop-up rather than a fixed bar — an object offers the
    verbs it has slots for, in the list's order, with a `default_verb` for a plain click that
    falls back through look-at, examine, read, look-at-far, instant and finally walk-to.
    [verified]

    **That figure was sixty-three here for six phases and it was never right.** `master_verb_list`
    and `master_verb_names` hold 57 entries each, are the same set, are checked against each other
    at boot, and the list carries no commented-out entry; 18 of the 57 are in `verb_usewith_list`.
    [verified] ([delores-source](../../catalog/delores-source.md), which has said 57 since it was
    written — the disagreement was between two files in this repository and nobody had put them
    side by side.) **49 of the 57 carry a binding, 23 of those exactly once, and 8 are declared and
    never used.** [verified] The shape of the claim is unchanged and every number in it moved.

    **Four of those have no node in this corpus.** Open, Close, Push and Pull were kept by the
    newest system in the corpus, built by the people who wrote the oldest, and this vocabulary
    declares none of them. That is not the same finding as `vocabulary-coverage`'s *undeclared
    and reached for*, which is about bindings; it is the comparative question, and it is the
    first time traversing `prior-art -implements-> verb` returns something this corpus lacks.
    [inference]
  scripting: |
    **Immediately, deliberately, and at the level of the individual response.** Squirrel, chosen
    in week two over writing a bounded language that was costed at a month, and extended with
    cooperative threads before the first room existed. There is no declarative layer beneath it
    for behaviour.

    **And by 2020 there are two, and one of them is a language they wrote.** Conversations moved
    out of Dinky entirely into `.yack`, which has its own grammar and a guard layer that never
    escapes ([dialogue-script](../data-format/dialogue-script.yml)). Exits, doors and on/off
    switches moved out of code into declared archetypes. So the answer this node leads with — a
    general-purpose language, chosen in week two — is where the system *started*, and every
    subsequent movement was away from it. [inference]

    The structure around the cells is declarative and is not the same question: rooms and
    objects are tables, geometry is a JSON file written by a tool, and neither contains code.
    So the boundary is drawn one level lower than this corpus proposes — around the *response*
    rather than around the *game* — and everything above it agrees.

    Nothing in the diary records a bounded response language being considered and rejected.
    Gilbert weighs three general-purpose options and picks one. [inference] from silence, which
    is weak, and it is the honest reading: the alternative this corpus is testing does not
    appear to have been on the table.
  source_standing: |
    Two sources, and the second is stronger than any this corpus holds.
    [Delores's complete authored source](../../catalog/delores-source.md), read 2026-09-10 — the
    whole game, plus the engine's own manual, countable and reproducible. And
    [the development diary](../../catalog/twp-dev-diary.md), read the same day — twenty-two posts
    of 258, primary, by the authors, with their own source in them. Everything above that quotes
    is `[verified]`; everything that generalises from a sample of illustrated code to the game is
    `[inference]` and marked.

    This is the corpus's first prior-art node whose source is neither a manual nor a reverse
    engineering, and the only one where a claim about *why* a choice was made rests on the person
    who made it saying so. It is also the only one where a claim about *what was built* can be
    counted rather than quoted.

    The two sources divide cleanly and the division is worth keeping: the diary carries the
    reasons and no numbers, the source carries the numbers and no reasons. Neither covers the
    other, and Thimbleweed Park's own source — five times the size of Delores — is not public, so
    every proportion here is a proportion of the smaller game.
