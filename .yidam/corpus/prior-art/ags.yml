class: prior-art
label: Adventure Game Studio
description: |
  An authoring system that replaced the on-screen verb bar with cursor modes: the player
  cycles the cursor through modes and clicking applies whichever is current. Its manual is
  the one source of record this corpus holds — see [the AGS manual](../../catalog/ags-manual.md)
  — and reading two pages of it corrected two claims this node made at genesis.

  **The vocabulary is not bounded.** The manual states that an author "may create more if
  necessary" beyond the modes AGS ships with. [verified] That contradicts what this node said
  at genesis, which was that AGS and SCUMM are both bounded vocabularies differing only in
  their discovery surface. They differ in the bound as well, and the difference runs the
  interesting way: SCUMM's verb bar was fixed and visible, AGS's mode set is extensible and
  hidden. An author who wants a verb SCUMM does not have cannot add one; an AGS author can,
  and pays for it in a cursor the player must cycle blindly to find.

  What survives from genesis is the claim about composition order, and it survives promoted.
  Use Inventory is a cursor *mode* — Mode 4 — and the manual says `StandardMode` applies to
  Walk, Look, Interact and Talk but should not be enabled for it. [verified] So a binary verb
  in AGS is expressed by making the item the mode rather than the verb, which is a different
  composition order from SCUMM's and not merely a different presentation of the same one.

  Whether an authoring vocabulary should include its own discoverability was the question here, and
  the third data point is in [prior-art/scumm.yml](../prior-art/scumm.yml): the verb coin is
  neither a bar nor a mode.

  **There is a fourth, this corpus read it, and it answers the question in the one direction
  nobody had listed: the two are not separate things.** In Dinky the verb menu is computed from the
  target. `master_verb_list` holds 57 verbs and fixes display order; an object's `_known_verbs` is
  built by scanning its own fields for anything named `verb_*`; and `openVerbsFor` shows a verb only
  when it is in both **and** the object's precondition for it passes
  ([delores-source](../../catalog/delores-source.md)). [verified] The surface is the authoring,
  filtered twice — by declaration and by precondition — at the moment the player asks.

  What that buys is measured: no unauthored verb-target pair is reachable, so nothing needs a
  default binding to stand in for one, and 46 of that game's 164 objects are simply not interactable
  by design rather than by omission (`.yidam/decisions/default-binding.yml`). [verified] What it
  costs is that a player cannot learn what a verb *is* until they find something that has it — the
  opposite trade from the bar above, which shows the whole vocabulary and nothing about which parts
  of it apply. [inference] `.yidam/decisions/tier-split.yml` collects the four.
properties:
  era: "1997-present"
  vocabulary_shape: |
    Cursor modes, applied by clicking. The manual names Mode 0 (Walk), Mode 4 (Use Inventory),
    Mode 6 (Pointer) and Mode 7 (Wait), and refers to modes 1, 2, 3, 5, 8 and 9 without naming
    them on the page this corpus read. [verified] Four of ten are known here and the other six
    are on some page nobody has opened; this corpus does not guess them.

    The `StandardMode` property marks a mode that fires an event on whatever is clicked, and
    the manual attaches it to Walk, Look, Interact and Talk. [verified] Those four are
    therefore the ordinary verb-like modes, and the set is open at the author's discretion.
  scripting: |
    A C-like scripting language handles anything beyond a simple response, and where the boundary
    sits is now known for one part of the surface rather than guessed for all of it. In dialog
    scripts the boundary is **whitespace**: "Do NOT indent these lines with spaces or tabs.
    Indented lines signify that AGS should interpret the line as a normal scripting command"
    ([ags-manual](../../catalog/ags-manual.md)). [verified] There is no delimiter and no
    declaration, so an author who indents a line by accident has changed which language it is in.

    The other door out of a dialog is `run-script X`, which does not run script in place: it
    "calls dialog_request event handler if one is present in the game script, passes X as an
    integer parameter". [verified] A conditional branch in a conversation therefore leaves the
    conversation entirely and reappears in a global handler keyed by an integer.

    **Read, and for room and hotspot interactions there is no boundary, because there is no
    declarative side.** The tutorial is the clearest statement of it: clicking the "..." button on
    a hotspot event "will create an entry in the script for this event, and you'll find yourself
    taken to the script editor", and the first interaction the manual teaches is a function body —
    `function hSignHome_Look() { Display("The sign says 'EWOH'…"); }`
    ([ags-manual](../../catalog/ags-manual.md)). [verified] The `Hotspot` API is sixteen members
    and every one is script. The scripting reference this property called unread is roughly sixty
    API pages beside twenty language pages; for this part of the surface it is not a hatch at the
    end of a declarative vocabulary, it is the floor.

    That puts AGS where this corpus had already put the other two. SCUMM: "there is no declarative
    layer beneath it… it starts there." Sierra: "authoring starts inside a general-purpose language
    rather than escaping to one." All three now answer the same way, and only this one is
    `[verified]`.

    **And AGS is the only one that arrived there by removing something.** "The Interaction Editor
    has been removed from AGS 3.0. When you import your game, AGS will attempt to convert all your
    interactions into scripts." [verified] Through 2.72 a hotspot carried an "Interaction..."
    button, an event bound to an ordered list of commands chosen from a closed combobox, each with
    typed parameters and a default of "Do nothing"
    ([ags-272-manual](../../catalog/ags-272-manual.md)). [inference]

    **And the vocabulary itself is not lost: the 2.x-to-3.0 conversion still ships in the editor,
    so the definition of the deleted layer is in the repository.** Forty-eight actions
    (`NUM_ACTION_TYPES 48`), six argument types, four action flags, and seven predicates marked
    `AFLG_COND` — including `If a variable is set to a certain value` and `If the player has an
    inventory item`. Predicates nest, guarding a child command list; the structure is bounded at
    30 events per entity and 40 commands per list ([ags-source](../../catalog/ags-source.md)).
    [verified] What it has no form of is composition: no disjunction, no negation, no grouping,
    no comparison beyond equality. The full table and what follows from it are in
    [data-format/interaction-table](../data-format/interaction-table.yml), **which this node now
    reads as an edge rather than as a sentence.** `prior-art -reads-> data-format` has been
    declared since genesis and authored twice by other systems; the node holding the only
    interaction table this corpus has ever read in full did not author it, and the graph therefore
    said AGS reads no format at all. `.yidam/decisions/prose-edges.yml`.

    So the standing of the claim has changed twice in two phases. That the editor was removed was
    always `[verified]`; what it *was* was `[inference]` from an archived manual for one phase;
    it is `[verified]` now, from this project's own code.

    The vestiges are still in the current manual and corroborate the shape:
    `GetGraphicalVariable`/`SetGraphicalVariable` "allow your script to access the values of
    variables set in the interaction editor" and are obsolete; Global Messages are obsolete
    because "there's really no need for them now that the interaction editor has gone."
    [verified] A whole data concept existed to serve a layer that no longer exists.

    **What the manual states about the change is not about expressiveness.** It names concurrency
    — in 2.72 a non-scripted interaction could run while a blocking script ran, and "now, that is
    no longer the case" — and sequencing: a `Run Dialog` action "waits until the dialog has
    finished before moving onto the next action", where `dialog[x].Start()` "does not block".
    [verified] The declarative action list was sequential and blocking by default; the language it
    was converted into was not.

    **Why it was removed was looked for directly and was not found.** The manual
    reasons about migration hazards and never about the decision; it opens by calling 3.0 "this new
    editor" and "a massive improvement over the old one", and 3.0 was a full editor rewrite, so
    removal is as consistent with a rewrite's scope as with a judgement about declarative
    authoring. The code says what the thing was and nothing about why it went.

    Three retrievals were made for the reason and none produced it: Adventure Classic Gaming's
    interview with Chris Jones, which discusses 3.0 as "a complete re-write of the editor" and
    does not mention the Interaction Editor; and two searches of the AGS forums, which return the
    manual's removal note and no discussion behind it. The forum's own search and the 2007-2008
    beta threads have not been read. [inference]

    Treating the removal as a verdict would be the same error this node made about cursor modes
    and about the eight dialog commands — and it is a worse bet than it looked a phase ago, since
    the thing removed turns out to have been forty-eight commands with a type system rather than
    something thin.

    Three retrievals failing is not three accidents. The code, the manual and the interview are
    artifacts, and an artifact records what was built rather than why anybody decided to build it —
    which [delores-source](../../catalog/delores-source.md) states about its own kind in one line:
    *"No design commentary. The source says what was built and never why."*
    `.yidam/decisions/testimony.yml` names the class of question this belongs to, and this node is
    where it is tracked; [data-format/interaction-table](../data-format/interaction-table.yml)
    points here rather than carrying a second copy. `[open]`
  source_standing: |
    Eight pages of the manual source read on 2026-09-09, listed with what was and was not looked
    for in [the catalog entry](../../catalog/ags-manual.md), which is where that record lives
    rather than here. The `[verified]` claims in this node rest on `EditorCursor.md`, `Dialog.md`
    and `DialogScript.md`.

    This property said "two pages" for thirteen commits while the entry beside it listed eight,
    which is the drift a source-standing note exists to prevent and did not. **Seventeen pages
    now**, plus five pages of [the archived 2.72 manual](../../catalog/ags-272-manual.md), which is
    a second source with a weaker standing and its own entry, and four files of
    [the AGS source](../../catalog/ags-source.md), which is a stronger one than either. The object model, the inventory
    system and the GUI system remain unread; the scripting reference has been read for its extent
    and its index rather than page by page, which is what the claim above needs and is less than
    reading it.
