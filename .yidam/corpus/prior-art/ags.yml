class: prior-art
label: Adventure Game Studio
description: |
  An authoring system that replaced the on-screen verb bar with cursor modes: the player
  cycles the cursor through modes and clicking applies whichever is current. Its manual is
  the one source of record this corpus holds — see [the AGS manual](../../catalog/ags-manual.md)
  — and reading two pages of it corrected two claims this node made at genesis.

  **The vocabulary is not bounded.** The manual states that an author "may create more if
  necessary" beyond the modes AGS ships with. [verified] That contradicts what this node said
  at genesis, which was that AGS and SCUMM are both bounded vocabularies differing only in
  their discovery surface. They differ in the bound as well, and the difference runs the
  interesting way: SCUMM's verb bar was fixed and visible, AGS's mode set is extensible and
  hidden. An author who wants a verb SCUMM does not have cannot add one; an AGS author can,
  and pays for it in a cursor the player must cycle blindly to find.

  What survives from genesis is the claim about composition order, and it survives promoted.
  Use Inventory is a cursor *mode* — Mode 4 — and the manual says `StandardMode` applies to
  Walk, Look, Interact and Talk but should not be enabled for it. [verified] So a binary verb
  in AGS is expressed by making the item the mode rather than the verb, which is a different
  composition order from SCUMM's and not merely a different presentation of the same one.

  Whether an authoring vocabulary should include its own discoverability remains `[open]`, and
  the third data point is in [prior-art/scumm.yml](../prior-art/scumm.yml): the verb coin is
  neither a bar nor a mode.
properties:
  era: "1997-present"
  vocabulary_shape: |
    Cursor modes, applied by clicking. The manual names Mode 0 (Walk), Mode 4 (Use Inventory),
    Mode 6 (Pointer) and Mode 7 (Wait), and refers to modes 1, 2, 3, 5, 8 and 9 without naming
    them on the page this corpus read. [verified] Four of ten are known here and the other six
    are on some page nobody has opened; this corpus does not guess them.

    The `StandardMode` property marks a mode that fires an event on whatever is clicked, and
    the manual attaches it to Walk, Look, Interact and Talk. [verified] Those four are
    therefore the ordinary verb-like modes, and the set is open at the author's discretion.
  scripting: |
    A C-like scripting language handles anything beyond a simple response. [inference] The
    boundary is soft and low in this corpus's recollection, but that recollection is now
    explicitly unsourced: the manual's scripting reference has not been read, and it is
    exactly the page that would say where declarative authoring stops. Until it is read, this
    corpus does not know where AGS's escape hatch sits — only that it has one.
  source_standing: |
    Two pages of the manual source read on 2026-09-09: `EditorCursor.md` and `Dialog.md`. Those
    two support the `[verified]` claims above and nothing else here. The scripting reference,
    the room and hotspot model, the character and object models, the inventory system and the
    GUI system are all unread, and the `[inference]` claims in this node rest on the same
    recollection they did at genesis.
