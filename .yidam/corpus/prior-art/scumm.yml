class: prior-art
label: SCUMM
description: |
  LucasArts' Script Creation Utility for Maniac Mansion — an authoring system whose
  defining choice was to put the verb vocabulary permanently on screen. The player did not
  discover what could be done; the verbs were listed, and every one of them could be
  pointed at every target. [inference] That is the strongest form of a bounded vocabulary:
  the bound is not merely enforced, it is displayed, and an author who wants a verb that is
  not there cannot add one for a single puzzle.

  The verb set contracted across the run of games it powered, and
  [Wikipedia's account](../../catalog/wikipedia-scumm.md) now supports that with a shape this
  corpus did not have at genesis. [inference] It reports the large on-screen set of the early
  games reduced, by *Full Throttle* (1995) and *The Curse of Monkey Island* (1997), to a "verb
  coin" at the cursor offering eyes (look), hands (use, pick up, push, pull) and mouth (talk,
  consume, inhale).

  **That is a third discovery surface**, and it is the finding worth carrying forward. A verb
  bar is bounded and visible; an AGS cursor mode set is extensible and hidden
  ([prior-art/ags.yml](../prior-art/ags.yml)); a verb coin is bounded, hidden until summoned,
  and *grouped by body part* rather than by word.

  **There is a fourth, from a third house, and this corpus had read it before it finished counting
  to three.** Dinky computes the menu from the target: a closed 57-verb master list for order,
  membership from the object's own `verb_*` fields, and a precondition test that removes a verb
  rather than refusing it ([delores-source](../../catalog/delores-source.md)). [verified] So it is
  **four answers to one question, from three houses, over thirty years**, and they do not converge
  — the bar and the coin are bounded where the mode set is not, the bar is visible where the other
  three are summoned, and only the popup is computed per target.

  Which verbs a player sees converged across these systems. **How they see them did not**, which is
  the same shape this corpus found one tier down about which operations an engine absorbs.
  [inference] `.yidam/decisions/tier-split.yml`.

  The tag stays `[inference]` and will not move. SCUMM's authoring documentation was never
  released, so the source of record is unreachable rather than unfetched, and everything
  citable here is a republisher. A cited inference is better than a remembered one and is not
  evidence.

  **The verb counts were looked for and are still not asserted.** That was the retrieval this
  node was waiting on and it did not deliver: the article does not state how many verbs
  *Maniac Mansion* presented. What it offers is a quote about the scripting language having
  "about 80% of the commands" of later versions, which is not a verb count and points the other
  way. Aggregator wikis do carry specific figures; the catalog entry records them as material
  seen and rejected. Recovering what LucasArts dropped and why remains the highest-value
  extraction available to this corpus, and it now needs a source that does not exist publicly.
properties:
  era: "1987-1998"
  vocabulary_shape: |
    A fixed verb bar rendered below the scene, with an inventory panel beside it. Selecting
    a verb then a target composed the binding; a binary verb took a second target after a
    connective word. [inference] Composition was therefore visible before commitment — the
    player read the sentence they were building.
  scripting: |
    The authoring surface is itself a scripting language, compiled to bytecode for a
    virtual machine. [inference] There is no declarative layer beneath it, so the question
    this corpus asks — where authoring escapes to a general-purpose language — has a
    degenerate answer here: it starts there.
  source_standing: |
    [Wikipedia's SCUMM article](../../catalog/wikipedia-scumm.md), read 2026-09-09, for the
    verb coin, the 1987-1998 range and the bytecode claim. That is an aggregator and cannot
    carry this node past `[inference]` — SCUMM's own authoring documentation was never
    released, so there is no source of record to reach for. Everything else here is
    recollection, including the composition order in `vocabulary_shape` above, which the
    article does not describe.
