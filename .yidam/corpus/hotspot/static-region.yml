class: hotspot
label: Static Region
description: |
  A region of a room that is targetable whenever the room is loaded, with geometry fixed at
  authoring time. It is the simplest thing in this vocabulary and it is seeded first for
  that reason: whatever a minimal vocabulary turns out to be, it contains this.

  Its interest is in what it does *not* have. No state, no behaviour, no position of its
  own beyond a polygon, and no way to stop being targetable. [inference] Everything an
  author might want beyond that — a door that is targetable only when closed, an object
  that vanishes when taken — is expressed by some other class writing a world flag that a
  conditional region reads, which pushes the complexity out of this class and into
  `world-flag`.

  **Whether that is the right place is measurable now, and the one shipped alternative is worse.**
  *Delores* writes presence imperatively, at 20 call sites across 20 distinct objects —
  `objectTouchable(x, NO)`, `objectHidden(x, YES)` — from whichever binding happens to be
  responsible ([delores-source](../../catalog/delores-source.md)). [verified] There is no
  declaration anywhere that the object's presence is conditional, so there is nothing to check
  the twenty sites against, and an object left untouchable by a binding that fired in the wrong
  order is a hotspot that has silently stopped existing.

  The declaration this class proposes moves the invariant from twenty call sites to one property.
  That does not prove `world-flag` is the right home; it removes the possibility that some obvious
  better home was being overlooked, because the only system this corpus can read chose *no home at
  all*. [inference]

  **And it shows this class fuses two things a real game keeps apart.** `objectTouchable` and
  `objectHidden` are separate operations there, used 11 and 9 times: a region can be **drawn and
  not targetable** — scenery the player sees and the cursor ignores — or targetable and not drawn.
  [verified] `visibility` below is one property covering both, and the fusion is a guess this
  corpus made without evidence.

  **Asked, and the fusion survives — but it was described the wrong way round.** Recounted across
  the whole source rather than the sample: 34 `objectTouchable` calls on 18 receivers, 11
  `objectHidden` on 6, only three receivers getting both, and where both appear they move in
  lockstep on adjacent lines. Fifteen receivers change targetability and never hiddenness; three
  change hiddenness and never targetability, and all three are one gag — a fire hydrant flickering
  under a `quiet_glitch` sound and being restored. [verified] Nothing but presentation reads the
  difference, which was the stated condition.

  The correction is that the two are not equal partners. **Drawing is `objectState`'s job there** —
  146 calls choosing which art an object shows, against 11 blunt hides — so `objectHidden` is a
  visibility override kept for effects and `objectTouchable` is the load-bearing half. [inference]
  What this class needs is a **targetability** property; calling it `visibility` is what invited the
  reading that it fused two things. `.yidam/decisions/hotspot-identity.yml`.

  **That was an inference from call sites and it is now structural.** In the room files, whether a
  thing can be targeted is a `hotspot` rectangle and what draws it is an `animations` list, and they
  are **different fields that mostly do not co-occur**: of 948 objects, 324 carry a rectangle, 598
  are drawn, and only 133 do both. **143 regions are targetable with nothing drawn under them at
  all** ([delores-source](../../catalog/delores-source.md)). [verified] Targetability is not derived
  from the art and never was; the format separates them at the point of declaration.

  **Two more confirmations, both from the engine's own manual.** `objectHidden` and `objectTouchable`
  are documented with **the same sentence** — "Sets or returns an objects hidden state. Objects that
  are hidden are also untouchable" — the second a copy of the first, wrong for the function it
  describes. [verified] The people who built it did not hold the two apart in prose either. And the
  coupling that does exist runs through a magic value: `objectState(object, state)` is documented as
  "If the state is set to `"gone"` then the object becomes untouchable". [verified] So drawing
  reaches targetability by one reserved string, which is the fusion this class was accused of,
  implemented.

  **A third absence, and it arrived from the other side of the vocabulary.** This class also has
  no way for a region to say what it is *relative to another region* — that it is part of one,
  that it is the same thing as one, or that it reads the way one does. The evidence for wanting
  that came out of a count of delegation, which is a `verb` question on its face: of the twenty
  sites where a Delores binding runs another binding, **eleven are not about running a response at
  all**. Four are a sink handing its mechanical verbs to its own faucet; two are a second clickable
  region of one circus and one hotel; three are traffic cones that read alike, one of them seen
  from another room; two are a thing that reads as a different thing while some flag holds — a
  shut bank's door reading as the sign on it. [verified]
  ([delores-source](../../catalog/delores-source.md), and
  `.yidam/decisions/delegation.yml` for the taxonomy.)

  A region that could say it reads as another would remove all eleven, and no verb primitive
  removes any of them. [inference] What it would cost is a decision this corpus has not made: the
  eleven want at least three different relations — part-of, same-as, and says-the-same.

  **A second game was never what this needed.** Ten of the eleven are two regions of one *drawn*
  thing, or several drawn things that read alike: a sink and its tap, a circus wanting two click
  regions, a hotel and its roofline, three traffic cones on a street with one of them seen again
  from another screen. The eleventh is state rather than geometry — a candy display reading as the
  candy once you have taken one. [verified]

  The specimens have none of it, and that is a committed census rather than an impression: the
  only bindings two hotspots share are bare exits with the same destination, which is two doors and
  not one door twice. [verified] — `crates/reachability/tests/identity.rs`. The divergence is
  structural. This format names hotspots and never draws them, `geometry` above is declared and
  nothing here authors it, and **you only need to say "these two regions are one thing" once regions
  are things you draw.** [inference]

  So what would settle it is not a second game but a design with geometry in scope — or the 307 KB
  of `.wimpy` files this corpus has held unread since it catalogued them, which is where those
  regions actually are.

  **They have been read, and the relation is declared in them by name.** A `.wimpy` object may carry
  a **`parent`**, and 27 objects across six parents do
  ([delores-source](../../catalog/delores-source.md)). [verified] The parents are machines — an
  `arrestTron`, a `copyTron`, three coroner's-office consoles — and each has several children: some
  props that draw a light or a flashing panel, and some **hotspot rectangles that are separate
  clickable regions of the one machine**, `arrestTronLight1_On` through `_3_On`.

  **Of the 27 children, exactly one is named by any script and none carries a binding. Of the six
  parents, four are declared and each carries exactly one — a `lookat`.** [verified] So the relation
  does real work: 27 regions resolve onto 4 bindings, and an author who did not have it would be
  writing either 27 declarations or the delegation the same game uses elsewhere.

  **That answers the question this node left open about which of three relations is wanted, and the
  answer is `part-of` alone.** `parent` says this region belongs to that object. It does not say two
  regions are the same thing, and it does not say one reads the way another does — and the traffic
  cones that made the three look different are still not expressible by it. [inference] The two
  mechanisms in that game divide the work: `parent` takes the 27 that are parts of one drawn
  machine, delegation takes the 11 that are not.

  **And the prediction the last phase closed on was right for the reason it gave.** It said "you
  only need to say *these two regions are one thing* once regions are things you draw", and the
  field turns out to live in the file where they are drawn, on objects that have rectangles and
  animations, declared by a tool that draws them. It is absent from the script side entirely: no
  binding, no helper and no documented engine call reads `parent`, and the manual's only parenting
  concept is `imageParentChild`, which is about images. [verified]

  What remained was narrower, and it was this corpus's own question rather than a retrieval. This
  vocabulary has no geometry, so a `part-of` here would attach one hotspot to another with nothing
  drawn under either, and the specimens exhibit none of it —
  `crates/reachability/tests/identity.rs` is the census that says so. The relation was evidenced and
  *named*, and it was declined on that condition.

  **Both halves of the condition moved after it was written, and neither change was carried back
  here.** The first became permanent: a day later `.yidam/decisions/drawn-boundary.yml` decided that
  this vocabulary is what an author types and that *"this design has no geometry"*. That is a
  standing rule now, not a temporary gap, so the condition can never be met inside `.game`. The
  second half became false: `.yidam/decisions/runtime-boundaries.yml` added drawing data outside the
  game file, so hotspots are now things that get drawn. [verified]

  **So `part-of` belongs to the drawing layer and not to this class.** That is where the shipped
  evidence put it: *Delores* declares `parent` in its `.wimpy` files, and no script reads it
  ([delores-source](../../catalog/delores-source.md)). [verified] It is also where this repository's own drawing layer would have to say it. The one
  scene that exists gives every target exactly one rectangle, the parser refuses a second, no two of
  its thirteen rectangles overlap, and `bond-in-cabinet` is drawn beside its cabinet rather than
  inside it. [verified] — `engine/play/tests/screen.rs`. Nothing here asks for the relation, in the
  only place it could be asked for. Whether the drawing format should ever give a target several
  regions is a question for the drawing format, and `design/graphical-client.md` already says it
  waits for a worked game that needs it. That test fails on the first scene that does. [inference]

  **And a different hotspot-to-hotspot relation is in the specimens after all — it is not identity,
  which is why the census above missed it.** A census of every predicate in the specimens found
  `case-open` read at four sites and `cabinet-open` at four, and in both games **two of the four are
  on a different hotspot: the thing inside the container, asking about the container's state.**
  [verified] — `crates/reachability/tests/conditions.rs`. The container's own two are ordinary — one
  describes it, one opens it. The other two exist only because what is inside is not reachable until
  it is open.

  **The relation is written into the identifier, which is as plain as this pressure gets.** Those
  hotspots are called `ledger-in-case` and `bond-in-cabinet`. [verified] The author could name the
  containment and could not declare it, so it went in the only place the format would take it, and
  the consequence — targetable only when the container is open — was written out by hand at both
  sites.

  That is **containment**, not one of the three identity relations above: the ledger is a separate
  target with its own bindings, and the case being open is a precondition on them rather than a
  claim that the two are one thing. [inference] It is not targetability either, which is worth
  saying because the property renamed above is the obvious place to reach for. The ledger is
  targetable throughout — the point of *"Under glass, and face down"* is that the player reads it
  — so what containment gates is what the bindings **do**, not whether the region can be clicked.

  **Weighed as a candidate primitive, and refused.** The two-hotspot shape is not an idiom that a
  relation would tidy: it is what `carried-form-of` makes of a container. The contents must be
  their own hotspot **because that hotspot vanishes when the item is taken and the container does
  not**. Fold them into one the way the shipped engine does — *Delores*'s file drawer is a single
  object and the camera it holds has no room object at all — and this vocabulary expresses it, and
  the checker immediately draws a line the two-hotspot form does not: *"gives 1 bond where 1 is
  already carried and 1 is the declared ceiling."* [verified] —
  `crates/reachability/tests/containment.rs`. The split is load-bearing.

  **What it would have bought is one predicate, and the corpus measured both.** Of the two derived
  sites, the `look-at` guard has a footprint of exactly zero — remove it and every figure is
  identical, because a response that writes no state is not a transition. The `pick-up` guard is
  the one that matters, and removing it lets the player take the bond through a locked cabinet:
  26 states against 20, and **every stranding gone**. [verified] Undetectable, and the third defect
  here that presents as good news.

  So the residue is real and small: **one unchecked predicate per instance, and two instances.**
  Six of the eight `is <item>` hotspots in these specimens are simply lying about with an unguarded
  `pick-up`; two are inside something, and those two are exactly the two whose names carry `-in-`.
  [verified] `.yidam/decisions/containment.yml` records what a declaration would have to say and
  why two instances did not earn it.

  **One thing the reading did settle outright: this is checkable.** `quickieToiletTubLit` in
  `Bathroom.wimpy` declares `parent: "quickieToilet"`, and no object of that name exists in that
  room, in any other room, or in any script — the nearest is `quickieToiletTube`, twelve objects
  further down the same file. [verified] A dangling reference inside one file, of the kind
  [room-manifest](../data-format/room-manifest.yml) argues a declarative room file should catch, and
  the only one of its examples that survives contact with a real game.
properties:
  geometry: |
    A polygon — and in the one shipped format available to read, a rectangle. All 324 targetable
    regions in *Delores* are axis-aligned rects given as two corners relative to the object's
    position, and the polygons in those files are walkboxes rather than hotspots
    ([delores-source](../../catalog/delores-source.md)). [verified] Nothing here narrows the
    property to a rectangle on one system's evidence; what the evidence removes is the assumption
    that a hotspot needs the same expressiveness as a floor region. A shipped game's hotspots
    never did.
  targetability: |
    Always, by default, and separately from whether the region is drawn. Renamed from `visibility`,
    which fused two things — see the description, and `.yidam/decisions/hotspot-identity.yml` for
    the census that separated them.

    The separation is not this corpus's invention: the format that ships puts the rectangle and the
    art in different fields, and 143 of its regions have the first without the second. [verified]
  cursor_feedback: |
    A name and, in most systems, a change of cursor shape. [inference] The name shown on
    hover is doing more work than it appears to: it is the only pre-commitment signal the
    player gets that a region is targetable at all, which makes it part of the vocabulary
    rather than presentation.
