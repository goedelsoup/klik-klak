class: verb
label: Use With
description: |
  The binary verb: apply a carried object to a target. It is the verb that forces the shape
  of everything downstream, and that is its claim to being irreducible rather than any
  claim about what it means. [inference] Once one verb takes two objects, the interaction
  table is two-dimensional, the inventory needs a selection state, the interface needs a
  way to express a pending first object, and every refusal has to name which of the two
  objects is wrong.

  A vocabulary without it is meaningfully smaller — not by one entry, but by a whole
  dimension. Whether the puzzles it enables can be expressed by unary verbs over a richer
  world state was called the sharpest form of this corpus's central question, on the reading that
  the answer decides whether "minimal" means fewer verbs or simpler ones.

  **The dimension is real and it is what makes the writing shorter.** Writing all eleven of the
  specimens' binary bindings without the second key costs **124 characters more**, a uniform eleven
  or twelve per site, because each has to say `carrying <item>` in a guard — which is what the key
  says for free. [verified] — `crates/reachability/tests/arity.rs`. The dimension is a discount, not
  a cost. `.yidam/decisions/arity-cost.yml`.

  **They can, exactly, and the answer had been sitting in this repository's own code.**
  `crates/reachability`'s `offered` gates a binding's second object on `items[o] >= 1`, and
  `Pred::Carrying(o)` evaluates to `items[o] >= 1` — the same expression, ten lines apart.
  [verified] Moving every second object into its guard leaves all four specimens analysing
  identically: same reachable set, transitions, strandings, winnability, latch violations.
  [verified] — `crates/reachability/tests/arity.rs`. Arity costs the state space nothing.

  **This verb keeps its place for a reason it did not give.**
  [binary-binding](../interaction/binary-binding.yml) says the item being carried is *structural
  and enforceable by the format* while only the gating flag is authored; the reduction moves it to
  the authored side, where it can be forgotten and can be written differently in two places. This
  corpus refused a narrower version of exactly that in
  [portable-object](../inventory-item/portable-object.yml). [inference] It also costs the report:
  the reduced form still finds the specimen's consumption trap and can no longer say which item was
  spent. [verified]

  **And the framing was wrong.** Fewer verbs or simpler ones was a false choice. Delores declares 57
  verbs, 18 of them binary in a list validated at boot, and has **no generic "use with"** — it kept
  arity and multiplied verbs, naming each binary application. [verified] See
  `.yidam/decisions/binary-dimension.yml`.
properties:
  arity: binary
  surface: |
    Composed rather than selected. [inference] SCUMM composed it verb-first (choose the
    verb, then two targets); Adventure Game Studio composes it object-first (choose the
    inventory item, then the target), which makes the item the mode. The two orders are not
    equivalent for the player: only the first shows the sentence before it commits.
  default_response: |
    A refusal, in every system this corpus has looked at, this said. [inference] The interesting
    design variable was supposed to be whether the refusal is generic ("That doesn't work") or names
    one of the two objects, since a naming refusal leaks information about which half was right.

    **The one system whose source this corpus holds has no default response to a binary verb at
    all.** `_checkVerbValid` returns `NO` for every member of `verb_usewith_list`, so a binary verb
    is never in a menu; the interaction is a drag, and `UIHelpers` walks the binary verbs looking for
    one the target will accept. Where none does, `drag_verb` stays null and the drop is guarded
    `if (drag_verb && drag_noun2)` — the drag ends and **nothing happens**
    ([delores-source](../../catalog/delores-source.md)). [verified]

    That is the same branch [default-binding](../../decisions/default-binding.yml) found for unary
    verbs, taken further: for a unary verb the engine at least declines to offer it, which the player
    can see. For a binary one there is nothing to offer and nothing to withhold. The design variable
    above is real and this game does not exhibit it, so it is a question about systems that answer
    every cell — and the count says how many that is: **50,676 cells, 203 authored**. [verified]
  earns_its_place: |
    **Assessed 2026-09-09. Verdict: yes, and arity is the reason — not meaning.**

    This verb was seeded on the claim that it forces the shape of everything downstream rather
    than on any claim about what "use" means. The evidence supports that, and from an unexpected
    direction: AGS's own mode system treats the binary case as structurally different.

    `Use Inventory` is cursor Mode 4, and the manual says `StandardMode` — which marks "a 'normal'
    cursor mode… using this cursor will fire an event on whatever is clicked on as usual" —
    applies to Walk, Look, Interact and Talk and **should not be enabled for it**
    ([ags-manual](../../catalog/ags-manual.md)). [verified] The engine dispatches binary
    differently from unary, and says so in the property grid an author sees.

    The event lists say the same thing from the other side. Characters and hotspots each carry a
    "Use inventory on" event distinct from "Interact", so the second object is not a parameter of
    an ordinary interaction but a different event entirely. [verified]

    SCUMM's side is thin and is recorded as thin: the v5 table carries `doSentence` (`$19`),
    "sentence" being that engine's term for the verb-and-objects construction, and the reference
    gives no parameters ([scumm-v5-opcode-reference](../../catalog/scumm-v5-opcode-reference.md)).
    [inference] The name is suggestive and the entry is empty; nothing here rests on it.

    So arity is not a property a verb happens to have. It is a fork in how an interaction is
    dispatched, and one system exposes that fork to authors as a checkbox. That is the concrete
    form of the combinatorics argument in
    [interaction/binary-binding](../interaction/binary-binding.yml): a binary verb makes the table
    two-dimensional, and the engine has to know before it can look anything up.
