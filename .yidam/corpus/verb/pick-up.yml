class: verb
label: Pick Up
description: |
  The unary verb that moves an object from a room into the inventory. It was added because the
  corpus demanded it: [inventory-item/portable-object](../inventory-item/portable-object.yml)
  described its binding in detail while the verb itself was not a node.

  It has now been assessed against both engines this corpus holds sources for, and **the answer
  is that the question was malformed.** "Does `pick-up` earn its place?" has two answers,
  because the two tiers of this ontology are asking different things. At the discovery surface
  the verb collapses and both systems collapsed it. At the level of what the engine actually
  does, the operation is distinct — and the two systems disagree about whether the engine should
  provide it.

  That is the finding, and it is a vindication of keeping the tiers apart rather than a result
  about this verb. A single-tier ontology would have had to answer yes or no and would have been
  wrong either way. See `earns_its_place` below for the evidence.
properties:
  arity: unary
  surface: |
    The two systems disagree, and this corpus said otherwise until 2026-09-09.

    Adventure Game Studio ships it. "Pick up character" and "Pick up hotspot" are documented
    events, one of the eight a character carries
    ([ags-manual](../../catalog/ags-manual.md)). [verified] An earlier reading of this node said
    AGS had no pick-up mode of any kind; that claim is withdrawn and the withdrawal is recorded
    below.

    SCUMM's late verb coin folds picking up into the hands group with use, push and pull
    ([wikipedia-scumm](../../catalog/wikipedia-scumm.md)). [inference]
  default_response: |
    A refusal that must distinguish three cases, not two: cannot be taken, already taken, and
    takeable but not yet. [inference] The third carries puzzle information, which makes this
    verb's default unusually load-bearing — and it is the one case a general `use` refusal
    cannot phrase, since "that doesn't work" is wrong when the answer is "not yet".
  earns_its_place: |
    **Assessed 2026-09-09; the surface half withdrawn and re-decided the same day.**

    **Verdict: the verb and the operation are independent, and each engine has exactly one of
    them.** This replaces an earlier verdict of "not as a verb, yes as an operation", which
    rested on a claim that turned out to be false.

    Two hypotheses were weighed.
    *H1 — irreducible*: pick-up is a primitive the vocabulary cannot do without.
    *H2 — collapses*: it is `use` applied to a takeable thing, and the system can work out the rest.

    **Withdrawn claim.** This assessment first read the discovery-surface evidence as one-sided
    for H2, on the strength of "Adventure Game Studio documents no built-in pick-up verb, mode or
    event of any kind", marked `[verified]`. It is false. AGS documents "Pick up character" and
    "Pick up hotspot" as events. The claim rested on two manual pages that happen not to mention
    the mode, and the catalog entry for those pages had *already recorded* that six of ten cursor
    modes were unnamed there. Absence of mention was read as absence, past a note warning that it
    was not.

    Evidence at the discovery surface, as it actually stands:
    - AGS ships a pick-up mode with its own event. [verified]
    - SCUMM's late verb coin folds picking up into the hands group. [inference] A system
      abandoning a distinction under production pressure is still the strongest kind of evidence
      available here — it is a revealed preference rather than an opinion — but it is now one
      system's preference against another's, not a convergence.

    Evidence for H1, at the level of the operation, and it is equally one-sided the other way:
    - SCUMM v5 carries a dedicated `pickupObject` opcode, `$25`
      ([scumm-v5-opcode-reference](../../catalog/scumm-v5-opcode-reference.md)). [inference]
    - **It carries `setOwnerOf` (`$29`) as well.** This is the decisive observation and it is
      about the table rather than about either opcode: a general ownership operation and a
      dedicated pickup operation coexist, so acquisition is not merely a change of owner or the
      second would be redundant. [inference]
    - Descriptions of ScummVM's reimplementation report `pickupObject` performing several writes
      at once — check whether already held, add, set owner, mark untouchable, set state, run the
      object's inventory script. [inference] Weaker than the rest: this is a primary source for
      ScummVM and an inference about SCUMM, and nobody here read the code.

    Put the corrected surface evidence beside the operation evidence and a cleaner result
    appears than the one this node first reported:

    | | verb at the surface | operation in the engine |
    |---|---|---|
    | SCUMM | folded into hands | dedicated `pickupObject` opcode |
    | Adventure Game Studio | `Pick up` event | none — `AddInventory` and author script |

    **A perfect inversion. Each engine has exactly one half and neither has both.** That is
    stronger support for keeping the tiers apart than the original verdict was, because it shows
    the two are not merely separable in principle but actually separated in practice, in opposite
    directions, by the two systems this corpus can read. A verb without an operation beneath it
    and an operation without a verb above it both shipped, for years, in games people finished. SCUMM bundled that operation into one opcode. Adventure Game
    Studio provides `AddInventory` — one write — and leaves the author to do the rest, saying
    nothing in its manual about what becomes of the room object. [verified] Two engines, opposite
    choices, about a thing neither of them exposes as a verb.

    What this assessment could not reach is whether AGS authors actually pay for that gap. The
    marker for it is on [acquisition-binding](../interaction/acquisition-binding.yml), which is the
    node that predicts the window; this one carried a second copy of the same question and now
    carries a pointer. `.yidam/decisions/testimony.yml` says what kind of question it is.

    *Since closed.* They pay before release. In eleven AGS games' scripts every pickup writes both
    halves by hand or keeps the object on purpose, and none ships the window
    ([ags-game-sources](../../catalog/ags-game-sources.md), `.yidam/decisions/ags-pickups.yml`).
    [verified]
