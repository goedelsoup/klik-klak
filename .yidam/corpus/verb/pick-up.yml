class: verb
label: Pick Up
description: |
  The unary verb that moves an object from a room into the inventory. It was added because the
  corpus demanded it: [inventory-item/portable-object](../inventory-item/portable-object.yml)
  described its binding in detail while the verb itself was not a node.

  It has now been assessed against both engines this corpus holds sources for, and **the answer
  is that the question was malformed.** "Does `pick-up` earn its place?" has two answers,
  because the two tiers of this ontology are asking different things. At the discovery surface
  the verb collapses and both systems collapsed it. At the level of what the engine actually
  does, the operation is distinct — and the two systems disagree about whether the engine should
  provide it.

  That is the finding, and it is a vindication of keeping the tiers apart rather than a result
  about this verb. A single-tier ontology would have had to answer yes or no and would have been
  wrong either way. See `earns_its_place` below for the evidence.
properties:
  arity: unary
  surface: |
    Not offered as a distinct selection by either system this corpus has sources for. SCUMM's
    late verb coin folds picking up into the hands group with use, push and pull
    ([wikipedia-scumm](../../catalog/wikipedia-scumm.md)). [inference] Adventure Game Studio's
    documented standard cursor modes are Walk, Look, Interact and Talk, plus Use Inventory as a
    non-standard mode; there is no pick-up mode
    ([ags-manual](../../catalog/ags-manual.md)). [verified]
  default_response: |
    A refusal that must distinguish three cases, not two: cannot be taken, already taken, and
    takeable but not yet. [inference] The third carries puzzle information, which makes this
    verb's default unusually load-bearing — and it is the one case a general `use` refusal
    cannot phrase, since "that doesn't work" is wrong when the answer is "not yet".
  earns_its_place: |
    **Assessed 2026-09-09. Verdict: not as a verb; yes as an operation.**

    Two hypotheses were weighed.
    *H1 — irreducible*: pick-up is a primitive the vocabulary cannot do without.
    *H2 — collapses*: it is `use` applied to a takeable thing, and the system can work out the rest.

    Evidence for H2, at the discovery surface, and it is one-sided:
    - Adventure Game Studio documents no built-in pick-up verb, mode or event of any kind, and
      acquisition is something the author scripts. [verified]
    - SCUMM, whose authors used a separate pick-up verb daily for roughly a decade, stopped
      distinguishing it — the late verb coin offers hands for use, pick up, push and pull as one
      selection. [inference] A system abandoning a distinction under production pressure is the
      strongest kind of evidence available here, because it is a revealed preference rather than
      an opinion.

    Evidence for H1, at the level of the operation, and it is equally one-sided the other way:
    - SCUMM v5 carries a dedicated `pickupObject` opcode, `$25`
      ([scumm-v5-opcode-reference](../../catalog/scumm-v5-opcode-reference.md)). [inference]
    - **It carries `setOwnerOf` (`$29`) as well.** This is the decisive observation and it is
      about the table rather than about either opcode: a general ownership operation and a
      dedicated pickup operation coexist, so acquisition is not merely a change of owner or the
      second would be redundant. [inference]
    - Descriptions of ScummVM's reimplementation report `pickupObject` performing several writes
      at once — check whether already held, add, set owner, mark untouchable, set state, run the
      object's inventory script. [inference] Weaker than the rest: this is a primary source for
      ScummVM and an inference about SCUMM, and nobody here read the code.

    The two bodies of evidence do not conflict. They are about different tiers, and the verdict
    follows: **the player-facing verb collapses into `use`; the authoring operation does not
    collapse into anything.** SCUMM bundled that operation into one opcode. Adventure Game
    Studio provides `AddInventory` — one write — and leaves the author to do the rest, saying
    nothing in its manual about what becomes of the room object. [verified] Two engines, opposite
    choices, about a thing neither of them exposes as a verb.

    What remains `[open]` is the question this assessment could not reach: whether AGS authors
    actually pay for that gap. `interaction/acquisition-binding` predicts a window in which the
    object is in neither place, and the manual's silence is consistent with the bug and does not
    demonstrate it. The AGS forums would likely settle it and nobody here has read them.
