class: verb
label: Walk To
description: |
  Movement: send the player character to a place. It is the verb this corpus went looking for,
  because a specimen authored in this vocabulary reached for it at six sites and no `verb` node
  declared it — the one member `vocabulary-coverage`'s *undeclared and reached for* list has ever
  had, and the only evidence this corpus holds that its vocabulary is too **small**.

  **Assessed, and the answer is that it is not a verb.** Not subsumed by another verb, which is
  what happened to [give-to](../verb/give-to.yml) — nothing here collapses into anything. It fails
  a different test: what an author can write in this slot is always the same thing, and that
  thing is an exit.

  **The verdict is unchanged and the argument that produced it is withdrawn.** This node said the
  response is *computed* rather than authored, and that "a verb with no authorable response has
  nothing for an interaction table to hold". A fourth system gives it one. See `earns_its_place`:
  the correction makes the case stronger, because an absence has been replaced by a witness.

  What the specimen actually needed is a different thing, in a class this assessment was not
  looking at, and this corpus declared it at genesis and then forgot: an **exit**.
properties:
  arity: unary
  surface: |
    Present in all three surfaces this corpus can read, and each of the three sets it apart.

    Adventure Game Studio ships it as Mode 0, and the manual groups it with the ordinary modes:
    `StandardMode` marks "a 'normal' cursor mode - i.e. using this cursor will fire an event on
    whatever is clicked on as usual", and "this mode applies to the standard Walk, Look, Interact
    and Talk modes" ([ags-manual](../../catalog/ags-manual.md)). [verified]

    **The same page withdraws the footing two paragraphs later**, and this corpus had read the page
    twice without recording it. "For the standard modes, Mode 0 will cause the player to walk to
    the mouse pointer location when clicked. Modes 1, 2, 3, 5, 8 and 9 will run the event with the
    same name as the cursor mode." [verified] Two bullets, and the first is an exception to the
    second: every standard mode dispatches to an event of its own name, and Mode 0 walks. It is
    grouped with them and exempted from the thing that makes them what they are.

    SCUMM's verb coin **dropped it out of the verb set entirely.** The article's list is a closed
    one — "the option to use character's eyes (to *look*), hands (to *use*, *pick up*, *push*,
    *pull*, etc.), or mouth (to *talk*, *consume*, *inhale*)"
    ([wikipedia-scumm](../../catalog/wikipedia-scumm.md)). [inference] Three groups, and no legs.
    The same contraction kept `talk` as a group of its own and folded `pick-up` into hands; it did
    not fold walking anywhere. It stopped being a verb and became what happens when you click.

    **Thimbleweed Park keeps it in the table and, as far as the diary shows, not in the
    surface.** `verbWalkTo` is a first-class binding slot on an object, written exactly like
    `verbLookAt` and `verbUse` beside it ([twp-dev-diary](../../catalog/twp-dev-diary.md)).
    [verified] The only place the diary names verbs as a set is an argument about keyboard
    shortcuts, and it lists six — Open, Close, Use, Push, Pull, Pickup — with no walk.
    [verified] So the slot exists where a binding is written and the word does not appear where
    verbs are chosen, which is the **exact reverse of AGS**, where Mode 0 sits in the standard
    mode list and is missing from the dispatch table. [inference] Neither system has it in both
    places, and they fail to in opposite directions.

    Tumbleweed retyped it. The template provides twelve actions and eleven of them carry one
    prefix: `eGA_LookAt, eGA_TalkTo, eGA_GiveTo, eGA_PickUp, eGA_Use, eGA_Open, eGA_Close,
    eGA_Push, eGA_Pull, eGA_UseInv, eGA_Default and eMG_WalkTo`. [verified] The twelfth is
    `eMG_WalkTo`. **What `eMG_` denotes is not on the page and this corpus does not know it** —
    what is on the page is that the template's author drew a distinction here and nowhere else in
    the list. That is the same template that put `eGA_GiveTo` back after the engine had collapsed
    it, so it is a template willing to add verbs, and it declined to add this one as one.
  default_response: |
    **There is none, and that is the finding.** This property asks what a verb says when directed
    at a target no interaction was authored for, and `walk-to` has no answer in any of the four
    systems read here — not a generic refusal, not a per-category one, nothing. Thimbleweed Park
    is the one that gives the verb an authorable response and it does not change this: a slot an
    author fills per door is not a default, and no post describes what happens at a target where
    the slot is empty. [inference]

    AGS says so in the strongest available form. `unhandled_event`'s parameter table is a verb ×
    entity-kind matrix of twenty-six rows, and it is the most information-dense thing this corpus
    has retrieved ([ags-manual](../../catalog/ags-manual.md)). Look, Interact, Talk, Use-inventory
    and Pick up all appear in it. **So do "Cursor Mode 8" and "Cursor Mode 9"** — modes the manual
    declines to name, that an author invents, against hotspots, objects and characters alike.
    Walk appears in none of the twenty-six. [verified]

    An absence is weak evidence and this one is not, for the reason `pick-up` had to learn the hard
    way: it is an absence *alongside* the inclusion of things weaker than itself. A table that gives
    a fallback row to a mode nobody has named yet is not a table that omits modes for want of space.

    The reason is that there is nothing to fall back from. A default response is what the engine
    says when the author wrote no binding; walking at an unauthored target is not an unhandled
    interaction, it is walking. The response is produced by [path-solver](../subsystem/path-solver.yml),
    whose `authoring_visibility` this corpus already recorded as "None. An author draws walkboxes
    and never touches this." [inference] Every other verb in this vocabulary resolves to something
    an author wrote. This one resolves to geometry.
  earns_its_place: |
    **Assessed 2026-09-09. Verdict: no — and it is the first of the five assessed here to fail,
    and it fails on a test the other four never had to take.**

    The two-tier test returns a verdict this corpus has not seen before. It is not that the tiers
    disagree between engines, which is what happened to `pick-up` and `talk-to`. Both tiers agree,
    and they agree that this is not a verb.

    *At the operation tier it is the heaviest thing in the vocabulary.* SCUMM v5 carries **three**
    dedicated walk opcodes — `walkActorTo` (`$1E`), `walkActorToActor` (`$0D`), `walkActorToObject`
    (`$36`) — names and numbers with no descriptions, the same shape as `pickupObject`
    ([scumm-v5-opcode-reference](../../catalog/scumm-v5-opcode-reference.md)). [inference] No other
    verb this corpus has assessed gets more than one.

    And the observation that decided `pick-up` holds here in the same form and about the same
    table: **a general operation coexists with the dedicated ones.** `putActor` (`$01`),
    `putActorAtObject` (`$0E`) and `putActorInRoom` (`$2D`) place an actor somewhere. Walking is
    therefore not merely a change of position, or three walk opcodes would be redundant beside
    three placement opcodes. [inference] The two families even mirror each other on target kind —
    coordinates, an object, and in the walk family an actor — which is the per-entity-type dispatch
    [give-to](../verb/give-to.yml) found in AGS, appearing in SCUMM's opcode table for exactly one
    verb.

    *At the discovery surface it is present everywhere and exceptional in every presence.* Grouped
    with the standard modes and exempted from what makes them standard; kept by two verb bars and
    dropped by the contraction that preserved `talk`; retyped by a template that was adding verbs
    at the time. [verified]

    *And the third tier is where the assessment was wrong, and where it is now strongest.* This
    said `walk-to` has no authorable response at all, and rested it on an absence: AGS's fallback
    matrix has no row for it, and this corpus's own `path-solver` records that an author never
    touches the thing that produces its behaviour.

    **A fourth system was read a phase later and it has one.** Thimbleweed Park's objects carry
    `verbWalkTo` as an ordinary binding slot ([twp-dev-diary](../../catalog/twp-dev-diary.md)),
    and the sentence "no engine lets an author write its response" is false. [verified]

    | verb | surface | operation | authorable response |
    |---|---|---|---|
    | `look-at` | kept by all four | none anywhere | yes |
    | `talk-to` | kept by all four | AGS only | yes |
    | `use-with` | kept by all four | AGS dispatches it separately | yes |
    | `pick-up` | SCUMM folded, AGS and TWP kept | SCUMM only | yes |
    | `walk-to` | exceptional in all four | **three opcodes in SCUMM, hard-coded in AGS, a phase of every verb in Delores** | **yes, in one — and it is always the same response** |

    **What is written in it decides, and it is better evidence than the absence was.** Every
    `verbWalkTo` the diary shows — on a hall door, on a hotel-room door, on a test street's bank
    door — is `enterRoomFromDoor(<the door on the other side>)` and nothing else. [verified]
    Three of three, and the sample is small and consistent. The slot is authorable and what
    authors put in it is an **exit**.

    So the verdict stands on a positive finding instead of a missing table row. `walk-to` is not
    a verb because its response does not vary with the target the way a verb's does: `look-at`
    says something different about every object in the game, and this says *go through*. A verb
    whose authorable response is a fixed shape parameterised by a destination is a different
    primitive wearing a verb's clothes.

    The column that was added to hold this verb is still the one that answers the question, and
    four assessments went by without needing it. [inference] A vocabulary measured only by what
    engines provide would have kept this verb on the strength of the operation column, which is
    the strongest in the table.

    **What the specimen was actually writing.** All six sites carry `do move <room>` and nothing
    else ([design/specimen](../../../design/specimen/README.md)), and `move` is not theirs — the
    ferry's toll moves the player under `use-with`. So the verb contributed no effect the
    vocabulary lacked. It contributed a *trigger*, and every system provides that trigger without
    a verb:

    - AGS stock: "Walk off left edge" and its three siblings are room events; "Stands on hotspot"
      is a hotspot event; regions carry "Walks onto", "Walks off" and a repeating stands-on.
      [verified] All position-triggered, and the manual places them outside verb dispatch
      explicitly — "the 'Character stands on hotspot' event does not trigger this function".
      [verified]
    - Tumbleweed needed more than that and built it **outside the action enum**. An exit is
      declared by writing an extension into the hotspot's *description string* — `Exit>e`, or
      `>el`, `>er`, `>eu`, `>ed` to leave by a screen edge — and dispatched through `Usermode_1`,
      landing in a handler named `hExit_Mode8`. "Clicking on such a hotspot will make the player
      walk to it and change the room afterwards." [verified]

    That last is the specimen's construct exactly, and the template that added `eGA_GiveTo` to the
    verb list put this one in a description string instead. [inference]

    **This corpus declared exits at genesis and the specimen did not know.** `room -connects-to->
    room` is "An exit leading to another room", and
    [data-format/room-manifest](../data-format/room-manifest.yml) lists a room's written form as
    its extent, backgrounds, hotspot geometry, walkbox polygons "and its exits" — naming "an exit
    naming a room that does not exist" as checkable while reading the file. The authored game
    format has no exits, so a game written in it reached for a verb to stand in for one.

    **"Invented" is the word this said and it is the wrong one.** A walk-to binding on a door
    whose whole body is *go to the other room* is what Thimbleweed Park's authors write, in the
    same slot, for the same reason. [verified] The specimen converged on a shipped engine's
    construct from five verbs and no knowledge of it — which is a stronger result than the
    invention it was described as, and is the reason the residue below is worth more than a tidy
    verdict would have been.

    **What `connects-to` does not have was the interesting residue.** It is discharged below — the
    marker stayed here for two phases after the prose under it stopped agreeing with it. One of the
    six sites is guarded and refuses:

        walk-to:
          when  door-open
          do    move base
          else  "Locked, and the salt has taken the hinges."

    A bare edge between two rooms cannot say that. An exit wants a precondition and a refusal,
    which makes it a binding — and its trigger is arrival rather than a verb applied to a target,
    which is the one shape [the interaction table](../data-format/interaction-table.yml) cannot
    index. Proposing that primitive is not this assessment's to do; establishing that the need is
    real, and that it is not a verb, is.

    **A second class has since asked for the same thing, from a direction this assessment did not
    look in.** [cutscene/scripted-sequence](../cutscene/scripted-sequence.yml), assessed against a
    specimen two phases later, reduces on every ground it was seeded on except one: a sequence
    that begins because the player *arrived* somewhere. Not a verb applied to a target — the same
    missing site. [inference]

    That changes what the residue is evidence for. One class wanting a primitive is a case; two
    unrelated classes wanting the same primitive, found by two different methods — a verb
    assessment reading engine documentation, and a specimen written to force a collapse — is
    evidence about the primitive. Whatever an arrival trigger turns out to be, it is not a
    property of exits and not a property of sequences.

    **And building it showed the two classes wanted two different things, which corrects the
    paragraph above.** `on-enter` exists now
    ([interaction/entry-binding](../interaction/entry-binding.yml)) and it does **not** discharge
    this residue. The sentence "an exit's trigger is arrival rather than a verb applied to a
    target" was too quick: an exit's refusal — *"Locked, and the salt has taken the hinges"* — is
    said when the player clicks a door, before any arrival, and a binding that fires on entering
    the far room is too late to say it. [inference]

    The two wants were arrival at two **granularities**: a room, for the sequence, and a place
    within a room, for the exit. AGS provides both and keeps them apart — room entry events on
    one side, stands-on-hotspot and regions on the other
    ([ags-manual](../../catalog/ags-manual.md)). [verified] Only the room-level one has been
    demonstrated by a specimen, so only it was built.

    **The residue has an answer now, measured off a shipped game rather than argued.** *Delores*
    is the same engine three years later, and its whole source is public
    ([delores-source](../../catalog/delores-source.md)). Four counts settle most of this.

    **Walking is a phase of every verb, declared by exception.** The engine's verb table carries
    a list called `verb_no_walkto` with **four** members; every other verb in the game walks the
    actor to the target first, and the manual says what happens then: `execSentence(actor, verb,
    noun1, noun2)` — "If the actor has to walk, the verb code will be called from
    `_actorArrived`." [verified] That is this node's verdict stated by the engine's own data
    structure. Walking is not one of the things you can do to an object; it is what happens
    before you do any of them, and a verb opts out of it by being named in a list.

    **The unconditional exit is a declaration and there are twenty of them.** An object writes
    `to_door = @Room.doorObject` and `door_verbs = YES`, and carries no code at all. The engine
    synthesises the rest — `_initObject` "sets up door verbs if `object.door_verbs` is set" — and
    what it synthesises is exactly the shape this residue asked for: `okverb_use` returning
    `state == "open"`, and a `verb_use` that calls `exitRoomFromDoor` when it does. [verified]
    **A precondition and a response, generated from one boolean.**

    **The exit that must refuse is a binding, and there are three.** `VERB(walkto)` appears
    eleven times in the game: eight are a single `exitRoomFromDoor(...)` between outdoor screens
    that have no door object to declare, and three are a `sayLine` — *"The street looks blocked
    off."* [verified] So both halves of the residue are visible in one game, and they are
    written differently: the exit that needs nothing is data, and the exit that needs to speak is
    code.

    **The gated exit was recorded here as unanswered, on a claim that is false.** This node said
    no exit in Delores is ever gated — no `to_door` object made untouchable, no door locked and
    later opened — and predicted where a gate would go if anyone wrote one: *"on the door's `open`
    verb while the exit itself stayed a bare declaration"*.

    **The prediction was right and the claim that nobody had used it was wrong.** `Nickel.door`
    carries `door_verbs = YES`, `to_door = @AStreet.nickelDoor`, and a `VERB_PRE(open)` that returns
    `NO` unless the camera is in inventory — *"I should find the camera before setting out."* The
    engine's dispatcher aborts the verb on that `NO`. [verified] A bare declaration with a
    precondition and a refusal on its `open` verb: exactly the shape read off the vocabulary here,
    written down, and it is the gate that starts the game. A second exit is gated by the other
    mechanism this node said was unused — `MainStreet.bankDoor` runs `objectTouchable(this,
    Bank.open ? YES : NO)` in its own `enter`. [verified]

    Both were missed because neither is a `VERB_OK`, which is where a reader looks for a
    precondition, and one of them hangs on a binding the engine generates and never writes down.
    See [delores-source](../../catalog/delores-source.md), which carried the same error.

    **So the residue is discharged rather than narrowed.** Both halves are exhibited in one shipped
    game — eighteen bare declarations and two gated — and the primitive is built:
    `exit <name> to <room>`, with an optional `when` and `else` under it, expanding at parse time
    into the binding this node's own example was written as. The specimens agree on the shape
    without having been consulted about it: 20 exits, 15 bare, 5 carrying a guard or refusal.
    [verified] `.yidam/decisions/exit-archetype.yml`.

    **And the other granularity is built there too.** This node concluded that the two classes
    wanting arrival wanted it at two granularities — a room, and a place within a room — and that
    only the first had been built here. Delores has the second: `Templates/TRIGGERNAME.dinky`
    declares `triggerEnter(actor)` and `triggerLeave(actor)`, and the game uses 11 and 13 of them
    across six rooms. [verified] A region within a room, entered and left, with the actor passed
    in. It is a separate object kind rather than a verb, which is the same answer this corpus
    reached for `on-enter` one granularity up.

    **A fourth arrival at the same conclusion, from a direction that knew nothing about verbs.**
    Measured as characters of frame against characters of writing, `walk-to` is **the only verb in
    this language whose response blocks cost more to type than they carry** — 0.94, where `look-at`
    is 4.12 and the corpus averages 1.98 — and the fifteen bare exits are the only response blocks
    in 664 lines of authored game containing no prose at all. [verified] —
    `crates/game-format/tests/duplication.rs`.

    A verb whose responses are empty of writing is a verb the author is not writing anything with,
    which is what this node concluded from engine documentation four phases before anything could be
    counted. `.yidam/decisions/frame-width.yml`.
