class: verb
label: Give To
description: |
  The binary verb that transfers a carried object to an actor. It was seeded as a test rather
  than a commitment, on the stated condition that if `use-with` subsumed it the corpus would
  have its first demonstrated collapse.

  **It does at the engine tier — and AGS's own SCUMM-emulating template puts it back at the
  authoring tier.** The node is kept rather than deleted, because the
  argument is worth more than the entry was: a vocabulary that grows by accident needs a record
  of what it declined to keep, and a deleted node leaves the next author free to propose this
  again from scratch.

  **A third line of evidence, from a direction the assessment above did not use.** A specimen
  authored in this vocabulary — three rooms, twenty-three bindings, an actor who hands the player
  two objects — never reached for this verb
  ([design/specimen](../../../design/specimen/README.md)). [inference] The earlier
  verdict was documentary: the manual says giving is using-an-item-on-someone. This one is not
  about what a manual says but about what a game wanted, and it wanted `use-with`. Weak on its
  own — one small game — and it points the same way.

  It is superseded by [use-with](../verb/use-with.yml).
properties:
  arity: binary
  surface: |
    None of its own, in either system this corpus can read. Adventure Game Studio routes it
    through `Use inventory on character`, which is the same event as using an item on anything
    else ([ags-manual](../../catalog/ags-manual.md)). [verified] No source read here says whether
    SCUMM's early verb bar carried a separate "Give"; see the note on `originated-in` below.
  default_response: |
    Moot. Whatever refusal an author writes belongs to `use-with` applied to an actor.

    The observation that motivated seeding this verb survives the collapse and is worth keeping:
    a refusal from the *system* ("that doesn't work") and a refusal from the *actor* ("I don't
    want that") are different events, and the second is authored content. [inference] That
    distinction is real; it just is not a distinction between two verbs.
  earns_its_place: |
    **Assessed 2026-09-09; qualified the same day. Verdict: subsumed at the engine tier, and
    demonstrably resisted at the authoring tier.**

    The case for distinctness rested on the target's class rather than on the action: giving to an
    actor differs from using on a crate because an actor may refuse, may want something else, or
    may react. The manual answers it directly, and this is the source of record saying it rather
    than this corpus inferring it:

      "Use inventory on character... Occurs when the player uses an inventory object on a
       character. **This event could be used to allow the player to give items to characters.**
       You can use the `player.ActiveInventory` property to distinguish which item they used."

    [verified] There is one event for applying an item to an entity, and giving is a use of it.

    The refinement is the interesting part, and it rescues the original intuition without
    rescuing the verb. AGS *does* distinguish by target class — "Use inventory on character" and
    "Use inventory on hotspot" are separate events — but it does so at the level of **which entity
    type the handler hangs off**, not by adding a verb. [verified] So the target's class is a real
    axis and it is orthogonal to the vocabulary: one verb, dispatched per entity type.

    **The qualification, which arrived from AGS's own manual one phase later.** Tumbleweed, a
    template shipping with AGS to emulate SCUMM-style interfaces, provides twelve actions and
    `eGA_GiveTo` is one of them — listed separately from `eGA_UseInv`
    ([ags-manual](../../catalog/ags-manual.md)). [verified] Authors given an extensible vocabulary,
    building on an engine whose core has exactly one event for applying an item to an entity,
    put the distinction back.

    So the collapse is real and it is not where this node first put it. The **engine** subsumes
    giving into using: one event, and the manual says it covers the giving case. The **authoring
    vocabulary** does not, at least not for the authors who reached for a SCUMM-style interface,
    and that is a revealed preference of the same kind this corpus treated as strong evidence
    when SCUMM's coin dropped `pick-up`. Evidence cannot be strong in one direction only.

    What is genuinely settled: `give-to` needs no engine support that `use-with` does not already
    have. What is not settled and was claimed: that an authoring vocabulary should therefore omit
    it. `[open]`

    This is the third time the tier split has been the answer to a question this corpus asked as
    though it had one — after `pick-up` and `talk-to`. That is now a finding about the method
    rather than about any verb.

    That answers a question raised elsewhere in this corpus.
    [interaction/conversational-binding](../interaction/conversational-binding.yml) records that a
    binding whose precondition is about the *class* of its target "is something the interaction
    table cannot currently express". AGS expresses it by having a table per entity type instead of
    one table with a class test in it. Whether that is a good trade is `[open]`; that it is a
    design available to this project is now `[verified]`.
