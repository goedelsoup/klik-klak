class: inventory-item
label: Portable Object
description: |
  An object the player has picked up and can offer as the second object of a binary verb.
  It is seeded as the plain case, and the plain case already carries this corpus's most
  contested typing decision: the class is a UFO **role**, so this node is not a new thing
  that came into existence at pickup — it is the same object, playing a part it plays only
  while carried.

  The claim that makes falsifiable is about engines rather than about ontology. [inference]
  An engine that models the room object and the inventory object as two separate records
  has to keep them in step, and every such pair is a place where taking an object twice, or
  taking one that was already destroyed, becomes representable. Whether real engines do this
  and what it costs them was the question here, and it was called the first thing worth
  extracting from prior art.

  **Both halves are answered, and the answer to the first is no.** *Delores*'s camera sits in a
  file drawer, and **there is no room object for it**: `Nickel.wimpy` declares `fileCabinet` and
  `fileDrawer` and nothing else, and the camera exists only as an inventory item
  ([delores-source](../../catalog/delores-source.md)). [verified] The drawer's `VERB(lookin)` calls
  `pickupObject(Inventory.camera, delores)` directly. One record, not two, so there is no pair to
  keep in step.

  **What that costs is the question asked in reverse, and it is four hand-written tests.** With no
  room object, nothing stops being anywhere when the camera is taken, so every site that cares has
  to ask. `inInventory(Inventory.camera)` appears **four times in `Nickel.dinky`** — three of them
  on the drawer itself, branching `lookin`, `lookat` and `open` — and each is prose the author
  maintains. [verified] This design writes `is <item>` once and the hotspot's absence follows.

  **And the failure this node predicted for the fused design was built and produced exactly it.**
  Rewriting a specimen's container the way that engine writes one — the contents folded into the
  container as a `pick-up` on it, no separate hotspot — gives the same 20 states and the same
  three strandings, and the checker adds a line the two-hotspot form does not draw: *"gives 1 bond
  where 1 is already carried and 1 is the declared ceiling"*. [verified] —
  `crates/reachability/tests/containment.rs`. **Taking an object twice becomes representable**, in
  the words this node used before anything had been built.

  So the two-record model is this design's and not the shipped engine's, the window it opens is
  closed here by derivation rather than by atomicity, and the one-record alternative pays for it at
  every site that has to ask a question the structure would have answered. `.yidam/decisions/containment.yml`.

  **Every relationship this class declared was about an object arriving, and none about spending
  one.** `found-in` says where it is, `carried-form-of` what it was, `acquired-by` which binding
  took it. A specimen written in the proposed authoring language needed to say an item was spent,
  at four sites, and could not ([design/specimen](../../../design/specimen/README.md)).

  **Closed by `interaction -consumes-> inventory-item`**, and closed only after the reduction was
  tried: a flag standing in for consumption would mean every consumable item's availability is
  authored twice — once structurally by the format, which
  [binary-binding](../interaction/binary-binding.yml) says is where "the item is carried" belongs,
  and once by hand — with nothing holding the two in step. [inference]
  [consuming-binding](../interaction/consuming-binding.yml) is where a spend happens; see
  `.yidam/decisions/effect-vocabulary.yml` for the three sibling gaps that did not survive the
  same test.

  **The rule in that paragraph convicts this node's own link list, and nothing announced it.**
  *Authored twice, with nothing holding the two in step* was written against a flag standing in
  for consumption. It is an exact description of `found-in`, which this node authors beside
  `carried-form-of` — the room, and the hotspot that is in the room. [inference] A node can state
  a rule and carry an instance of its violation, because it is looking outward when it writes the
  rule.

  **`found-in` is real and it is never information.** In the proposed format it was `holds <item>`
  in a room section, and four ways of writing it wrong — omitted, moved to another room, aimed at
  an item nothing stood for, contradicting itself across two rooms — gave the same 91 states, the
  same one stranding and the same silence as the specimen as committed
  ([design/specimen](../../../design/specimen/README.md)). [verified] It is a resolve error now.
  Of `lighthouse.game`'s five items, two are found in the room of their carried form, one in the
  room its binding is sited in, and two are given inside a conversation and so are found nowhere
  at all. [verified] The relationship is derived where it is defined and undefined where it is
  not, which is not a thing to ask an author for.

  **The pair that *is* stated twice is `carried-form-of` and `acquired-by`, and its disagreements
  are silent in the flattering direction.** `is <item>` names the hotspot that stops being in the
  room; the `give` in a binding on that hotspot is what makes it stop. Name different items and
  the hotspot stays there forever while the player carries the thing. Making `nightwatch.game`'s
  wire hand over the ledger instead resolved without a word and took the analysis from fourteen
  states and two strandings to **six and none**, still reporting the game winnable. [verified] A
  defect that lengthens a report gets investigated; one that shortens it looks like progress. The
  two are held against each other now — a binding on the hotspot must give the item it stands
  for — and `.yidam/decisions/found-in.yml` is the record.

  Most of the `[verified]`s above rest on a committed test rather than on a document, and for four
  phases this node linked no catalog entry at all, so `yidam lint` reported it as
  `verified-unsourced`. It no longer does — the paragraphs about Delores's file drawer cite a
  source, and one citation is enough to silence the rule for a whole node. That is worth noticing
  rather than being pleased about: **the warning went away without any of the claims it was about
  becoming better sourced.** The tags were right and the report was right, and what is missing is
  still a way to cite the second kind of evidence; `.yidam/decisions/found-in.yml` names it, and
  [consuming-binding](../interaction/consuming-binding.yml) is now the node carrying the warning
  instead. This sentence named `counter-flag` for four phases after `counter-flag` stopped
  qualifying; it is held by a check now rather than by hand
  (`.yidam/decisions/evidence-kinds.yml`).

  **Whether an item nothing reaches for is an item at all is this class's page's question, moved
  here because this is the node it is about.** An item that is never required, consumed, or offered
  as the second object of a binding is scenery with an icon — and the corpus has no such instance,
  so the question has had nothing to be asked of since it was written. Both instances here are
  reached: this one by `requires` and `consumes`,
  [stackable-item](stackable-item.yml) by `consumes`. Whether that absence is evidence the case
  does not arise, or evidence that this corpus seeds only the cases it already has arguments for,
  is what a fifth specimen would answer. `[open]`

properties:
  acquisition: |
    A binding whose response removes the object's hotspot from the room and adds the item to
    the inventory. [inference] Those are two writes, and an engine that cannot make them
    atomic has a window in which the object is in neither place.

    **The proposed format has one write and a derivation, so the window does not open** — `give
    <item>` is the effect and the hotspot's absence follows from `is <item>` naming it. [verified]
    What replaced the atomicity problem is an agreement problem: the derivation fires only when
    the two name the same item, and it fires silently when they do not. That is checked now, and
    it was not checked for the four phases in which the derivation was the argument for calling
    this not-a-gap.
  quantity: one
  combinable: yes
  icon: |
    A small sprite drawn in the inventory panel. It is the only representation the player
    has of the object once carried, which makes it part of the vocabulary: an item whose
    icon does not read is an item the player will not think to use.
links:
