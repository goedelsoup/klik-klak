class: cutscene
label: Scripted Sequence
description: |
  A sequence that takes control from the player, moves actors and the camera on its own
  schedule, writes state, and returns control. It is the only instance of a class this
  corpus seeded while doubting it, and the doubt is the point: nothing in this ontology
  points *at* a cutscene, which is a structural hint that it may not be a primitive.

  The reduction to be argued against is that this is an interaction whose response is long
  and whose input is locked. [inference] The one thing it has that no binding does is a
  *trigger* that is not a player action — a sequence can begin because the player entered a
  room or because a counter reached a value.

  **That question was posed as a disjunction and the disjunction was false.** It offered two
  homes for a non-player trigger — this class, or `world-flag` — and a source names a third that
  is neither. AGS documents position as a first-class event family: room edge events, "Stands on
  hotspot" with its `hHotspot_WalkOn` handler, and regions carrying walks-onto, walks-off and a
  repeating stands-on ([ags-manual](../../catalog/ags-manual.md)). [verified] The manual places
  them outside verb dispatch in its own words — the stands-on-hotspot event "does not trigger"
  `unhandled_event`. [verified]

  So "the player entered a room" is not a property of a cutscene and not a flag. It is where the
  actor is, and `actor -occupies-> room` has been in this corpus's effect vocabulary since
  `effect-vocabulary`. The leg is gone: the trigger is real, it is expressible, and it is not
  evidence for this class, because it exists whether or not any cutscene uses it. Found while
  assessing [walk-to](../verb/walk-to.yml), which is where the same family answers a different
  question.

  **The class then stood on one leg instead of two**: a sequence beginning because a counter reached
  a value. Nothing read here documented a threshold trigger in either engine, and it was looked for.
  Whether that was a genuine gap or the same position trigger wearing a number was the question a
  later phase inherited.

  **It was found, and it is neither.** AGS documents it and names the problem in this corpus's own
  words — *"One of the most common things you'll need to do when scripting is to check if something
  has happened in the game — and if so, then make the game do something in response"*
  ([ags-manual](../../catalog/ags-manual.md)). [verified] The answer is `repeatedly_execute`, run on
  every game loop at forty a second, and the page's worked example is a threshold on a counter. The
  *occasion* is a declared event in the room's event table; the *condition* is a scripted `if`.
  There is no declarative form of **when this value reaches that**, in either era of that system.

  **And this design cannot have the occasion, because it refused duration.** Nothing runs between
  bindings, so the only moments at which a threshold can be crossed are the bindings that write the
  value — and those are enumerable, which makes the trigger expressible by appending the sequence to
  each of them. [inference] Counted, **sixteen of the eighteen distinct state writes across the
  specimens have exactly one writer**, so the appending costs one copy and the trigger buys
  nothing. [verified] — `crates/reachability/tests/threshold.rs`.

  The two that do not are `set ashore` and `clear ashore` in `lock.game`, at three sites each —
  and `ashore` is the flag that records which character the player is driving rather than anything
  about the world ([control-transfer](../../decisions/control-transfer.yml)). It has six writers
  and no sequence to append to them: the three sets and the three clears are the same switch from
  two sides, and what an author wants at each is the sentence, which they wrote. The verdict is
  unchanged and its reason is narrower than *every value has one door*. The census read twelve
  writes and no repeats until `.yidam/decisions/unread-specimen.yml`.

  With several writers it would cost a copy each, which is
  [arrival-trigger](../../decisions/arrival-trigger.yml)'s shape reaching the other kind of trigger.
  No game here pays it, and in the shipped game the six multiply-written values that can be
  identified include none that starts a scene ([delores-source](../../catalog/delores-source.md)).
  [verified] `.yidam/decisions/threshold-trigger.yml`.

  **And a phase later the class turns out to have no way in at all.** Nothing in this ontology
  points at `cutscene` — which the description above noted at genesis as "a structural hint that
  it may not be a primitive" and then never followed. `effect-list-semantics` followed it, because
  a decision that effects are instantaneous has to say where duration lives, and the answer was a
  class no binding can reach. See `trigger` below.
  **Assessed against a specimen, and the class does not survive on any ground it was seeded
  on.** `design/specimen/nightwatch.game` is four rooms written to want a sequence twice, in two
  shapes, so that the reduction could be argued rather than agreed to.

  *"A response that is long"* is not a claim about the vocabulary. The specimen's picked lock —
  wire past the wafers, the lock turning over, the lid rising on its own weight — is **one binding
  with one effect**. Everything that makes it a scene is in the response text, and response text
  is presentation: [effect-list-semantics](../../decisions/effect-list-semantics.yml) puts it
  outside the state model. [inference]

  *"Input is locked"* is vacuous under the same decision. An atomic binding never yields control,
  so there is nothing to lock.

  *`skippable`* is not answered so much as **eliminated**, and that distinction is worth keeping.
  This property names a real failure — a sequence cut short part-way leaves a configuration the
  author never wrote — and atomicity means there is no part-way. That is defining the problem
  away, and it is legitimate only because the design paid for it explicitly, refusing AGS's
  per-command blocking flag. Under a design that admitted duration, this property would
  distinguish the class. Under this one it cannot. [inference]

  *`control_return`* reduces to `occupies`: a binding that never took control has none to return,
  and the room it leaves the player in is a `move`.

  *`plays-in`* reduces: a binding is already sited in a room.

  **What does not reduce is the trigger, and the trigger is not this class's.** The specimen's
  watchman intercepts the player for *arriving*, and no binding can say that — an `interaction`
  site is a room and a target plus a verb, and there is no verb for having got somewhere. That is
  the same missing primitive [walk-to](../verb/walk-to.yml) found for exits two phases ago, and
  two classes wanting one thing is evidence about the thing rather than about either class.
  [inference]

  **The condition has since been met.** `on-enter` exists — a binding sited at arriving in a
  room, forced rather than offered — and `interaction` was widened to carry it rather than a new
  class being added, precisely so that this reduction would hold
  ([arrival-trigger](../../decisions/arrival-trigger.yml),
  [interaction/entry-binding](../interaction/entry-binding.yml)). The specimen's sequence is one
  binding at that site now, and it reports the same 14 reachable states and 31 transitions it
  did as four bindings. [inference]

  **So the verdict is a collapse into `interaction`, and the condition it was hedged on is
  discharged** — and the class is kept, unwithdrawn, for the reason [give-to](../verb/give-to.yml)
  was kept: the argument is worth more than the entry, and a deleted node leaves the next author
  free to propose this from scratch.

  **What the specimen could not reach, which is the honest limit of a reduction argued from one
  small game.** The watchman crosses the hall, takes the ledger and opens the far door, and *all
  of that is prose*. Nothing in that game depends on where he is, so it never tested whether a
  non-player actor's position needs to be state — which is the one thing a real sequence does that
  nothing in this vocabulary does. `actor -occupies-> room` could carry it and the format has no
  syntax for moving anyone but the player. And `trigger`'s threshold case is untested here and
  undocumented in either engine. Neither of those is a property unique to a sequence, which is
  what makes them limits on the specimen rather than defences of the class.

  **Both are now closed and neither rescued the class**, which is the paragraph below for the first
  and the paragraph above for the second. This marker outlived its first half by four phases and its
  second by one; `.yidam/decisions/stale-markers.yml` is the record of why that keeps happening.

  **The first of the two is confirmed, from a direction nothing here was looking in.** A phase
  measuring *presentation* found it: Delores writes `actorAt(lenore, Bank, bankTellerSpot)` in
  room-entry code to put a non-player actor somewhere, and `actorAt(x, Void, point(0,0))` — a room
  named `Void` — to take one out of the world entirely
  ([delores-source](../../catalog/delores-source.md)). [verified] It is read back by
  `isActorInRoom`, so it is state and not staging. That is exactly the sentence above: `actor
  -occupies-> room`, carrying a non-player actor's position, which this format has no syntax for.

  Two things follow and neither rescues the class. It is **not a property unique to a sequence**
  — most of those writes are room entry, not scenes — so the reduction holds and this is a gap in
  the effect vocabulary that a sequence would have exercised first. And it is **not a new
  relationship**: `.yidam/decisions/effect-half.yml` establishes that an effect is a relationship
  an interaction can author, `occupies` is declared and authored by
  [non-player-character](../actor/non-player-character.yml), and what is missing is an argument
  place on `move`. [inference]

  The prediction being right is the useful part. This node reasoned from one small specimen to
  what a real sequence would need, said so, and marked it open; four phases later a game that
  does it was read and it does exactly that.

  **And it is built.** `move <actor> to <room>` and `<actor> in <room>` exist
  (`.yidam/decisions/actor-position.yml`), a fourth specimen exercises them, and the cost is
  what was predicted and bounded the way it was predicted: rooms^*n* for the *n* actors a game
  moves, and nothing for the actors it does not — which is every actor in this specimen.
  [verified] — `design/specimen/patrol.game`, 20 reachable states, and
  `crates/reachability/tests/patrol.rs` holds the cost claim from both sides.

  **So the limit this node named is closed and the verdict is unchanged, which is the point.**
  The primitive turned out not to be a property of a sequence at all: most of the writes in the
  game that motivated it are room-entry code putting people where the story has left them, not
  scenes. A gap in the effect vocabulary that a sequence would merely have exercised first is not
  an argument for a class.

  **Nothing here is open any more.** Three triggers, all accounted for; both limits the specimen
  could not reach, closed; every property reduced. This node is a finished negative result, and it
  is kept for the reason it was kept before — the argument is worth more than the entry — rather
  than because anything about it is unresolved. `.yidam/decisions/threshold-trigger.yml`.

  **One contrast is worth carrying, because it arrived from the class next door.**
  [conversation](../conversation.ont.yml) declares `returns-control-to` and so does this one, and
  the note under that edge says both are *"modes that seize control and give it back"*. Run the same
  reduction on each and they come apart: a conversation survives because its mode sits **beside** the
  room and carries the return, and this class has no mode at all, because
  [effect-list-semantics](../../decisions/effect-list-semantics.yml) made a response instantaneous.
  [inference] A sequence that never takes control has none to give back, so the edge this class
  declares is inert in this vocabulary while the identical edge one class over is load-bearing.
  `.yidam/decisions/conversation-reduction.yml`.

  **Nothing points at this node and nothing can.** `cutscene` is the only class in this ontology
  with no incoming relationship at all — it was seeded to point outward — and the reduction argued
  above is why that never mattered: the class collapses into `interaction`, is kept for the
  argument rather than the entry, and an edge into it would be an edge into a finished negative
  result. `yidam lint` does not report this node, which is a gap in the lint rather than a
  difference in the node; `crates/design-gate/tests/orphans.rs` computes the condition itself.
  [inference]

properties:
  trigger: |
    Entering a room, a flag reaching a value, or the resolution of a binding.

    **The claim that binding resolution has a home is false, and this node has made it twice.**
    No relationship anywhere in this ontology targets `cutscene` — fifteen classes, and the only
    edge into this one is the `instance-of` below. A binding cannot start a sequence, so the
    trigger this node has twice called the settled case is the one with no vocabulary at all.
    Found by [`effect-list-semantics`](../../decisions/effect-list-semantics.yml), which needed
    somewhere to put duration and discovered the place was unreachable.

    Entering a room does have a home, and that is the part that survives: it is a position event,
    documented as first-class in AGS and dispatched outside the verb table entirely. [verified]

    So the count was one of three, not two. What was left unhoused was the threshold — a flag
    reaching a value — and binding resolution, which would need `interaction -enters-> cutscene`,
    the mirror of `interaction -opens-> conversation`.

    **Both are settled and neither wants an edge.** The threshold has no occasion in a design
    without duration, and reduces to appending the sequence to the bindings that write the value;
    see the description above. Binding resolution needs no edge either, and the reason is the
    collapse this node already made: a conversation is a separate authored structure with its own
    site, so `opens` has something to point at, and a sequence **is** the effects and the prose of
    the binding that runs it. [inference] There is nothing on the far end of `enters`.

    **And a shipped game agrees about the trigger, unanimously.** Thirteen `cutscene(` call sites,
    ten directly inside a verb body and three in scripts a player action starts; not one begins
    because a value was reached ([delores-source](../../catalog/delores-source.md)). [verified]
    Where a scene and a state write occur together the write is *inside* the scene.

    So all three triggers are accounted for: one is `on-enter`, one is the binding itself, and one
    is a question that a design with no cycles cannot ask.
  skippable: |
    Usually yes, and the skip is where the failure lives. [inference] A sequence that writes
    state part-way through and is cut short leaves the world in a configuration the author
    never wrote, and the correct handling — apply every write immediately on skip — is a rule
    each author reimplements rather than something the vocabulary enforces.

    **An engine that admitted duration made sequences atomic anyway, and paid at a different
    boundary.** Thimbleweed Park cannot save inside a cut-scene: the running threads and the
    animation state cannot be serialized, so the engine silently saves *just before* one, and a
    save during a cut-scene restores the state from before it began
    ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified] From the player's side a
    cut-scene is therefore all-or-nothing, which is the property the reduction above gets by
    refusing duration in the first place.

    The price is visible in the same post and it runs the other way, from implementation into
    design: "we're trying to keep all cut-scenes to less than 10 seconds, so you won't really
    loose much." [verified] A limit on how long a scene may be, chosen because of what a save
    file can hold. This design has no such limit because a response has no length. [inference]
  control_return: |
    To the player character, in a room and at a position the sequence chose. A sequence that
    returns control to a position outside the walkbox set is a stranded actor, and nothing
    checks it.
