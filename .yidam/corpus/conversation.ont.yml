class: conversation
label: Conversation
tier: authoring
foundational_type:
  ontology: ufo
  type: kind
description: |
  An authored structure of choices offered against an actor, entered as a mode and left
  deliberately. Irreducible because leaving returns the player where they were — not because of
  branching, which this class was originally and wrongly founded on, and not because of carried
  availability, which it was secondly and wrongly founded on.

  This description used to say the class carried which of its choices are available, and noted that
  nothing in the edges below writes it — *"the class is founded on state the ontology gives it no
  way to change."* That was the right worry and it had the wrong remedy. **Availability is not
  carried; it is read.** An option's `when` is evaluated when the list is drawn, the closed effect
  vocabulary holds no `disable`, and the one instance in the corpus gates two of its three options
  on ordinary flags. The engine that shipped this form does the same, counting surviving choices
  mid-render with `yackChoices()` ([delores-source](../catalog/delores-source.md)). The claim is
  carried, tagged and counted by [conversation/topic-list.yml](conversation/topic-list.yml).

  **What is left after that is the return, and it is enough.** A conversation rewritten as an
  ordinary room analyses identically — same states, transitions, strandings, winnability — with
  options as hotspots, `enter` as `move` and `chosen` as a latched flag. What the rewrite cannot do
  is `leave`, which names no room because it does not need to: the mode sits *beside* the room
  rather than replacing it. Give an exchange two entrances and the room form needs an exit per
  entrance, and they are not copies of one intent but a hole — nothing keys an exit to the door you
  came in by. `.yidam/decisions/conversation-reduction.yml`.
properties:
  - name: structure
    type: string
    description: How choices are organized — flat persistent list, branching tree, or single-shot.
  - name: exhaustion
    type: text
    prose: true
    description: What happens to a choice once taken, and how the exchange ends.
  - name: state_scope
    type: string
    description: Whether progress within the exchange is local to it or written to world state.
edges:
  - relationship: held-with
    target: actor
    direction: out
    description: The actor this structure is offered against.
  - relationship: sets
    target: world-flag
    direction: out
    description: World state a choice in this structure writes.
  - relationship: returns-control-to
    target: actor
    direction: out
    description: >-
      The actor control is handed back to when the exchange ends. The same relationship
      `cutscene` declares, and for the same reason: both are modes that seize control and
      give it back, which is a structure this ontology had encoded once and not seen.
