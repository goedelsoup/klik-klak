class: conversation
label: Conversation
foundational_type:
  ontology: ufo
  type: kind
description: |
  An authored structure of choices offered against an actor, entered as a mode and left
  deliberately, carrying which of its choices are currently available. Irreducible because
  of that carried availability and that modality — not because of branching, which is an
  optional elaboration this class was originally and wrongly founded on.

  Nothing in the edges below writes the availability this description rests on — the class is
  founded on state the ontology gives it no way to change. The claim is carried, tagged and
  counted by [conversation/topic-list.yml](conversation/topic-list.yml), because a tag asserted
  in class prose is counted nowhere; this paragraph is the pointer and not the assertion.
properties:
  - name: structure
    type: string
    description: How choices are organized — flat persistent list, branching tree, or single-shot.
  - name: exhaustion
    type: text
    prose: true
    description: What happens to a choice once taken, and how the exchange ends.
  - name: state_scope
    type: string
    description: Whether progress within the exchange is local to it or written to world state.
edges:
  - relationship: held-with
    target: actor
    direction: out
    description: The actor this structure is offered against.
  - relationship: sets
    target: world-flag
    direction: out
    description: World state a choice in this structure writes.
  - relationship: returns-control-to
    target: actor
    direction: out
    description: >-
      The actor control is handed back to when the exchange ends. The same relationship
      `cutscene` declares, and for the same reason: both are modes that seize control and
      give it back, which is a structure this ontology had encoded once and not seen.
