class: failure-mode
label: Unwinnable State
description: |
  A configuration of world state from which no sequence of interactions reaches the ending,
  reached without the player being told. It is the canonical failure of this genre and the
  clearest evidence that a vocabulary permitted something it should not have.

  [inference] It has two ordinary causes and they are different problems. One is consumption:
  an object needed later is spent or destroyed earlier, so the state is unwinnable from the
  moment of the spend. The other is ordering: a gate closes behind the player and something
  still needed is on the far side. The first is a property of a single binding and is
  checkable where the binding is written; the second is a property of the graph of gates and
  is not checkable anywhere in the current vocabulary.

  The reason it is `detectable_at: authoring` despite that is the important part. Both causes
  are decidable from the authored content alone — no play is required — which is precisely
  what makes this the strongest available argument for the engine tier doing work the
  authoring tier cannot. See the `reachability` stub, and note that it has nothing to read.

  **For fifteen commits the first of those two causes could not be written down.** Consumption is
  an object being spent, and no relationship in this corpus said an item leaves the inventory — so
  a specimen built with a consumption trap in it could not express the spending, and the trap was
  invisible to the analysis this node calls decidable ([design/specimen](../../../design/specimen/README.md)).

  **Closed by `interaction -consumes-> inventory-item`**, whose site is
  [consuming-binding](../interaction/consuming-binding.yml), linked below by `arises-from`. That
  connection is what makes the paragraph above true rather than aspirational: a checker can ask
  which bindings spend a given item and get an answer from the graph rather than from prose.

  **[inference] What does not survive is this node's account of which cause is the easy one.** It
  called consumption "a property of a single binding and checkable where the binding is written",
  and that is exactly backwards. A consuming binding is *locally correct* and stays correct —
  `consuming-binding` argues that its success is the mistake — so there is nothing at the site to
  check. The question is what remains reachable afterwards, which is the same computation the
  ordering cause needs. Both causes want reachability; neither is checkable where it is written.
properties:
  mechanism: |
    An author spends a required object, or closes a gate, without a check that the resulting
    state can still reach the ending. Neither act looks like a mistake at the point it is
    written; it becomes one only in combination with something written elsewhere.
  detectable_at: authoring
  player_visible: |
    No, and that is what makes it severe rather than merely annoying. [inference] The player
    continues to be offered interactions, all of which resolve normally, for an arbitrary
    length of time. A game that detects the state and says so has converted a lost session
    into a reload; most did not.
