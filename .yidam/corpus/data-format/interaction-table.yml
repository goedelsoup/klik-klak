class: data-format
label: Interaction Table
description: |
  The written form of the bindings: for each verb, target and optional second object, the
  response, the precondition and the refusal. It is where this corpus's central question
  becomes a concrete file, and where the combinatorics stop being an observation and start
  being a problem somebody has to type.

  [inference] The design pressure is entirely toward sparseness. A dense table is
  unwritable, so the format must express "everything not listed falls through" — and the
  moment it does, three distinctions collapse into one another: a binding never authored, a
  binding authored as empty, and a binding authored to refuse.

  **"The moment it does" is the whole of the condition, and it is an interface choice rather than a
  format one.** A table only has to express fall-through if every cell is reachable, which is what a
  fixed verb bar makes true. Delores builds its verb menu from each object's own verb slots and
  removes any verb whose precondition fails, so only authored cells are reachable, nothing falls
  through, and there is no default binding in the engine at all
  ([delores-source](../../catalog/delores-source.md)). [verified] The three distinctions do not
  collapse there; the first is unreachable, the second is silent, and the third is not a category.

  So the format is not where the distinction is lost. It makes all three. This corpus's own checker
  already enumerates authored bindings and offers nothing else — so it has assumed the contextual
  branch for as long as it has existed, while this node reasoned from the other.
  `.yidam/decisions/default-binding.yml`.
properties:
  syntax: |
    Text, keyed by verb and target, with the second object as an optional third key. The third
    key is used by about one binding in eight — 26 of Delores's 203 and 11 of these specimens' 87,
    which is 12.8% and 12.6% arrived at independently.
    Hand-editable, because the alternative is a tool and a tool for a sparse table is a
    spreadsheet nobody wants to diff.

    **Every clause of that describes a shipped format**, which this node did not know when it
    was written. Thimbleweed Park's bindings are text, keyed by verb and target, hand-edited,
    and sparse by the only mechanism a nested table has: a verb slot nobody wrote is a field
    that is not there ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified] Wimpy, the
    tool, edits the *geometry* file and never this one — which is the split this format assumes
    and the reason the "tool for a sparse table" problem does not arise there.

    **And it charges a price for keying bindings in the same namespace as declarations.** The
    slots were `lookAt` and `walkTo` in February 2015 and `verbLookAt` and `verbWalkTo` by
    January 2016. [verified] The prefix is there because `name`, `initState`, `flags`,
    `look_count` and `verbUse` are all fields of one table, and nothing but a naming convention
    keeps an author's variable from colliding with a verb. [inference] A format that keys
    bindings separately from declarations never needs the prefix, and this is the first concrete
    cost this corpus has of not doing so.
  authored_by: |
    A person, directly. This is the file that carries the writing, and it should read like
    writing rather than like data — which is a constraint on the syntax that pulls against
    the keying above. [open] Nothing here resolves it, and one thing now tries.

    A specimen authored in the proposed language resolves it by splitting the two rather than
    reconciling them: declarations are keyed like data, bindings are written as blocks, and the
    construct carrying the join is the guarded response list — `when <predicate> "<line>"`, which
    keys and reads like writing on the same line
    ([design/specimen](../../../design/specimen/README.md)). [inference] Whether that survives a
    table with real combinatorics is untested; twenty-three bindings is not a test of scale.

    **A real one has been counted and it is emptier than expected, which cuts the other way.**
    Delores holds 164 object declarations of which **46 carry no binding at all** and 82 carry
    exactly one; beside them sit 290 bare props with neither a name nor a behaviour, and 110 of
    the 203 bindings — 54% — are a single verb, `lookat`
    ([delores-source](../../catalog/delores-source.md)). [verified] The combinatorial explosion
    this node was seeded to worry about does not appear in a shipped game: the table is not dense
    and nobody tried to fill it. What an author actually types, over and over, is a name and one
    line of description.

    That is 203 bindings rather than 23, and it is still one small game. [inference]
  escape_hatch: |
    This is where one is genuinely expected, and naming it honestly is more useful than
    denying it. [inference] Every prior-art system reached a general-purpose language, and
    whether a bounded expression language avoids that is `[open]` and is the most valuable open
    question in this corpus.

    **The three examples this node gave of what forces the escape were all wrong, and the
    correction is the useful part.** It said a response "that must compute something — count an
    inventory, compare two flags, pick among several lines — is beyond a declarative table". This
    design's predicate layer does all three: `count <item> <cmp> <n>` is the one quantifier,
    `and`/`or`/`not` compose flags, and several lines at one site are several bindings with
    different guards. They were named as the hard cases before anything had been built, and they
    turned out to be the easy ones.

    **What the hard cases are is now measured against a shipped game rather than guessed.**
    Thimbleweed Park's authoring surface *is* this table — a room is a table, an object is a
    table in it, a binding is a field named for the verb — with an arbitrary Squirrel closure in
    every cell ([twp-dev-diary](../../catalog/twp-dev-diary.md)). [verified] Taking every object
    the diary shows as a sample of one game's bindings, the responses that escape are:

    - **a binding calling another binding.** `verbPickUp = function() { verbUse() }` on a
      telephone; `verbPickup` falling through to `verbLookAt` on an empty stack of flyers.
      [verified] Written here as *on the same object*, from two examples that were, and that
      reading did not survive a count — see below.
    - **a response that outlives the click.** `startthread(playRadio, this)`. That one is
      refused on purpose — see `.yidam/decisions/effect-list-semantics.yml` — and the refusal has
      a price this corpus can now quote from the other side of it.
    - **abstraction over repeated authoring.** 110 hotel rooms built by a `for` loop over
      `definePseudoRoom`; a `sewerValveSetup(this)` helper written by a second author, in a
      separate file, because "I didn't want to do more copy-paste". [verified]
    - room state rebuilt from global state on entry, and randomised initial state.

    **The third is the finding.** Two of the diary's authors reached for the escape hatch
    independently and neither did it to compute anything — both did it because the same content
    had to be written many times. Nothing in `definePseudoRoom` or `sewerValveSetup` needs an
    expression a bounded layer lacks; they need a *name for a shape*. [inference]

    That re-aims the open question. This corpus has been asking whether a bounded expression
    language is expressive enough, and the one system built by the people who invented the form
    says the pressure that broke the declarative form first was **duplication, not
    expressiveness**. `authored_by` already records scale as the untested axis — "twenty-three
    bindings is not a test of scale" — and the same pressure appeared one scale down in
    `.yidam/decisions/arrival-trigger.yml`, where four bindings carried one intent and one copy
    drifted without anything noticing. `[open]`, and now about the right thing.

    **Two more instances since, and the second is this corpus's own.** Eleven of twenty delegation
    sites are one object drawn as several regions; and `crates/reachability/tests/scaling.rs`
    writes its games with three Rust `for` loops — 6,315 generated lines against 664 authored —
    because a corridor of sixty-four rooms cannot be written by hand here. [verified] Five
    instances across two games, and this corpus had recorded four of them in somebody else's before
    noticing the fifth in its own.

    **The word covers two pressures.** *Generation* is one shape with many parameterised instances
    — the hotel rooms, the sewer valves, the presentation composites, the generators — and it has a
    shipped declarative answer in `door_verbs = YES`, recorded below. *Identity* is several regions
    that are one thing, and it has no answer anywhere: Delores wrote delegation.
    [`duplication`](../../decisions/duplication.yml) is the record, and the rule this corpus judges
    primitives by turned out to need a second question rather than a second clause. [inference]

    **A second data point on why nobody builds the middle, and it is weaker than it looks.** AGS
    built a declarative interaction layer and deleted it; Thimbleweed Park never built one. But
    the diary shows no consideration and rejection — Gilbert weighs three general-purpose
    options, costs writing his own *scripting language* at about a month, and the alternative
    this corpus is testing does not appear. [inference] from silence. Two systems declining to
    hold a layer is not two verdicts on it.

    ---

    **Counted, on a whole shipped game, and the sample was honest.** *Delores* is 203 live
    bindings across 21 rooms ([delores-source](../../catalog/delores-source.md)). **155 of them —
    76.4% — contain no loop, no thread, no blocking call and no delegation**, and the 28
    functions those 155 call between them are `sayLine` and `SAY` and a short tail: `objectState`
    9, `exitRoomFromDoor` 8, `pickupObject` 7, `inInventory` 4, `removeInventory` 3. [verified]
    The escapes are the ones the blog's sample named, in the same order: 34 bindings (16.7%)
    block or take time, **18 (8.9%) call another verb slot on the same object**, 12 start a
    thread, 7 loop.

    So delegation is not an oddity of two examples. It is one binding in eleven — and that is
    the whole of what the count established, which took three phases to notice.

    **The 18 were then read rather than counted, and they are seven different things.** 34
    `verb_<x>(` call sites, 20 inside an authored binding, sitting in those 18. **Six delegate to
    the object the binding is on**; twelve name a different object and two of those name one in
    another room. [verified] So "on the same object" was wrong, "the cheapest thing on this list"
    was a guess about a shape nobody had looked at, and the same-object share is 3.0% of 203 rather
    than 8.9%.

    **Six of the seven shapes go into this design as written**, transcribed from the real bindings
    and committed as `crates/reachability/tests/delegation.rs` — 36 states, winnable, resolving
    clean. [verified] The seventh is a response reusing a named sequence that lives in a verb slot
    because a verb slot is the only place that engine has to keep one, and it is *a name for a
    shape* again: the fourth appearance, after `definePseudoRoom`, `sewerValveSetup` and the 21
    presentation composites. A way to call one binding from another would answer the fourth
    instance and none of the first three. [inference] `.yidam/decisions/delegation.yml` is the
    record and the verdict is no primitive.

    **And eleven of the twenty sites were never a `verb` question.** They are about which object
    the player is addressing — a part and its whole, two regions of one thing, distinct things that
    read alike, a thing that reads as another while a flag holds. That is
    [static-region](../hotspot/static-region.yml)'s third absence, and it was found by counting
    something else. [inference]

    **The duplication finding has an answer in the vocabulary, and it is not a macro.**
    `door_verbs = YES` and `on_off_verbs = YES` are **named archetypes**: a boolean on an object
    from which the engine synthesises a whole set of preconditions and responses — for a door, a
    `state`-gated open, close and go-through; for a switch, a turn-on, a turn-off, and a rule for
    which the object offers by default. [verified] That is *a name for a shape*, which is what
    the escape hatch was being used for, moved into the declaration.

    **And the split it forced is the useful part.** Those archetypes are why that vocabulary has
    `okverb_<verb>` — a precondition declared apart from its response, this design's `when`. Every
    use in the game is engine-supplied inside an archetype; **every precondition the game's
    authors wrote by hand is an `if` inside a response.** [verified] A separated precondition is
    what you need when the vocabulary *generates* bindings, not when a person writes one.
    [inference] The person reaches for `if`, because the refusal and the response are one thought.

    **The most valuable open question splits in two, and one half is answered.** Yack — the same
    authors' conversation language, in the same repository — has a guard layer of 79 real
    expressions and **not one of them escapes**, while 46 brace blocks carry effects and escape
    freely ([dialogue-script](../data-format/dialogue-script.yml)). [verified] The boundary a
    shipped bounded language actually found is not between hard responses and easy ones. It is
    between **asking and doing**: the predicate layer held, the effect layer did not.

    That is what this node should have been asking. The question that survived was whether the
    *effect* half can be bounded too.

    **It can, it already was, and the bound is the ontology.** Every authored behaviour in that
    game was extracted and every call site in it classified — 1,328 sites, 107 functions, across
    203 bindings, 22 triggers, 40 room enter and exit bodies and 49 Yack effect blocks
    (`.yidam/decisions/effect-half.yml`). **The part that changes the world is 7.3% of it and it
    is ten functions**, and 120 of its 125 write sites map onto the eight effects this design
    already has. [verified] The four that do not turn a *trigger* on or off, which is
    [walk-to](../verb/walk-to.yml)'s residue and not an effect gap.

    And the bound was never chosen. Each variant of the effect enum in `crates/game-format`
    carries a comment naming the relationship it realises — eight variants over six
    relationships. **An effect is a relationship an interaction can author**, so the list is
    closed exactly when the ontology is, and it grows only by an argument this corpus already
    knows how to have. [inference] That is the same shape as the answer on the ask half, and it
    had been sitting in the code as eight comments nobody had read together.

    **So the escape hatch this property is named for is not needed for effects, and the reason it
    looks needed is a category error.** In a real game a response body is one list in which
    `sayLine`, `playAnimation`, `breaktime` and `pickupObject` sit side by side, indistinguishable
    — so anyone reading one concludes that effects require a general-purpose language. They are
    right about the body and wrong about the effects. [inference]

    **What actually needs the escape is the other two-thirds, and it is not state.** 884 of the
    1,328 sites are response text, sound, animation, camera and lighting, across 53 distinct
    functions most of which are used once — a neon sign flickering, an actor's eyes following
    something, a star twinkling. A further 168 are duration, which
    [effect-list-semantics](../../decisions/effect-list-semantics.yml) refuses on purpose.
    [verified]

    That was the honest statement of what this format is: **a table that can express what a game
    means and not what it shows.** It stood for one phase.

    **A binding shows three things, and the count is measured.** Split by where a call is written
    rather than by what it does, the presentation in a *binding* is say 538 sites, sound 77,
    animation 25, actor pose 46, and then nothing worth a row. **Camera and walkbox appear in a
    binding exactly zero times**; object offset and lighting are 44 of 52 in room-entry code.
    Say, sound and animation are **640 of 695 — 92.1%** (`.yidam/decisions/presentation-layer.yml`).
    [verified]

    **And the tail that made it look unbounded is 40% functions the game's own authors wrote.**
    Of the 53 names, 25 are engine primitives and 21 are composites Delores defines for itself —
    `twinkleStar`, `flickerNeonLight`, `flashBulletHole`. [verified] The same *name for a shape*
    that this property already records as what repetition drives authors to, appearing a third
    time and in the one place this corpus had concluded nothing could be closed.

    So this format needs a presentation layer of three verbs and has one of them, and what it
    cannot show is a **scene** rather than a response — which is entered rather than triggered,
    and has a site of its own in [entry-binding](../interaction/entry-binding.yml). Neither `play`
    nor `animate` is adopted: they would cost nothing, because presentation is outside the state
    model, and nothing authored here has yet been unable to say what it meant without them.

    **One construct worth taking whole.** `ONCE(...)` wraps a line and expands to
    `_once(__LOC__, ...)` — once-only keyed by the **source location** of the line itself.
    [verified] 22 uses in the bindings and 47 more in the conversations. It is the primitive AGS
    carried as a flag on an action and that this corpus derived for acquisition sources, and its
    form here costs the author nothing: no flag to name, no state to declare, no way to get the
    bookkeeping wrong. Whether a checker can see through it is a different question and this
    corpus would need to answer it. [inference]

    **One system ran an experiment adjacent to this, and its result was misread here for two
    phases.** Adventure Game Studio built a bounded sub-language at exactly this scope — eight
    dialog-script commands, `goto-dialog`,
    `goto-previous`, `option-on`, `option-off`, `option-off-forever`, `run-script`, `return`,
    `stop` — and its own manual records that it was not enough: "Often the provided dialog
    scripting commands won't be enough... AGS now lets you put normal scripting commands in your
    dialog script, by indenting the line with spaces or tabs."
    ([ags-manual](../../catalog/ags-manual.md)) [verified]

    That is an admission by the system's authors rather than an inference by this corpus. **What
    it is not is evidence about a bounded expression language**, and this node claimed for two
    phases that it was — "a bounded expression language was tried, in the narrowest domain anyone
    would try it in... and it still needed a door to a general-purpose language." That sentence
    is withdrawn.

    `DialogScript.md` was re-read in full and settles what the eight commands are.
    **None of them reads anything.** ([ags-manual](../../catalog/ags-manual.md)) [verified] Four
    move control, three write option state, one is the escape; there is no comparison, no flag
    reference, no count and no conditional in the set. So AGS built a bounded *command list*, and
    it fails at the first case that needs to ask a question rather than at a hard one. `run-script
    X` — which does not run script in place but "calls dialog_request event handler... passes X as
    an integer parameter" [verified] — is one of the eight. The escape was a primitive of the
    sub-language from the start.

    That the sub-language contains no conditional anywhere is `[inference]` rather than
    `[verified]`: the page introduces these as the commands "available" and never claims the list
    is complete.

    The escape mechanism is worth recording precisely, because it is a design this corpus should
    either adopt or reject deliberately: **indentation switches languages.** An indented line is
    ordinary AGS script. There is no delimiter, no fence, no declaration — the boundary between
    the declarative vocabulary and the general-purpose one is whitespace. The manual says it
    twice, the second time as a warning attached to the commands themselves: "Do NOT indent these
    lines with spaces or tabs. Indented lines signify that AGS should interpret the line as a
    normal scripting command." [verified] An author who indents by accident has silently changed
    which language the line is written in.

    The correction above is to *why* the dialog script is not a counter-example: it sits inside a
    system that already had a general-purpose language, so a predicate layer would have duplicated
    something one indent away, and the missing conditional is consistent with a deliberate
    judgement that the escape hatch **is** the conditional. [inference] That still holds.

    **What was concluded from it does not. This node said "nobody has tried the middle" and the
    same system had tried it, at exactly this scope, for years.**

    AGS shipped an **Interaction Editor** through version 2.72 and removed it: "The Interaction
    Editor has been removed from AGS 3.0. When you import your game, AGS will attempt to convert
    all your interactions into scripts." ([ags-manual](../../catalog/ags-manual.md)) [verified]
    Not the dialog scope — hotspots, objects, characters and rooms, which is what this node is
    about. Its vestiges are still documented: `GetGraphicalVariable` reads "the values of variables
    set in the interaction editor", and Global Messages are obsolete because "there's really no
    need for them now that the interaction editor has gone." [verified]

    What it was, from the archived 2.72 manual and therefore `[inference]`
    ([ags-272-manual](../../catalog/ags-272-manual.md)): an event list per entity; each event bound
    to an **ordered list** of commands, added one at a time and shown as a tree; each command drawn
    from a closed combobox and carrying typed parameters; the default a value rather than an
    absence — "Do nothing". And **the list contained a predicate**: `Conditional - if inventory
    item was used`.

    **That is not the middle, and it is much closer to it than anything else this corpus holds.**
    A predicate that is a *command in a list* is not an expression language: nothing shows two
    conditions combined, negated, or grouped. So the artifact sits between AGS's dialog script,
    which has no predicate at all, and a bounded expression language, which has composition.

    **The combobox is enumerated now, and not from a manual.** The code that converts 2.x games
    to 3.0 still ships in the AGS editor, so the definition of the layer 3.0 deleted is in the
    repository ([ags-source](../../catalog/ags-source.md)). `NUM_ACTION_TYPES` is **48**.
    [verified] Each action declares a name, an argument count, argument types drawn from
    `ARG_TYPE_INT`, `_INV`, `_MSG`, `_CHAR`, `_BOOL`, `_VARONLY`, and flags — one of which,
    `AFLG_COND`, marks it a predicate. Seven carry it:

    | # | Conditional |
    |---|---|
    | 20 | If inventory item was used |
    | 21 | If the player has an inventory item |
    | 22 | If a character is moving |
    | 23 | If a variable is set to a certain value |
    | 45 | If the player character is |
    | 46 | If mouse cursor mode is |
    | 47 | If the player has been in room |

    They **nest**: an `InteractionCommand` carries `Children`, a sub-list, and the converter emits
    the command, then the child list, then a closing brace — a conditional guards the block under
    it. So the artifact is a tree of guarded command lists, bounded at 30 events per entity, 40
    commands per list, 5 arguments per command. [verified] Arguments are literal *or variable*.

    **What it does not have is exactly what this corpus's design proposes, item for item.** No
    `or` — nesting yields conjunction only. No `not`. No grouping. No comparison operators:
    "If a variable is set to a certain value" takes a variable and an integer and tests equality,
    and there is no other test over a variable in the table. No arithmetic — `Game - Set variable
    value` assigns and nothing increments. Nothing counts an inventory. [verified]

    That is the measurement this node had been asserting. **The gap is real and it is exactly one
    thing: composition.** Predicates over world state are not what AGS lacked; combining them is.

    Two further things the table says, neither of which was being looked for. **The escape is
    action number 1** — `Run script`, second in a forty-eight-entry table after `Do nothing`,
    present from the beginning and near the top of an alphabetical list. It was never a last
    resort bolted on. And **once-only was a property of an action**: `Add score on first
    execution` converts to `if (Game.DoOnceOnly(...))`, which is the same rule this corpus derived
    for acquisition sources from `carried-form-of`, appearing here as a flag on a command.

    **The open question survives and it costs more than it did.** "Untested" is withdrawn.
    Something substantially in this region shipped for years at this exact scope and was
    withdrawn by the people who built it, and this node was two documents away from knowing that
    while calling the question its most valuable. What is still genuinely open is *why*: the
    manual reasons about migration hazards and never about the decision, and AGS 3.0 was a
    complete editor rewrite, so removal is as consistent with a rewrite's scope as with a verdict
    on declarative authoring. [inference] The AGS forums and the 3.0 development discussion would
    settle it; nobody here has read them. `[open]`

    **What the manual does say about the difference is not expressiveness — it is time.** Two
    behaviours changed, both named: interactions without scripting could previously run alongside
    a blocking script and "now, that is no longer the case"; and a `Run Dialog` action "waits until
    the dialog has finished before moving onto the next action", where the script equivalent "does
    not block". [verified] That is a property of the declarative form, stated by its own authors,
    and it is the axis this corpus's proposed language has never been asked about.

    **And the table shows how that layer answered it, which is more useful than the migration
    note.** Not "blocking by default" — blocking is a *typed argument on the commands that take
    time*. `Object - Move object` and `Character - Move character` each end in a `BOOL` the editor
    labelled "Wait for move to finish"; `Character - Run animation loop` blocks unconditionally;
    `Game - Pause command processor for a set time` is an explicit wait; and `Stop running more
    commands` is an early exit from the list. [verified] So the action list was sequential, and
    duration was declared per command by an author rather than inferred.

    One more thing visible only in the converter: where an event's list is entirely inventory
    checks, it appends `else { unhandled_event(<type>, 3); }`. [verified] The editor had an
    **implicit default refusal**, which `interaction/default-binding` treats as a design choice
    and which this system made silently.

    One smaller thing, for the collapse named at the top of this node. The 2.72 action editor's
    box "currently says 'Do nothing'" at the same moment the tutorial says "nothing is set to
    happen in response to any of the events" [inference] — so that system represented *never
    authored* and *authored to do nothing* with one value. `interaction/unary-binding` names that
    collapse as `[open]`; here is one system that made the choice, and made it in the direction
    that loses the distinction. It is also a system with a fixed verb bar, which is what obliges it
    to make the choice at all. [inference]

    A proposal for it is in
    [design/bounded-expression-language.md](../../../design/bounded-expression-language.md),
    which is outside the corpus because a design is not a documentary claim. This node records
    that it exists and does not adopt it.
