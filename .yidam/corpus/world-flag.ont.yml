class: world-flag
label: World Flag
tier: authoring
foundational_type:
  ontology: ufo
  type: mode
description: |
  A unit of persistent state that interactions write and preconditions read. Typed as a
  mode because it has no existence apart from the game world it inheres in, and it is
  irreducible because it is the only thing that carries meaning across rooms: without it
  nothing an author writes in one room can be visible from another.

  **"Write and read" is a conjunction and the format admits half of it.** A flag every binding
  writes and no predicate reads is declarable, and until this was checked it occupied a bit in the
  checker's state vector — splitting reachable states that nothing in the game could tell apart,
  in the direction that makes the report look better. The mode has no existence apart from the
  world it inheres in, and a value nothing can observe does not inhere in anything. The claim and
  its tag are carried by [world-flag/boolean-flag](world-flag/boolean-flag.yml), because a tag
  asserted in class prose is counted nowhere; this paragraph is the pointer.
  `.yidam/decisions/unread-state.yml`.
properties:
  - name: domain
    type: string
    description: The values the flag can take — boolean, counter, enumeration, or set.
  - name: scope
    type: string
    description: >-
      Whether the flag is global, room-local, local to a conversation, or local to an object.
      The last was added when a shipped game turned out to keep most of its state there;
      [world-flag/object-state](world-flag/object-state.yml) is the instance and carries the
      evidence.
  - name: reversible
    type: string
    description: >-
      Whether anything can put this flag back. `puzzle/state-gate` asked for this by name — a
      gate over a counter that only increments is irreversible and a gate over clearable
      booleans is not, and until now nothing made the difference declarable.

      Its default of `no` was a guess and has been measured: 32 of the 41 boolean state slots a
      shipped game writes in play move one way, and of the nine that come back, seven need
      machinery — a change callback, a span, an actor's own thread — that this design refused for
      unrelated reasons. So the default is right here for a stronger reason than it is right
      anywhere: the only thing that writes state in this vocabulary is something the player did.
      [world-flag/latched-flag](world-flag/latched-flag.yml) carries the figures and
      `.yidam/decisions/latch-default.yml` carries what follows, including why the format's
      keyword is the opposite polarity to this property's default and should stay that way.
  - name: save_semantics
    type: text
    prose: true
    description: Whether the flag is written to a save file, and what a save that omits it would lose.
edge_policy: exhaustive
edges:
  - relationship: gates
    target: puzzle
    direction: out
    description: The progression this flag's value holds closed or opens.
