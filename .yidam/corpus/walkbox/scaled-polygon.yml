class: walkbox
label: Scaled Polygon
description: |
  A convex polygon of floor with a scale factor at its near and far edges, interpolated
  across it. An actor standing inside is drawn at the interpolated size, which is how a
  two-dimensional scene sells depth without any three-dimensional model of the space.

  What makes it worth a class rather than a property of the room is that it is authored
  against the *floor* and not against the picture. [inference] The background says where the
  wall appears to be; the polygon says where the actor may stand; and nothing checks that
  the two agree. That gap is the ordinary source of an actor walking through scenery, and
  it is not a bug in either artifact — it is the cost of separating them, which is the same
  cost that makes the separation worth having.

  **Eighty-four real ones have now been read, and this class is wrong about the half it is named
  for.** *Delores* carries 84 walkbox polygons across 15 of its 22 rooms, and **a walkbox there
  carries a polygon and, in fourteen cases, a name. Those are the only two keys that ever appear
  on one** ([delores-source](../../catalog/delores-source.md)). [verified] There is no scale on a
  walkbox, and no near edge and far edge to put one on.

  **The scale is a property of the room, not of the region.** It is a room-level `scaling` list of
  `"<factor>@<y>"` breakpoints — `["0.90@54", "0.80@93"]` — present in 12 of the 22 rooms, and it
  is a piecewise function of the actor's y coordinate anywhere in the room. [verified] An actor
  crossing from one polygon to another does not change how it is scaled; an actor walking upstage
  within one polygon does.

  That is a better design than the one this node described, and the reason is the one this node
  already gave for the polygon. The floor is authored separately from the picture because the two
  are different things — and *depth* is a property of the picture, shared by everything standing
  at that height, so putting it on the floor regions would mean re-stating the same curve on each
  of them and keeping them agreeing. [inference] The class was carrying a copy where the room has
  one declaration, which is the pressure `.yidam/decisions/duplication.yml` names, found this time
  in this corpus's own vocabulary rather than in somebody else's game.

  **`geometry: convex-polygon` is refuted too.** Of the 84, **37 are not convex** — tested by
  cross-product sign around the ring, ignoring collinear vertices. Vertex counts run 4 to 118,
  median 5, and half the set is quadrilaterals. [verified] Convexity is a property a path-solver
  might *want*; it is not one the authoring tool enforces or the authors observed.

  **What survives is the separation, which was the actual argument.** A polygon is still authored
  against the floor rather than the picture, and nothing still checks that the two agree. The class
  keeps its place; what it loses is the scale in its name.

  **And the scale can be state-dependent, by a mechanism this corpus has no name for.**
  MainStreet's `scaling` is not one list but five, each keyed by a `trigger` — a named region in
  the same geometry file — so walking into `scalingBank` swaps the whole depth curve. [verified]
  Whether that trigger is a primitive this vocabulary lacks is asked in three other places and
  settled in none; `interaction/entry-binding` holds the nearest form of it.

  **Whether adjacency between regions needs a relationship of its own was this class's page's
  question, moved here because it could finally be counted — and the answer is no.** The page
  refused it for want of instances — *"with one instance seeded there is nothing yet for such an
  edge to join"* — and the 84 settle it, by [found-in](../../decisions/found-in.yml)'s own test.
  [verified] — `crates/design-gate/tests/adjacency.rs` and
  [adjacency](../../decisions/adjacency.yml).

  **The geometry answers exactly.** Of the 290 within-room pairs, **66 share an edge exactly** — the
  same two vertices, consecutive in both rings, opposite winding — and **none meet along a collinear
  segment without sharing one**, so no tolerance is needed and none could have been chosen from the
  data. The walkboxes tile; the editor snaps. A relationship a tool computes without a parameter is
  not one an author should be asked to write.

  **And it does not stay answered, which is the stronger half.** `walkboxHidden` is called at 11
  sites, and the graph is a function of world state. A declared edge would not merely be a copy of
  something derivable — it would be a copy of something that is **not constant**, false in half the
  states of the game by construction. [inference] `found-in` was refused because nothing read it;
  this is refused because everything reads it and no copy could be kept true.

  **What an author writes instead is a region that exists or does not**, which is `passability`
  below — a property of one region rather than a relation between two, declared on this class since
  genesis. `jail_door` is four vertices, shares an edge with exactly two regions, and hiding it
  isolates `jail`: the door is a piece of floor. [verified] So the pairing recorded above — a larger
  non-convex region and a 4-vertex partner — is a room and its doorway, and there are three of them.

  **What the geometry cannot say is intent.** Six of the fifteen rooms are in more than one piece
  with every region present, across gaps of 3 to 16 pixels in rooms 320 to 600 wide, and nothing
  distinguishes a gap meaning *you may not go there* from one left by a mouse that stopped short.
  An authored `adjacent-to` would not have said either: it states that two regions connect, not that
  two were meant not to.

properties:
  geometry: polygon
  scaling: |
    **Not a property of this class.** The one shipped system available to check declares depth on
    the *room*, as a piecewise function of y, and puts nothing on the walkbox at all — see the
    description. What is stated here is what a region needs in order to be one, and a scale is not
    part of it.

    What the room-level form keeps is the deliberate inexactness this property was seeded to
    record: a handful of breakpoints interpolated between, which is wrong for real perspective and
    invisible at the depths a single room spans. [inference] The vocabulary is less expressive than
    the phenomenon on purpose; that judgement was right and was attached to the wrong class.
  passability: |
    Always, unless the region is addressable — and it is addressable exactly when it is named.
    [verified] Of 84 real walkboxes, 14 carry a name and 70 do not, and every one of the eleven
    `walkboxHidden(name, state)` calls in the game names a named one. So conditional passability is
    not a property some regions have and others lack; it is a consequence of the region having an
    identity to refer to, which is the same shape `hotspot` reaches from the other side
    ([static-region](../hotspot/static-region.yml)).

    **This property is where adjacency lives, and the description above is why.** A door in that
    game is a named 4-vertex region bridging two others, and opening it is showing the region. The
    object that owns one carries a hotspot, a flag, a walkbox and a drawn offset, and
    `walkboxHidden` for a single door appears **three times inside it** — in the room's `enter()`
    and in each of the two scripts — with `enter()` re-deriving every tier from the flag.
    [verified] ([delores-source](../../catalog/delores-source.md)) That is one fact stated four
    ways and kept in step by hand, which is [`puzzle/state-gate`](../puzzle/state-gate.yml)'s
    complaint arriving at a tier that node was not written about.

    **And the two scripts cannot be mirror images, because the door takes time.** Closing hides the
    region first and then slides the sprite; opening slides, waits out the duration, and shows the
    region last — the floor must stop being walkable before the door shuts and start being walkable
    only after it has finished opening. [verified] A vocabulary whose effects are instantaneous
    needs one guard where this needs four ordered writes.
    [`effect-list-semantics`](../../decisions/effect-list-semantics.yml).
