id: or-earns-it
summary: >-
  **The one construct that separates this language from the table it was designed against had never
  been written, and writing it found three defects and a wrong conclusion behind all of them.**
  `data-format/interaction-table` calls composition the whole gap; five games wrote `and` twelve
  times and `or` none. A sixth, written to need one, could not use it — the cell check refused a
  disjunction that no state satisfies, the reader lexed `(x` as a name, and the writer distributed
  every predicate into disjunctive normal form. All three rest on the same mistaken reading:
  **`atom := '(' pred ')'` is the fourth production of a four-level grammar and it recurses to the
  top**, and three separate checks read the first three and concluded the reader spells a
  disjunction of conjunctions. Nothing found out for eighty-eight phases because the conclusion was
  only ever tested against predicates authors had written, and no author had written a disjunction.
context: |
  [`data-format/interaction-table`](../corpus/data-format/interaction-table.yml) compares this
  vocabulary with the interaction table it was designed against and lands the difference in one
  word: *"The gap is real and it is exactly one thing: composition."* AGS's Interaction Editor had
  predicates over world state and no way to combine them — no `or`, no grouping, nesting yielding
  conjunction only — while the script it escapes to declares twenty-one operators, nine of them the
  nine this grammar has ([ags-manual](../catalog/ags-manual.md)). [verified] So the disjunction is
  the sharp end of the comparison: it is the operator the declarative layer lacked and the escape
  hatch had.

  **And five games wrote `and` twelve times and `or` not once.** [verified] —
  `crates/game-format/tests/coverage.rs`. [unwritten](unwritten.yml) pinned that and said the
  honest thing: `or` was admitted by argument rather than by demand.
  [control-transfer](control-transfer.yml) found what demands a **conjunction** — a game with two
  characters asks about the world *and* about the pair, and eleven of the twelve are that one game.
  Nothing had found what demands a disjunction.

  Five of the fifty constructs the surface declares had no author at all: `or`, `exit`, `!=`, `<=`
  and `>`.
decision: |
  **Write the sixth specimen to need a disjunction.** `design/specimen/relay.game` — a wireless
  relay hut, one operator, a call to pass on. Two independent ways to get power to the set, and one
  place where the light to work by can come from either of two things that are not the same kind of
  thing: a world flag, or an item in the player's hand.

  That second one is the irreducible case and it is why the game is built around it. `carrying lamp`
  is read off the inventory and **nothing can write it**, so no flag stands for *there is light*:
  a latched flag cannot be cleared when the lamp is spent, and an unlatched one maintained by hand
  at every acquisition site is the drift [delegation](delegation.yml) already found in a shipped
  game. The two disjuncts are different kinds of fact and only a disjunction joins them.

  **And then fix the three things that stopped it being written.**

  - `ambiguous_cells` refused two bindings on one cell whenever either guard held an `or`, because
    the atom flattener returned `false` on the first one it met. It distributes now — a guard
    becomes a disjunction of conjunctions and two guards are disjoint when every way of satisfying
    one contradicts every way of satisfying the other, with a ceiling of 64 clauses. Nothing that
    was accepted moved.
  - The reader split a line on whitespace only, so `(engine-running` lexed as a name and the error
    said *"`(engine-running` is not declared, wanted a flag"* — naming the operand when the fault
    was the spacing. Brackets are tokens of their own now.
  - The writer put every predicate into disjunctive normal form before printing it, on the stated
    grounds that *"the language has no parentheses"*. It prints brackets instead.
rationale: |
  **The whole surface has an author for the first time.** Zero of fifty constructs are unwritten,
  where five were. [verified] — `crates/game-format/tests/coverage.rs`. The other four came off
  cheaply and together: `exit` is a declaration the first five specimens predate and wrote longhand,
  and the three comparisons are one finding — an ordered comparison is distinguishable from `=` only
  when a counter holds values *between* its bounds, and a counter takes values only from a literal
  in an effect, so a staged counter is the whole of the demand. relay's aerial has four values and
  is read at four widths.

  **The thin end did not thicken, and that is the other half of the result.** Fifteen constructs
  were written twice or fewer before this game and fourteen are now. A sixth of the corpus's
  authored lines arrived and the tail lost one member: what a new game does is empty the *zero*
  column, because an author reaches for the same dozen constructs the last five did. The head and
  the tail are a property of the form.

  **The three defects are one defect.** `disj := conj ('or' conj)*`, `conj := unary ('and' unary)*`,
  `unary := 'not' unary | atom` — three levels, each nesting only the one below, and a reader who
  stops there concludes that a disjunction cannot sit under a conjunction. The fourth production is
  `atom := '(' pred ')'` and it is the whole grammar again. [round-trip](round-trip.yml) closed on
  *"the reader cannot build one, because `conj` only ever nests `unary`"*;
  [normal-form](normal-form.yml) made the writer total by normalising, on the same reading;
  `cells.rs` justified refusing disjunctions with *"nothing in the corpus writes one in a colliding
  cell"*. Each is a census over what authors had written, and what authors had written contained no
  disjunction, so each was measuring its own premise. [verified] —
  `crates/game-format/tests/normal_form.rs`.

  **What normalising cost is the thing this format exists to protect.** An author who wrote
  `aerial = 2 and (engine-running or carrying lamp)` got back `aerial = 2 and engine-running or
  aerial = 2 and carrying lamp`: the same formula with the conjunct **restated**. That is the cost
  [named-condition](named-condition.yml) was weighed over and [restated-guard](restated-guard.yml)
  declined a primitive against. The writer was generating the defect, and would have supplied the
  second instance that [restated-guard](restated-guard.yml) named as its own reopening condition.

  **So the condition was tested and it held.** relay is the third game to compose and it restates
  nothing; one condition at more than one site, still `lock.game`'s, still four guards. [verified] —
  `crates/game-format/tests/guards.rs`. And the reason is sharper than the count: **a restatement is
  what an author writes when the language cannot group**, so part of the pressure `named-condition`
  was weighed against was a missing production rather than a missing primitive.

  **The game is the widest of the six and the most stranded, for one reason.** 480 reachable states
  of 1,536 — **31.3%**, where no other specimen reaches a quarter of its declared space — and a
  single consumption trap that kills 28 states where the largest before it killed four. [verified] —
  `crates/reachability/tests/written.rs`, `crates/reachability/tests/walked.rs`. A disjunction is an
  ordering constraint removed, which widens the reachable set; a wider set has more to lose.

  **Two figures moved that were not measuring what they said.**

  - `arity.rs` held the binary-key surcharge at fifteen per cent, twice, and read the repeat as
    evidence that *"the cost is per site and does not depend on which game"* — while its own prose
    named the invariant: every binary site pays eleven or twelve characters. Per game the share runs
    **11% in `lighthouse.game` to 34% in `patrol.game`**, and both of those were among the five. The
    aggregate landed on fifteen twice because of how much frame the big game has. The invariant is
    pinned now and the share is reported as a range.
  - `scaling.rs` gated the generated-to-authored ratio at six times and is named for ten. It was
    9.5 over four games, 7.0 over five and **5.7 over six**. Nothing has been generated since
    [duplication](duplication.yml); every step is a person writing a game. The direction is what
    that record rests on and the direction is what is held.

  **And a test name outran its body.** *no committed specimen writes two bindings into one cell*
  checked only that nothing is reported; five games happened to key every cell distinctly and the
  name recorded the accident. relay hauls a halyard in two stages — two `pick-up` bindings on one
  cell told apart by a counter — and the body stays green while the name goes false.
