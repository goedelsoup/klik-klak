id: inert-reports
summary: >-
  Three of `due`'s four clocks had no interval and its own report could not tell a decision from an
  omission. Two are declined in writing and one declared: the index clock measures a thing no
  released binary can build, the phases clock counts in days a thing that lives minutes, and the
  questions clock counts commits and is about to ring. `doctor` joins the gate, eleven checks late.
  The two declared clocks are in different units and nothing says so until you declare one.
context: |
  `yidam due` has reported the same three lines since genesis — *"no interval declared"* against
  `index`, `questions` and `phases`, closing with *"3 clock(s) have no interval declared and can
  never come due."* There is no `.yidam/config.toml` in this repository at all.

  The report is right and reads as an oversight. **Forty questions are owed and `due` says
  "Nothing is due."** [verified] — `crates/design-gate/tests/reports.rs`.

  Alongside it, two facts of the same shape. `yidam status` has said *"index not initialized"* in
  every line since genesis and `doctor`'s single warning is the same absence — and `yidam
  index-build` refuses: *"needs the `index` feature"*, which the pinned build does not have. And
  `doctor` itself appears exactly once in this repository, in a `mise.toml` comment observing that
  it *"has no check for"* a corpus that failed to fetch.
decision: |
  **Every clock is declared or declined, and the declines go in the config rather than only here.**

  | clock | | why |
  |---|---|---|
  | `index_after` | **declined** | no released binary can build the index it measures |
  | `phases_after` | **declined** | it counts in **days** and a phase here lives minutes |
  | `questions_after` | **declared, 100** | the `inquiry` kuten's proposed value, in **commits** |
  | `catalog.ttl_days` | already per entry | which the kuten records as the primary form, holding all 182 of its observations |

  The declines are written into `.yidam/config.toml` as commented keys with their reasons, because
  `due`'s own line cannot tell a decision from an omission and a reader who hits it goes to the
  config first. That is the same remedy [marker-count](marker-count.yml) chose for a retracted
  question: **make the serialization truthful rather than ask the tool to be cleverer.**

  **`index_after` is declined on the population's evidence, not this repository's.** The prelude's
  `inquiry` kuten already records it: *"Nobody holds one; one corpus declined it in writing,
  because no released binary can build the index the clock measures."* Declining in writing makes
  this the second, and that file pre-registers what a second means — *"three members of this
  cluster holding a key at matched maturity retires the scalar… Two do not — that is a tie, and a
  tie is not a measurement."* A decline is a datum with the same standing as a holding, and it is
  worth writing for that reason alone.

  **`doctor` joins `mise run ci`.** It exits 0 on a warning, so it gates on breakage and reports
  the rest: the provenance pin, the binary the PATH resolves, the age of the vendored prelude,
  whether every REGEN block holds what its generator produces, whether a catalog entry has expired,
  whether the corpus is readable at all. `due`'s own closing line names it — *"`yidam doctor` is
  the report that answers that"* — and nothing here ran it.
rationale: |
  **The two clocks are in different units and nothing says so until you declare one.**

  `questions_after` counts **commits**; `phases_after` counts **days**; `catalog.ttl_days` says its
  unit in its name and is the only one that does. An undeclared clock reports only that it is
  undeclared, and the configuration reference `due` points at does not name the units either, so
  there is exactly one way to learn them: set a value and read what the report prints back.
  [verified] That is this corpus's characteristic defect — a figure under an unstated counting rule
  — arriving in the tool that measures what the corpus owes.

  This record had it wrong in its first draft, in the direction that flatters: it argued that the
  clock was in days and therefore the wrong instrument for a repository whose unit of work is the
  commit. The tool was already counting commits. What was missing was somebody declaring a value
  and reading the line.

  **And the declared clock is close rather than remote.** The oldest open question is
  `actor/player-character` at **86 commits**, so `questions_after: 100` fires within a phase or two
  of whatever touches nothing; seven of the nine are already past 10. [verified] A clock that was
  expected to be decorative turns out to be about to ring.

  **What it covers is a quarter.** `yidam open-questions` walks `.yidam/corpus/` and nothing else,
  so the declared clock is a clock over **9 markers while 31 sit in the decision records** —
  [markers.rs](../../crates/design-gate/tests/markers.rs)'s ratio, arriving on a third tool.
  Declaring the interval does not widen it and this record does not pretend otherwise: a green
  `due` here is a statement about 22% of the questions.

  **The `doctor` omission is the more interesting one, because somebody did read it.** The
  `mise.toml` comment is precise and correct — `doctor` has no check for a corpus that failed to
  fetch — and it was written by somebody who ran the report, found it did not cover the case in
  front of them, and closed it. That is the shape this corpus keeps finding: a tool consulted once
  for one question and never wired up for the eleven it does answer.
  [action-pages](action-pages.yml) found the same with class pages, [collected-verdict](collected-verdict.yml)
  with a figure nobody carried, and both times the cause was that **nothing brought the reader
  back**. A gate does.

  **`phases_after` is declined on the unit rather than on the count.** It reads 1 while this phase
  is open and 0 the moment it settles, which is correct — the branch is the ref. What it cannot do
  is say anything about it: declared at the kuten's 60 it reports *"none past 60 day(s)"* forever,
  because a phase here opens, settles and is deleted inside one working session. That is a green
  light for a condition that cannot arise, which is worse than a hole. A design whose phases spanned
  days would find the unit right; this one would need the clock to count commits, and it does not.
  [inference]

  **What this does not settle.** Whether the corpus should have an index at all. Three reports
  nagging about its absence is not evidence that it is wanted — `yidam query` answers structural
  questions and `pack` answers retrieval ones, both without embeddings, and no phase in this
  repository's life has been blocked on semantic search. The absence has been reported 350 times
  and requested zero, which is a ratio worth noticing before anybody reinstalls a binary with
  `--features index` to make a warning go away. `[open]`
