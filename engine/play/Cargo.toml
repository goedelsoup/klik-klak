[package]
name = "play"
default-run = "play"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Play a .game file: the menu, a choice, the response, and again."

[dependencies]
game-format.workspace = true
verb-menu.workspace = true
interaction-resolver.workspace = true
response-presenter.workspace = true
path-solver.workspace = true

# **A dev-dependency and never a dependency.** `.yidam/decisions/two-components.yml` runs the
# dependency instrument-to-engine, and this is the one place the arrow points back: a test that
# puts a figure the checker reports beside the turn a player took needs both, and a test is the
# only place that can exist. The engine cannot ask whether the game is still winnable and must
# not be able to — `.yidam/decisions/walked-in.yml`.
[dev-dependencies]
reachability = { path = "../../crates/reachability" }
