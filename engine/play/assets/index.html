<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrol · The Night Porter</title>
<style>
:root{color-scheme:dark;--ink:#e9e4d5;--muted:#a3afa9;--gold:#ddbb78;--bg:#101b1b;--line:#33433f;--panel:#172624}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#243735,var(--bg) 68%);color:var(--ink);font:15px/1.5 system-ui,sans-serif;min-height:100vh}main{max-width:1080px;margin:auto;padding:32px 32px 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}h1{font:36px/1.2 Georgia,serif;margin:6px 0}h2{font:24px/1.3 Georgia,serif;margin:0}.tools{display:flex;gap:8px}button{font:inherit;border:1px solid var(--line);border-radius:4px;background:#1b2d29;color:var(--ink);padding:10px 16px;cursor:pointer;transition:background .15s,border-color .15s}button:hover:not(:disabled){background:#2c433a;border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}button:disabled{cursor:default;opacity:.4}.room-bar{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border:1px solid var(--line);border-bottom:0;background:#132320}.room-bar span{font-size:12px;letter-spacing:.08em;color:var(--muted)}#stage{position:relative;aspect-ratio:16/9;background:#172925;border:1px solid var(--line);overflow:hidden}canvas{display:block;width:100%;height:100%}#targets{position:absolute;inset:0;pointer-events:none}.target{position:absolute;padding:0;border:0;background:transparent!important;pointer-events:auto;border-radius:0;color:transparent}.target:hover:not(:disabled),.target:focus-visible{box-shadow:inset 0 0 0 1px #ddbb7870;border:0}.target span{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--ink);background:#0d1b19ed;padding:5px 10px;font-size:12px;border:1px solid var(--line)}.target:hover span,.target:focus-visible span{display:block}#speech{position:absolute;bottom:22px;left:5%;right:5%;background:#101c19f5;border:1px solid #b7a372;padding:20px 24px;box-shadow:0 8px 30px #0007}#speech[hidden]{display:none}#line{font:19px/1.55 Georgia,serif;margin:0 0 14px;max-width:760px}#dismiss{display:block;margin-left:auto;font-size:12px;padding:6px 12px;color:var(--gold)}.below{display:grid;grid-template-columns:1.15fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-top:0;min-height:144px}.below>section{padding:18px 20px;background:var(--panel)}.label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}#context{margin:0 0 12px;font-size:14px;color:var(--gold)}#actions,#inventory{display:flex;gap:7px;flex-wrap:wrap}#actions button,#inventory button{font-size:13px;padding:7px 11px;background:#20332e}#inventory button[aria-pressed=true]{border-color:var(--gold);background:#394331}.empty{color:var(--muted);font-size:13px;margin:0}footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted);padding:17px 0}#status{color:var(--gold);min-height:22px;margin:12px 0 0;font-size:13px}#load-file{display:none}.hint{max-width:600px}#ending{color:var(--gold)}@media(max-width:650px){main{padding:18px 12px}h1{font-size:28px}header{align-items:flex-start}.tools button{padding:8px;font-size:12px}.below{grid-template-columns:1fr}#line{font-size:15px}#speech{bottom:10px;padding:12px}footer{flex-direction:column;gap:6px}.room-bar{padding:12px}.room-bar span{font-size:10px}h2{font-size:20px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Klik Klak / A playable study</div><h1>The Night Porter</h1></div><div class="tools"><button id="save">Save game</button><button id="load">Load game</button><input id="load-file" type="file" accept=".save,text/plain" aria-label="Choose a saved game"></div></header>
<div class="room-bar"><h2 id="room">Opening the doors…</h2><span id="phase">NIGHT SHIFT · PATROL</span></div>
<div id="stage"><canvas id="canvas" width="960" height="540" aria-label="Room scene. Use the labelled targets to interact, or click the floor to walk."></canvas><div id="targets"></div><section id="speech" role="dialog" aria-label="Response" aria-live="polite" hidden><p id="line"></p><button id="dismiss">Continue ↵</button></section></div>
<div class="below"><section><div class="label">Interaction</div><p id="context">Choose something in the room.</p><div id="actions"></div></section><section><div class="label">Carrying</div><div id="inventory"><p class="empty">Empty pockets.</p></div></section></div>
<p id="status" role="status" aria-live="polite"></p>
<footer><span class="hint">Point at a target to see its name. Select an item to use it. Click the floor to walk.</span><span id="ending">TAB to explore · ENTER to continue</span></footer>
</main>
<script src="/client.js"></script>
</body></html>
