[package]
name = "reachability"
version.workspace = true
edition.workspace = true
description = "Whether every state a player can reach can still reach the ending."
license.workspace = true
publish.workspace = true

[dependencies]
game-format = { path = "../game-format" }
# The instrument depends on the subject, which reads backwards and is right: this crate checks a
# language, and the language's semantics are the engine's. One implementation, so the two cannot
# disagree. `.yidam/decisions/two-components.yml`.
verb-menu = { path = "../../engine/verb-menu" }
interaction-resolver = { path = "../../engine/interaction-resolver" }
